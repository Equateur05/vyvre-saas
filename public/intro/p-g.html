<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VYVRE — intro G · L’écriture de lumière</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;1,200&display=swap" rel="stylesheet">
<style>
:root{--e:cubic-bezier(.16,1,.3,1);--o:cubic-bezier(.65,0,.35,1);--W:clamp(190px,21vw,300px);--H:clamp(54px,5.6vw,78px)}
@property --r{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --x{syntax:'<percentage>';inherits:false;initial-value:-20%}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020203;overflow:hidden}
/* le fond fluide de l'accueil : il sort de l'ombre peu a peu */
#sig-gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0;transform:scale(1.18);
  -webkit-mask-image:radial-gradient(circle at 50% 48%,#000 calc(var(--r) - 22%),transparent var(--r));mask-image:radial-gradient(circle at 50% 48%,#000 calc(var(--r) - 22%),transparent var(--r));
  animation:forme 3.4s cubic-bezier(.45,0,.2,1) .05s forwards,part .8s var(--o) 4.05s forwards}
@keyframes forme{0%{opacity:0;filter:blur(26px) brightness(.25) contrast(.6)}40%{opacity:.55}to{opacity:.95;filter:blur(0) brightness(1) contrast(1);transform:none;--r:170%}}
#sig-grain{position:fixed;inset:-40%;z-index:1;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
.scene{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,1.8vw,22px);
  animation:sortie .8s var(--o) 4.05s forwards}
.mot{position:relative;z-index:4;font:200 clamp(17px,1.9vw,26px)/1 Inter,sans-serif;letter-spacing:.52em;padding-left:.52em;color:#fff;white-space:nowrap}
.sig{font:italic 200 clamp(10px,1vw,13px) Inter,sans-serif;letter-spacing:.24em;color:rgba(236,233,226,.72);opacity:0;transform:translateY(8px);animation:sig 1s var(--e) 3.2s forwards}
@keyframes sig{to{opacity:1;transform:none}}
@keyframes sortie{to{opacity:0;filter:blur(12px);transform:scale(1.045)}}
@keyframes part{to{opacity:0}}

/* un container dont le liseré est parcouru par une comete de lumiere ; VYVRE s'ecrit sous un trait lumineux */
.boite{position:relative;width:var(--W);height:var(--H);border-radius:999px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.96);
  animation:vient 1.2s var(--e) 1.9s forwards}
@keyframes vient{to{opacity:1;transform:none}}
.boite:before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:conic-gradient(from var(--a),rgba(255,255,255,.08) 0deg,rgba(255,255,255,.08) 250deg,rgba(236,210,150,.9) 320deg,#fff 350deg,rgba(255,255,255,.08) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:tourne 2.6s linear 1.9s infinite}
@keyframes tourne{to{--a:360deg}}
.boite:after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:radial-gradient(ellipse 120% 140% at 50% -40%,rgba(245,245,250,.32),rgba(120,120,130,.12) 40%,transparent 70%),rgba(8,8,10,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 70px -26px rgba(0,0,0,.95)}
.mot{-webkit-mask-image:linear-gradient(90deg,#000 var(--x),transparent calc(var(--x) + 12%));mask-image:linear-gradient(90deg,#000 var(--x),transparent calc(var(--x) + 12%));
  animation:ecrit 1.25s cubic-bezier(.65,0,.35,1) 2.45s forwards}
@keyframes ecrit{to{--x:110%}}
.trait{position:absolute;top:18%;bottom:18%;width:1px;left:14%;z-index:5;opacity:0;background:#fff;box-shadow:0 0 12px 2px rgba(255,244,215,.9),0 0 30px 6px rgba(236,210,150,.4);
  animation:passe 1.25s cubic-bezier(.65,0,.35,1) 2.45s forwards}
@keyframes passe{0%{opacity:0;left:12%}12%{opacity:1}88%{opacity:1}100%{opacity:0;left:88%}}

</style></head><body>
<div class="scene">
  <div class="boite"><i class="trait"></i><div class="mot" aria-label="VYVRE">VYVRE</div></div>
  <div class="sig">skin intelligence</div>
</div>
<script src="/intro/fumee.js"></script>
<script>
(function(){
  var fini=false;
  function dire(m){ try{ parent.postMessage({vyvreIntro:m},'*'); }catch(e){} }
  function fin(){ if(fini) return; fini=true; dire('fin'); }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ dire('debut'); }); });
  setTimeout(fin, 4850);
  addEventListener('pointerdown', fin); addEventListener('keydown', fin);
})();
</script>
</body></html>
