<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VYVRE — intro F · La mise au point</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;1,200&display=swap" rel="stylesheet">
<style>
:root{--e:cubic-bezier(.16,1,.3,1);--o:cubic-bezier(.65,0,.35,1);--W:clamp(190px,21vw,300px);--H:clamp(54px,5.6vw,78px)}
@property --r{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --x{syntax:'<percentage>';inherits:false;initial-value:-20%}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020203;overflow:hidden}
/* le fond fluide de l'accueil : il sort de l'ombre peu a peu */
#sig-gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0;transform:scale(1.18);
  -webkit-mask-image:radial-gradient(circle at 50% 48%,#000 calc(var(--r) - 22%),transparent var(--r));mask-image:radial-gradient(circle at 50% 48%,#000 calc(var(--r) - 22%),transparent var(--r));
  animation:forme 3.4s cubic-bezier(.45,0,.2,1) .05s forwards,part .8s var(--o) 4.05s forwards}
@keyframes forme{0%{opacity:0;filter:blur(26px) brightness(.25) contrast(.6)}40%{opacity:.55}to{opacity:.95;filter:blur(0) brightness(1) contrast(1);transform:none;--r:170%}}
#sig-grain{position:fixed;inset:-40%;z-index:1;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
.scene{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,1.8vw,22px);
  animation:sortie .8s var(--o) 4.05s forwards}
.mot{position:relative;z-index:4;font:200 clamp(17px,1.9vw,26px)/1 Inter,sans-serif;letter-spacing:.52em;padding-left:.52em;color:#fff;white-space:nowrap}
.sig{font:italic 200 clamp(10px,1vw,13px) Inter,sans-serif;letter-spacing:.24em;color:rgba(236,233,226,.72);opacity:0;transform:translateY(8px);animation:sig 1s var(--e) 3.2s forwards}
@keyframes sig{to{opacity:1;transform:none}}
@keyframes sortie{to{opacity:0;filter:blur(12px);transform:scale(1.045)}}
@keyframes part{to{opacity:0}}

/* VYVRE nait immense et flou dans le fluide, puis la mise au point le ramene, net et petit, dans son container */
.boite{position:relative;width:var(--W);height:var(--H);border-radius:28px;display:flex;align-items:center;justify-content:center}
.verre{position:absolute;inset:0;border-radius:inherit;opacity:0;overflow:hidden;
  background:radial-gradient(ellipse 120% 95% at 50% -22%,rgba(245,245,250,.8) 0%,rgba(200,200,210,.55) 13%,rgba(140,140,150,.32) 29%,rgba(70,70,80,.16) 52%,transparent 76%),linear-gradient(180deg,rgba(255,255,255,.07),transparent 42%),#050505;
  border:1px solid rgba(255,255,255,.18);box-shadow:0 40px 90px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.3);
  animation:vient 1.1s var(--e) 2.85s forwards}
.verre:after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse 100% 80% at 50% 115%,rgba(0,0,0,.88),transparent 62%)}
@keyframes vient{to{opacity:1}}
.mot{opacity:0;transform:scale(9);filter:blur(34px);animation:apparait 1.6s ease-out .7s forwards,point 1.5s cubic-bezier(.7,0,.15,1) 2.25s forwards}
@keyframes apparait{to{opacity:.16}}
@keyframes point{from{opacity:.16;transform:scale(9);filter:blur(34px)}to{opacity:1;transform:scale(1);filter:blur(0)}}

</style></head><body>
<div class="scene">
  <div class="boite"><div class="verre"></div><div class="mot" aria-label="VYVRE">VYVRE</div></div>
  <div class="sig">skin intelligence</div>
</div>
<script src="/intro/fumee.js"></script>
<script>
(function(){
  var fini=false;
  function dire(m){ try{ parent.postMessage({vyvreIntro:m},'*'); }catch(e){} }
  function fin(){ if(fini) return; fini=true; dire('fin'); }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ dire('debut'); }); });
  setTimeout(fin, 4850);
  addEventListener('pointerdown', fin); addEventListener('keydown', fin);
})();
</script>
</body></html>
