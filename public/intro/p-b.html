<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VYVRE — intro B · L’encre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;1,200&display=swap" rel="stylesheet">
<style>
/* 26/09 : l'intro « container ». La signature VYVRE — le container rond — se dessine d'un trait de lumiere,
   se remplit de verre, et VYVRE s'y pose lettre par lettre. Un reflet traverse, puis tout se dissout
   dans le noir de la page. CSS + un SVG : rien a compiler, 60 images/s. */
:root{--e:cubic-bezier(.16,1,.3,1);--o:cubic-bezier(.65,0,.35,1);
  --W:clamp(190px,21vw,300px);--H:clamp(54px,5.6vw,78px);--R:clamp(20px,2.1vw,28px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020203;overflow:hidden}
.halo{position:fixed;left:50%;top:48%;width:120vmax;height:80vmax;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(236,226,200,.09),rgba(236,226,200,.03) 45%,transparent 72%);opacity:0;animation:vient 2s var(--e) .2s forwards}
.grain{position:fixed;inset:-40%;opacity:.07;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,1.8vw,22px);
  animation:sortie .8s var(--o) 4.05s forwards}
/* le container */
.boite{position:relative;width:var(--W);height:var(--H);border-radius:var(--R);display:flex;align-items:center;justify-content:center;isolation:isolate}
.verre{position:absolute;inset:0;border-radius:var(--R);overflow:hidden;opacity:0;transform:scale(.985);
  background:
    radial-gradient(ellipse 120% 95% at 50% -22%,rgba(245,245,250,.86) 0%,rgba(200,200,210,.62) 13%,rgba(140,140,150,.38) 29%,rgba(70,70,80,.18) 52%,transparent 76%),
    linear-gradient(180deg,rgba(255,255,255,.07) 0%,transparent 42%),#050505;
  box-shadow:0 60px 140px -40px rgba(0,0,0,.95),0 0 90px -20px rgba(236,226,200,.18),inset 0 1px 0 rgba(255,255,255,.35);
  animation:remplir 1.1s var(--e) 2.55s forwards}
.verre:after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse 100% 80% at 50% 115%,rgba(0,0,0,.88),transparent 62%)}
/* le reflet qui traverse le verre, une fois */
.verre:before{content:'';position:absolute;top:-30%;bottom:-30%;width:28%;left:-40%;z-index:2;transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,250,235,.16),rgba(255,255,255,.34),rgba(255,250,235,.16),transparent);
  filter:blur(6px);animation:balaye 1.2s var(--o) 3.55s forwards}
/* le trait de lumiere qui dessine le contour */
svg.trait{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);overflow:visible;z-index:3;pointer-events:none}
svg.trait rect{fill:none;stroke:url(#or);stroke-width:.9;stroke-dasharray:1 1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 6px rgba(255,244,215,.9)) drop-shadow(0 0 18px rgba(236,210,150,.45));
  animation:dessine 1.25s var(--o) 1.75s forwards,veille .9s ease 3.10s forwards,eclat 1.1s var(--o) 3.85s forwards}
/* VYVRE */
.mot{position:relative;z-index:4;font:200 clamp(17px,1.9vw,26px)/1 Inter,sans-serif;letter-spacing:.52em;padding-left:.52em;color:#fff;white-space:nowrap}
.mot span{display:inline-block;opacity:0;filter:blur(16px);transform:translateY(.14em) scale(1.04);animation:lettre 1.15s var(--e) forwards;
  text-shadow:0 0 30px rgba(255,255,255,.18)}
.mot span:nth-child(1){animation-delay:2.78s}.mot span:nth-child(2){animation-delay:2.86s}.mot span:nth-child(3){animation-delay:2.94s}
.mot span:nth-child(4){animation-delay:3.02s}.mot span:nth-child(5){animation-delay:3.10s}
.mot .reflet{position:absolute;inset:0;padding-left:.52em;color:transparent;-webkit-background-clip:text;background-clip:text;pointer-events:none;opacity:1;filter:none;transform:none;animation:none;
  background-image:linear-gradient(100deg,transparent 38%,rgba(255,246,222,.95) 50%,transparent 62%);background-size:280% 100%;background-position:130% 0;opacity:0;
  animation:refl 1.2s var(--o) 3.65s forwards}
.mot .reflet{animation-fill-mode:both}
.sig{font:italic 200 clamp(10px,1vw,13px) Inter,sans-serif;letter-spacing:.24em;color:rgba(236,233,226,.72);opacity:0;transform:translateY(8px);animation:sig 1s var(--e) 3.50s forwards}
@keyframes vient{to{opacity:1}}
@keyframes dessine{to{stroke-dashoffset:0}}
@keyframes veille{to{stroke-opacity:.35}}
@keyframes eclat{0%{stroke-opacity:.35}35%{stroke-opacity:1}100%{stroke-opacity:.5}}
@keyframes remplir{to{opacity:1;transform:none}}
@keyframes balaye{to{left:115%}}
@keyframes lettre{to{opacity:1;filter:blur(0);transform:none}}
@keyframes refl{0%{opacity:0}2%{opacity:1}100%{background-position:-50% 0;opacity:1}}
@keyframes sig{to{opacity:1;transform:none}}
@keyframes sortie{0%{opacity:1;filter:blur(0);transform:scale(1)}100%{opacity:0;filter:blur(12px);transform:scale(1.045)}}
.fin .halo{animation:vient 2s var(--e) .2s forwards,part .8s var(--o) 4.05s forwards}
@keyframes part{to{opacity:0}}

/* le fond fluide de l'accueil, qui se forme peu a peu */
@property --r{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --h{syntax:'<percentage>';inherits:false;initial-value:0%}
#sig-gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#sig-grain{position:fixed;inset:-40%;z-index:1;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
.halo,.grain{z-index:1}.scene{z-index:5}

#sig-gl{opacity:0;filter:blur(40px) saturate(.6);transform:scale(1.35) rotate(-4deg);
  -webkit-mask-image:radial-gradient(ellipse calc(var(--r) * 1.3) var(--r) at 50% 52%,#000 40%,transparent 72%);mask-image:radial-gradient(ellipse calc(var(--r) * 1.3) var(--r) at 50% 52%,#000 40%,transparent 72%);
  animation:encre 3.6s cubic-bezier(.45,0,.2,1) .05s forwards}
@keyframes encre{0%{filter:blur(40px) saturate(.6) brightness(.25)}45%{opacity:.6}to{opacity:.95;filter:blur(0) saturate(1);transform:none;--r:190%}}
/* le container se condense dans l'encre, sans contour dessine */
svg.trait rect{animation:dessine .01s linear 2.00s forwards,veille .9s ease 2.10s forwards,eclat 1.1s var(--o) 3.70s forwards!important;stroke-opacity:0}
.verre{animation:condense 1.4s var(--e) 1.85s forwards!important;filter:blur(18px);transform:scale(1.12)}
@keyframes condense{to{opacity:1;filter:blur(0);transform:none}}
</style></head><body class="fin">
<div class="halo"></div><div class="grain"></div>
<div class="scene">
  <div class="boite">
    <div class="verre"></div>
    <svg class="trait" aria-hidden="true"><defs><linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e0"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#e2c98f"/></linearGradient></defs>
      <rect x="0.6" y="0.6" pathLength="1"/></svg>
    <div class="mot" aria-label="VYVRE"><span>V</span><span>Y</span><span>V</span><span>R</span><span>E</span><span class="reflet" aria-hidden="true">VYVRE</span></div>
  </div>
  <div class="sig">skin intelligence</div>
</div>
<script src="/intro/fumee.js"></script>
<script>
(function(){
  /* le contour suit la taille reelle du container, a tout ecran */
  var b=document.querySelector('.boite'), r=document.querySelector('svg.trait rect');
  function taille(){ var w=b.offsetWidth, h=b.offsetHeight, rad=parseFloat(getComputedStyle(b).borderRadius)||40;
    r.setAttribute('width', w+0.8); r.setAttribute('height', h+0.8); r.setAttribute('rx', rad); r.setAttribute('ry', rad); }
  taille(); addEventListener('resize', taille);
  var fini=false;
  function dire(m){ try{ parent.postMessage({vyvreIntro:m},'*'); }catch(e){} }
  function fin(){ if(fini) return; fini=true; dire('fin'); }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ dire('debut'); }); });
  setTimeout(fin, 4850);
  addEventListener('pointerdown', fin); addEventListener('keydown', fin);
})();
</script>
</body></html>
