<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VYVRE — intro E · Le verre liquide</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;1,200&display=swap" rel="stylesheet">
<style>
:root{--e:cubic-bezier(.16,1,.3,1);--o:cubic-bezier(.65,0,.35,1);--W:clamp(190px,21vw,300px);--H:clamp(54px,5.6vw,78px)}
@property --r{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --x{syntax:'<percentage>';inherits:false;initial-value:-20%}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020203;overflow:hidden}
/* le fond fluide de l'accueil : il sort de l'ombre peu a peu */
#sig-gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0;transform:scale(1.18);
  -webkit-mask-image:radial-gradient(circle at 50% 48%,#000 calc(var(--r) - 22%),transparent var(--r));mask-image:radial-gradient(circle at 50% 48%,#000 calc(var(--r) - 22%),transparent var(--r));
  animation:forme 3.4s cubic-bezier(.45,0,.2,1) .05s forwards,part .8s var(--o) 4.05s forwards}
@keyframes forme{0%{opacity:0;filter:blur(26px) brightness(.25) contrast(.6)}40%{opacity:.55}to{opacity:.95;filter:blur(0) brightness(1) contrast(1);transform:none;--r:170%}}
#sig-grain{position:fixed;inset:-40%;z-index:1;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
.scene{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,1.8vw,22px);
  animation:sortie .8s var(--o) 4.05s forwards}
.mot{position:relative;z-index:4;font:200 clamp(17px,1.9vw,26px)/1 Inter,sans-serif;letter-spacing:.52em;padding-left:.52em;color:#fff;white-space:nowrap}
.sig{font:italic 200 clamp(10px,1vw,13px) Inter,sans-serif;letter-spacing:.24em;color:rgba(236,233,226,.72);opacity:0;transform:translateY(8px);animation:sig 1s var(--e) 3.2s forwards}
@keyframes sig{to{opacity:1;transform:none}}
@keyframes sortie{to{opacity:0;filter:blur(12px);transform:scale(1.045)}}
@keyframes part{to{opacity:0}}

/* un point de lumiere nait, s'etire en container de verre liquide, VYVRE s'y pose */
.pill{position:relative;width:8px;height:8px;border-radius:999px;display:flex;align-items:center;justify-content:center;opacity:0;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(16px) saturate(1.8) brightness(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.8) brightness(1.25);
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.45),inset -1px -1px 0 rgba(0,0,0,.35),inset 0 10px 22px -12px rgba(255,255,255,.5),0 30px 60px -24px rgba(0,0,0,.9),0 0 0 rgba(255,244,215,0);
  animation:point .7s var(--e) 1.6s forwards,cercle .55s var(--e) 2.15s forwards,etire .9s cubic-bezier(.7,0,.2,1) 2.55s forwards}
.pill:before{content:'';position:absolute;left:14%;right:14%;top:1px;height:1px;border-radius:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);opacity:.8}
@keyframes point{0%{opacity:0;transform:scale(0)}60%{opacity:1;box-shadow:inset 0 0 0 rgba(0,0,0,0),0 0 28px 8px rgba(255,244,215,.55)}to{opacity:1;transform:scale(1);box-shadow:inset 0 0 0 rgba(0,0,0,0),0 0 18px 4px rgba(255,244,215,.35)}}
@keyframes cercle{to{width:var(--H);height:var(--H)}}
@keyframes etire{to{width:var(--W);height:var(--H)}}
.pill .mot span{display:inline-block;opacity:0;filter:blur(10px);animation:lettre 1s var(--e) forwards}
.pill .mot{letter-spacing:1.3em;animation:resserre 1.3s var(--e) 3.0s forwards}
@keyframes resserre{to{letter-spacing:.52em}}
.pill .mot span:nth-child(1){animation-delay:3.0s}.pill .mot span:nth-child(2){animation-delay:3.07s}.pill .mot span:nth-child(3){animation-delay:3.14s}.pill .mot span:nth-child(4){animation-delay:3.21s}.pill .mot span:nth-child(5){animation-delay:3.28s}
@keyframes lettre{to{opacity:1;filter:blur(0)}}

</style></head><body>
<div class="scene">
  <div class="pill"><div class="mot" aria-label="VYVRE"><span>V</span><span>Y</span><span>V</span><span>R</span><span>E</span></div></div>
  <div class="sig">skin intelligence</div>
</div>
<script src="/intro/fumee.js"></script>
<script>
(function(){
  var fini=false;
  function dire(m){ try{ parent.postMessage({vyvreIntro:m},'*'); }catch(e){} }
  function fin(){ if(fini) return; fini=true; dire('fin'); }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ dire('debut'); }); });
  setTimeout(fin, 4850);
  addEventListener('pointerdown', fin); addEventListener('keydown', fin);
})();
</script>
</body></html>
