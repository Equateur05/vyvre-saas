<script type="module">
/* ==========================================================================
   LE SCAN CHEVEUX — GUIDAGE SANS ORDRES, MISE EN SCENE « ENCRE QUI COULE ».
   On ne dit pas « tournez a gauche » : on montre ce qui reste a lire, et la
   personne tourne d'elle-meme pour le remplir (le principe de Face ID).

   Tout est REEL sur la camera :
   - l'orientation de la tete : « face_landmarker » de MediaPipe (Google,
     Apache 2.0), 478 points du visage, lus a chaque image ;
   - les cheveux : « hair_segmenter », le meme modele que le reste du scan.
   Une zone ne se remplit que si la tete est dans le bon angle ET que des
   cheveux sont vraiment vus a ce moment-la. Huit images gardees par cote,
   avec les quatre conditions (angle, cheveux vus, immobilite, nettete) ; la
   plus nette de chaque cote part au moteur, accompagnee de SON masque de
   cheveux, par postMessage « vyvre-scan-fini ». Aucune photo de la personne
   n'est montree a l'ecran.

   24/09 — CE QUI A CHANGE, ET RIEN D'AUTRE : LE DESSIN.
   La tete en points (le « double » en three.js, a droite de l'ecran) est
   retiree : Charles a refuse toutes les versions de double du visage. A sa
   place, la mise en scene retenue parmi les dix propales — ENCRE QUI COULE
   (propals/cheveux/scanA.html?p=1). Elle reste dans le bleu de la marque,
   elle montre l'avancement SANS montrer un second visage, et c'est la plus
   rapide : 45 images par seconde contre 36 pour l'ancienne page.
   La chaine de lecture au-dessus n'a pas bouge d'une ligne : memes modeles,
   memes conditions, memes phrases de guidage, memes douze langues, memes
   replis (camera refusee, visage jamais vu), meme masque envoye au moteur.

   LA PORTE DE SORTIE — ?tete=1
   Si Charles change d'avis, ?tete=1 rend l'ancienne tete en points, telle
   quelle (et ?tete=1&g=2 ou &g=3 les deux autres dessins de l'epoque).
   three.js n'est plus importe au chargement : il n'est telecharge QUE sous
   ?tete=1 (import dynamique dans monterTete()). La page par defaut ne
   demande plus rien au CDN — l'importmap ne reste dans le <head> que pour
   cette porte de sortie.
   Le parametre se lit aussi sur la page parente : ouvrir /cheveux/?tete=1
   suffit, l'iframe le reprend (index.html n'a pas ete touche).

   ?demo=1 : une tete fictive tourne toute seule (pour voir sans camera, et
   c'est ecrit a l'ecran) · ?photo=p_232 : une photo traitee comme la camera ·
   ?debug=1 : les angles lus et le cout du dessin en millisecondes.
   ========================================================================== */
import { FilesetResolver, ImageSegmenter, FaceLandmarker } from "/cheveux/vendor/mediapipe/vision_bundle.mjs";

const $ = id => document.getElementById(id);

/* ---------------- les douze langues ----------------
   vy-i18n.js charge son dictionnaire apres ce module. Tant qu'il n'est pas la,
   T() rend null et on laisse le francais ecrit dans le HTML : jamais de clef
   nue a l'ecran. dit() pose la clef sur l'element ; VY.apply() la repeindra a
   chaque changement de langue. */
let LANGUE_PRETE = false;
function T(k, v){
  if(window.VY && VY.t){ const s = VY.t(k, v); if(s !== k) return s; }
  return null;
}
function dit(el, k){
  if(!el) return;
  el.setAttribute('data-i18n', k);
  const s = T(k); if(s !== null) el.textContent = s;
}
document.addEventListener('vy:lang', function(){
  LANGUE_PRETE = true;
  if(window.VY && VY.apply) VY.apply();
});
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1', DEBUG = Q.get('debug') === '1';
/* ?demo=1&sans=droite : la tete fictive ne montre jamais ce cote (pour voir la
   validation avant 100 %) */
const SANS = (Q.get('sans') || '').split(',').filter(Boolean);

/* les quatre zones, nommees par le geste qui les montre */
const ZONES = ['face','gauche','droite','dessus'];
const NOMS = { face:'le devant', gauche:'le côté gauche', droite:'le côté droit', dessus:'le dessus' };
const CLEF_COTE = { face:'hcg.cote.face', gauche:'hcg.cote.gauche', droite:'hcg.cote.droite', dessus:'hcg.cote.dessus' };
const nomCote = z => T(CLEF_COTE[z]) ?? NOMS[z];
const DUREE_ZONE = { face:1.0, gauche:1.3, droite:1.3, dessus:1.4 };   /* secondes de lecture par zone */
const Z = { face:0, gauche:0, droite:0, dessus:0 };
let pose = 'face', vuCheveux = 0, visage = false, yawV = 0, pitchV = 0, finiDepuis = 0, bloqueDepuis = performance.now();

/* ---------------- camera ---------------- */
const vid = $('vid'); let src = null, miroir = true;
async function ouvrirSource(){
  if(!DEMO && !PHOTO){
    try{
      const st = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }, audio:false });
      vid.srcObject = st; await vid.play();
      await new Promise(r => vid.videoWidth ? r() : vid.onloadedmetadata = r);
      src = vid; return;
    }catch(e){}
  }
  if(!DEMO && !PHOTO){
    /* 23/09 — avant, une camera refusee affichait le portrait d'une INCONNUE et
       le compteur montait tout seul jusqu'a 100 % sans qu'aucune image existe :
       le parcours restait bloque la pour toujours. Desormais on rend la main. */
    dit($('note'), 'hcg.cam.t');
    dit($('phraseTxt'), 'hcg.cam.p');
    journal('camera-refusee');
    if(parent !== window) parent.postMessage({ type:'vyvre-scan-camera-refusee' }, location.origin);
    return;
  }
  const img = new Image(); img.src = '/_test_masque/' + (PHOTO || 'p_073') + '.jpg'; await img.decode(); src = img; miroir = false;
  dit($('note'), DEMO ? 'hcg.demo' : 'hcg.photo');
}
const SW = () => src.videoWidth || src.naturalWidth, SH = () => src.videoHeight || src.naturalHeight;
const PHOTO = Q.get('photo');   /* ?photo=p_073 : une photo traitee comme la camera (pour verifier le double) */
const demo = () => DEMO || (src !== vid && !PHOTO);

/* ---------------- lecture : visage + cheveux ---------------- */
const PW = 256; let PH = 192;
const petit = document.createElement('canvas'), pctx = petit.getContext('2d', { willReadFrequently:true });
const mH = document.createElement('canvas'), mHc = mH.getContext('2d');
let HAIR, idH, segH, face, dernierVisage = null, dernierVisageT = -1e9, tour = 0, dern = 0, pitchRef = null, refN = 0;
async function ouvrirLecture(){
  const fs = await FilesetResolver.forVisionTasks("/cheveux/vendor/mediapipe/wasm");
  segH = await ImageSegmenter.createFromOptions(fs, { baseOptions:{ modelAssetPath:"/cheveux/vendor/mediapipe/modeles/hair_segmenter.tflite", delegate:'CPU' },
    runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
  const fo = d => ({ baseOptions:{ modelAssetPath:"/cheveux/vendor/mediapipe/modeles/face_landmarker.task", delegate:d },
    runningMode:'VIDEO', numFaces:1 });
  try { face = await FaceLandmarker.createFromOptions(fs, fo('GPU')); }
  catch(e){ try { face = await FaceLandmarker.createFromOptions(fs, fo('CPU')); } catch(e2){ console.warn('visage', e2); } }
  window.__lecture = { cheveux: !!segH, visage: !!face };
}
function tailles(){
  PH = Math.round(PW * SH() / SW());
  for(const c of [petit, mH]){ c.width = PW; c.height = PH; }
  idH = mHc.createImageData(PW, PH); HAIR = new Float32Array(PW*PH);
  for(let i=0;i<PW*PH;i++){ idH.data[i*4]=idH.data[i*4+1]=idH.data[i*4+2]=255; }
}
function lire(now){
  if(!segH || now - dern < 60) return; dern = now;
  /* 05/10 : iOS passe de paysage a portrait apres l'ouverture ; l'image d'analyse suit le vrai format (sinon elle etait ecrasee) */
  if(SW() && Math.round(PW * SH() / SW()) !== PH) tailles();
  pctx.save(); if(miroir){ pctx.translate(PW,0); pctx.scale(-1,1); } pctx.drawImage(src,0,0,PW,PH); pctx.restore();
  try{
    if(tour++ % 2 === 0){
      segH.segmentForVideo(petit, now, r => {
        const cm = r.confidenceMasks; if(!cm) return;
        const m = (cm[1] || cm[0]).getAsFloat32Array(); let n = 0;
        /* la barbe et la moustache ne sont pas la chevelure : tout ce qui est
           sous le nez, entre les deux joues, est retire */
        let bx0 = -1, bx1 = -1, by0 = PH;
        /* 27/09 — seulement si le visage vient d'etre vu : dos a la camera, l'ancienne
           position du visage effacait un rectangle de cheveux sur la nuque */
        if(dernierVisage && !demo() && visage && now - dernierVisageT < 400){ const L = dernierVisage; const xa = L[234].x*PW, xb = L[454].x*PW;
          bx0 = Math.min(xa,xb) - 4; bx1 = Math.max(xa,xb) + 4; by0 = L[2].y*PH; }
        for(let i=0;i<PW*PH;i++){
          let v = m[i]; const x = i % PW, y = (i / PW) | 0;
          if(y > by0 && x > bx0 && x < bx1) v = 0;
          HAIR[i] = HAIR[i]*.3 + v*.7; idH.data[i*4+3] = sm((HAIR[i]-.45)/.35)*255; if(HAIR[i] > .5) n++;
        }
        mHc.putImageData(idH,0,0); vuCheveux = n / (PW*PH);
        apresLecture();
        cm.forEach(x => x.close && x.close());
      });
    } else if(!demo() && face){
      const r = face.detectForVideo(petit, now);
      const L = r.faceLandmarks && r.faceLandmarks[0];
      if(L){ dernierVisage = L; dernierVisageT = now; }
      visage = !!L;
      jugerImage(now, L);
      if(L){
        /* le lacet : ou est le bout du nez entre les deux joues (image en miroir,
           donc « a gauche de l'ecran » = vers la gauche de la personne) */
        const nez = L[1], jg = L[234], jd = L[454], yeux = { y:(L[33].y + L[263].y)/2 }, men = L[152], front = L[10];
        const lx = Math.min(jg.x, jd.x), rx = Math.max(jg.x, jd.x);
        yawV = ((nez.x - lx) / (rx - lx || 1) - .5) * 2;          /* -1 .. 1 */
        const p = (nez.y - yeux.y) / (men.y - front.y || 1);      /* grandit quand on baisse la tete */
        if(refN < 20 && Math.abs(yawV) < .2){ pitchRef = pitchRef == null ? p : pitchRef*.9 + p*.1; refN++; }
        pitchV = pitchRef == null ? 0 : (p - pitchRef) / .1;
      }
    }
  }catch(e){}
}

/* la pose, telle qu'on la lit ; en demo, une tete fictive qui fait le tour */
function lirePose(now, dt){
  if(demo()){
    const t = (now / 1000) % 12;
    const cible = t < 2 ? 'face' : t < 4.5 ? 'gauche' : t < 7 ? 'droite' : t < 9.5 ? 'dessus' : 'face';
    const yc = cible === 'gauche' ? -.75 : cible === 'droite' ? .75 : 0, pc = cible === 'dessus' ? 1.4 : 0;
    yawV = lerp(yawV, yc, 1 - Math.exp(-dt*3)); pitchV = lerp(pitchV, pc, 1 - Math.exp(-dt*3)); visage = true;
    vuCheveux = Math.max(vuCheveux, .05);
  }
  if(visage && pitchV > .6) descenteVue = now;
  /* 27/09 (test iPhone de Charles) — trois poses qui ne se lisaient pas :
     - le PROFIL : tourne franchement, le visage n'est plus detecte et le cote
       n'etait plus compte. On retient le dernier cote vu (2,5 s) ;
     - le DESSUS : il fallait baisser la tete tres fort (tangage 1,1). Le front
       dans la moitie basse de l'image avec beaucoup de cheveux au-dessus suffit ;
     - la NUQUE : dos a la camera, aucune zone ne la prenait (« votre visage
       n'est pas visible », bloque). Des cheveux sans visage comptent desormais
       pour la zone sans visage, et partent au moteur sous le nom « nuque ». */
  if(visage && Math.abs(yawV) > .35){ coteVu = yawV < 0 ? 'gauche' : 'droite'; coteVuT = now; }
  const hautFront = (visage && dernierVisage) ? dernierVisage[10].y : null;
  let p = 'face'; poseReelle = null;
  if((visage && (pitchV > .9 || (hautFront !== null && hautFront > .40 && pitchV > .3 && vuCheveux > .15))) ||
     (!visage && now - descenteVue < 2500 && vuCheveux > .12)) p = 'dessus';
  else if(!visage && !demo() && now - coteVuT < 2500 && vuCheveux > .08) p = coteVu;
  else if(!visage && !demo() && vuCheveux > .15){ p = 'dessus'; poseReelle = 'nuque'; }
  else if(!visage && !demo()) p = 'aucune';
  else if(yawV < -.42) p = 'gauche';
  else if(yawV > .42) p = 'droite';
  else if(Math.abs(yawV) > .2) p = 'entre';
  pose = p;
  if(demo() && ZONES.includes(p) && !SANS.includes(p) && now - dernierePrise > 150 && IMAGES[p].length < N_IMAGES){
    IMAGES[p].push(null); dernierePrise = now; Z[p] = IMAGES[p].length / N_IMAGES; bloqueDepuis = now;
    if(!MEILLEURE[p]) MEILLEURE[p] = { net:0, demo:true };
  }
}
/* ==========================================================================
   LE VRAI COMPTE. Chaque cote demande N_IMAGES images exploitables. Une image
   n'est gardee que si le visage est vu dans le bon angle, que des cheveux sont
   visibles (plus de 3 % de l'image), qu'elle est nette (variance du laplacien
   sur les cheveux, jugee par rapport a cette camera) et que la personne ne
   bouge pas. Le pourcentage affiche = images gardees / N_IMAGES.
   Pour chaque cote on garde la plus nette, en pleine definition et SANS miroir :
   c'est elle que le moteur lira (les memes poses que l'ancien parcours).
   ========================================================================== */
const N_IMAGES = 8, SEUIL_BOUGE = .03;
const IMAGES = { face:[], gauche:[], droite:[], dessus:[] };
const MEILLEURE = { face:null, gauche:null, droite:null, dessus:null };
let coteVu = 'gauche', coteVuT = -1e9, poseReelle = null;
let descenteVue = -1e9, dernierePrise = 0, grisPrec = null, refus = '', refusDepuis = 0;
const NETS = [];
let TOL = 1, SECOURS = null, LUM = -1;   /* LUM : lumiere mesuree (0 noir, 1 blanc) */
const SEUIL_SOMBRE = .42;   /* TOL < 1 : conditions assouplies ; SECOURS : la meilleure image ou le visage etait vu */
function seuilNet(){ if(NETS.length < 8) return .00024; const t = NETS.slice().sort((a,b) => a-b); return Math.max(.00024, t[Math.floor(t.length*.8)] * .6); }
function jugerImage(now, L){
  const d = pctx.getImageData(0, 0, PW, PH).data, n = PW*PH, g = new Float32Array(n);
  for(let i=0;i<n;i++) g[i] = (d[i*4]*.3 + d[i*4+1]*.59 + d[i*4+2]*.11) / 255;
  /* 26/09 — la lumiere : 90e centile de la luminance de TOUTE l'image. Une piece eclairee a toujours
     des zones claires, quelle que soit la couleur de peau ; dans le noir, tout est sombre. */
  { const h = new Uint32Array(32); for(let i=0;i<n;i+=4) h[Math.min(31, (g[i]*32)|0)]++;
    let acc = 0, tot = 0; for(let k=0;k<32;k++) tot += h[k];
    let p90 = 1; for(let k=0;k<32;k++){ acc += h[k]; if(acc >= tot*.9){ p90 = (k+.5)/32; break; } }
    LUM = LUM < 0 ? p90 : LUM*.85 + p90*.15; JOURNAL.lum = +LUM.toFixed(2); }
  let bouge = 0; if(grisPrec){ for(let i=0;i<n;i+=3) bouge += Math.abs(g[i] - grisPrec[i]); bouge /= (n/3); }
  grisPrec = g;
  let s1 = 0, s2 = 0, k = 0; const peu = vuCheveux < .03;
  for(let y=1;y<PH-1;y+=2) for(let x=1;x<PW-1;x+=2){
    const i = y*PW + x; if(!peu && HAIR[i] < .5) continue;
    const l = 4*g[i] - g[i-1] - g[i+1] - g[i-PW] - g[i+PW]; s1 += l; s2 += l*l; k++;
  }
  const net = k ? s2/k - (s1/k)*(s1/k) : 0;
  NETS.push(net); if(NETS.length > 60) NETS.shift();
  const z = pose; let r = '';
  if(z !== 'aucune'){ JOURNAL.visageVu++; if(vuCheveux > JOURNAL.cheveuxMax) JOURNAL.cheveuxMax = vuCheveux; if(net > JOURNAL.netMax) JOURNAL.netMax = net;
    if(z === 'face' && (!SECOURS || net > SECOURS.net) && vuCheveux > .005) SECOURS = { net, image: prendreImage(), masque: prendreMasque(), faceBox: boiteVisage(L) }; }
  if(!ZONES.includes(z)) r = z === 'aucune' ? 'visage' : 'angle';
  else if(IMAGES[z].length >= N_IMAGES) r = '';
  else if(vuCheveux < .03 * TOL) r = 'cheveux';
  else if(bouge > SEUIL_BOUGE / TOL) r = 'bouge';
  else if(net < seuilNet() * TOL) r = 'flou';
  if(r){ JOURNAL.refus[r] = (JOURNAL.refus[r]||0) + 1; if(r !== refus){ refus = r; refusDepuis = now; } return; }
  refus = '';
  if(ZONES.includes(z) && IMAGES[z].length < N_IMAGES && now - dernierePrise > 120){
    IMAGES[z].push(net); dernierePrise = now; Z[z] = IMAGES[z].length / N_IMAGES; bloqueDepuis = now;
    if(!MEILLEURE[z] || net > MEILLEURE[z].net) MEILLEURE[z] = { net, image: prendreImage(), masque: prendreMasque(), faceBox: boiteVisage(L), pose: poseReelle || z };
  }
}
/* l'image pour le moteur : pleine definition (1100 px), non miroir */
function prendreImage(){
  const sc = Math.min(1, 1100 / SW()), c = document.createElement('canvas');
  c.width = Math.round(SW()*sc); c.height = Math.round(SH()*sc);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c;
}
/* LE MASQUE DE CHEVEUX QUI PART AVEC L'IMAGE.
   Le moteur du scan segmentait les cheveux lui-meme, par la couleur, en partant
   d'une bande au-dessus du front : quand le decor ressemblait aux cheveux, le
   decor entrait dans la mesure (audit du 23/09 : du feuillage lu comme une
   coloration vive, un fond magenta lu comme une chevelure coloree). Or ce
   guidage possede deja un masque juste, celui de hair_segmenter, et il le
   calcule a chaque image. On le lui donne donc, au lieu de le lui faire refaire
   moins bien.
   Format : PNG en niveaux de gris, 256 px de large, 0 = pas de cheveux,
   255 = cheveux certains. Le moteur le reechantillonne a sa propre resolution.
   Il est remis A L'ENDROIT : l'apercu camera est en miroir, l'image envoyee au
   moteur ne l'est pas, et un masque retourne lirait la chevelure du mauvais cote.
   HAIR est lisse dans le temps et calcule une image sur deux : le masque envoye
   peut donc avoir une image de retard sur la photo. A tete immobile — et on
   n'enregistre que quand elle l'est — cela ne se voit pas. */
const mEnvoi = document.createElement('canvas'), mEnvoiCtx = mEnvoi.getContext('2d');
function prendreMasque(){
  if(!HAIR) return null;
  mEnvoi.width = PW; mEnvoi.height = PH;
  const id = mEnvoiCtx.createImageData(PW, PH);
  for(let y=0;y<PH;y++) for(let x=0;x<PW;x++){
    const v = Math.round(clamp(HAIR[y*PW + (miroir ? PW-1-x : x)], 0, 1) * 255);
    const j = (y*PW + x)*4;
    id.data[j] = id.data[j+1] = id.data[j+2] = v; id.data[j+3] = 255;
  }
  mEnvoiCtx.putImageData(id, 0, 0);
  return { png: mEnvoi.toDataURL('image/png'), largeur: PW, hauteur: PH };
}
/* le cadre du visage, dans l'image non miroir */
function boiteVisage(L){
  if(!L) return null;
  let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
  for(const q of L){ const x = miroir ? 1 - q.x : q.x; if(x < x0) x0 = x; if(x > x1) x1 = x; if(q.y < y0) y0 = q.y; if(q.y > y1) y1 = q.y; }
  const sc = Math.min(1, 1100 / SW()), w = SW()*sc, h = SH()*sc;
  return { x:x0*w, y:y0*h, width:(x1-x0)*w, height:(y1-y0)*h };
}
/* fini : on rend au scan les meilleures images de chaque cote */
let rendu = false;
document.getElementById('finir').addEventListener('click', function(){
  if(!finiDepuis){ finiDepuis = performance.now(); document.body.classList.add('fini'); }
  rendre();
});
function rendre(){
  if(rendu) return;
  if(demo()){ rendu = true; window.__rendu = { poses: ZONES.filter(z => MEILLEURE[z]), pct: Math.round(total()*100) }; return; }
  rendu = true;
  const poses = ZONES.filter(z => MEILLEURE[z]).map(z => ({ pose:MEILLEURE[z].pose || z, image:MEILLEURE[z].image.toDataURL('image/jpeg', .9), masque:MEILLEURE[z].masque, faceBox:MEILLEURE[z].faceBox }));
  try{ if(src && src.srcObject) src.srcObject.getTracks().forEach(t => t.stop()); }catch(e){}
  journal('fini', { poses: poses.map(p => p.pose).join(',') });
  if(parent !== window) parent.postMessage({ type:'vyvre-scan-fini', poses }, location.origin);
}
const total = () => ZONES.reduce((a,z) => a + Z[z], 0) / 4;
const manquante = () => ZONES.find(z => Z[z] < 1);

/* ---------------- toile 2D ---------------- */
const cv = $('cv'), ctx = cv.getContext('2d'); let W=0, H=0, DPR=1;
function taille(){ DPR = Math.min(devicePixelRatio||1, 1.25); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', taille);
const tmp = document.createElement('canvas'), tx = tmp.getContext('2d');
function cadre(){ const s = Math.max(W/SW(), H/SH()); const w = SW()*s, h = SH()*s; return { x:(W-w)/2, y:(H-h)/2, w, h }; }
function peindre(c, r, f){ c.save(); if(f) c.filter = f; if(miroir){ c.translate(r.x + r.w, r.y); c.scale(-1,1); c.drawImage(src,0,0,r.w,r.h); } else c.drawImage(src, r.x, r.y, r.w, r.h); c.restore(); }
function cheveux(r, couleur, mode){
  if(tmp.width !== cv.width || tmp.height !== cv.height){ tmp.width = cv.width; tmp.height = cv.height; tx.setTransform(DPR,0,0,DPR,0,0); }
  tx.save(); tx.setTransform(1,0,0,1,0,0); tx.clearRect(0,0,tmp.width,tmp.height); tx.restore();
  tx.save(); tx.imageSmoothingQuality = 'high'; tx.drawImage(mH, r.x, r.y, r.w, r.h);
  tx.globalCompositeOperation = 'source-in'; tx.fillStyle = couleur; tx.fillRect(0,0,W,H); tx.restore();
  ctx.save(); ctx.globalCompositeOperation = mode || 'color'; ctx.drawImage(tmp, 0, 0, W, H); ctx.restore();
}
const BLEU = a => 'rgba(64,170,255,' + a + ')';

/* ==========================================================================
   LE DESSIN — « ENCRE QUI COULE » (propale 1 de scanA.html, reprise mot pour
   mot). Le masque nourrit un ecoulement : chaque grain nait sur un vrai pixel
   de cheveux, suit le sens des meches (tenseur de structure), retombe et sort
   par le bas. A mesure qu'un cote est lu, son encre CESSE de couler et se fige
   en bleu profond ; le depot en bas de l'ecran, lui, EST le pourcentage.
   Rien ici ne mesure quoi que ce soit : tout est deja mesure au-dessus.
   ========================================================================== */
let T0 = performance.now(), tPrec = T0, msDessin = 0;
/* la porte de sortie, lue une fois : sur cette page ou sur la page parente */
const TETE = (function(){
  if(Q.get('tete') === '1') return true;
  try{ if(parent !== window && new URLSearchParams(parent.location.search).get('tete') === '1') return true; }catch(e){}
  return false;
})();
let hookMasqueTete = null, dessinTete = null;
/* le seul point ou la lecture touche au dessin : a chaque nouveau masque */
function apresLecture(){ if(TETE){ if(hookMasqueTete) hookMasqueTete(); } else apresMasque(); }

/* ---------------- les voiles : la personne reste en couleur ----------------
   On n'assombrit QUE la ou du texte doit rester lisible : le bas (la phrase et
   le pourcentage) et une bande en haut (la marque et le selecteur). */
/* UN SEUL VOILE, PAS DEUX. Chaque remplissage plein cadre se paie ; le haut
   (la marque, le selecteur) et le bas (la phrase, le pourcentage) tiennent
   dans un seul degrade. */
function voiles(haut, bas){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,'+haut+')');
  g.addColorStop(.20, 'rgba(0,0,0,0)');
  g.addColorStop(.50, 'rgba(0,0,0,0)');
  g.addColorStop(.80, 'rgba(0,0,0,'+(bas*.50)+')');
  g.addColorStop(1, 'rgba(0,0,0,'+bas+')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function vignette(a, r0){
  const g = ctx.createRadialGradient(W*.5, H*.42, Math.min(W,H)*(r0 || .16), W*.5, H*.42, Math.max(W,H)*.56);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.30,'rgba(0,0,0,'+(a*.30)+')');
  g.addColorStop(.58,'rgba(0,0,0,'+(a*.74)+')'); g.addColorStop(.82,'rgba(0,0,0,'+(a*.94)+')');
  g.addColorStop(1,'rgba(0,0,0,'+a+')');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}


/* ==========================================================================
   CE QU'ON DEDUIT DU MASQUE, A CHAQUE NOUVELLE LECTURE (8 fois par seconde).
   Trois choses, et rien de plus : la boite des cheveux, la part de chaque
   cote dans chaque pixel, et — pour l'or seulement — le sens des meches.
   ========================================================================== */
const REP = { cx:128, w:40, yFront:70 };
const BOITE = { x0:0, x1:0, y0:0, y1:0, ok:false };
let ZW = null, DIRX = null, DIRY = null, COH = null, NBUF = 0, GRAINES = [], versionMasque = 0;
let Jxx = null, Jyy = null, Jxy = null, Kxx = null, Kyy = null, Kxy = null, GRIS = null;

function allouer(n){
  if(NBUF === n) return;
  NBUF = n;
  ZW = new Uint8Array(n*4);                                   /* la part des 4 cotes, par pixel */
  DIRX = new Float32Array(n); DIRY = new Float32Array(n); COH = new Float32Array(n);
  GRIS = new Float32Array(n);
  Jxx = new Float32Array(n); Jyy = new Float32Array(n); Jxy = new Float32Array(n);
  Kxx = new Float32Array(n); Kyy = new Float32Array(n); Kxy = new Float32Array(n);
}

/* appelee juste apres que HAIR a ete remis a jour */
function apresMasque(){
  const n = PW*PH; allouer(n);
  let x0 = PW, x1 = 0, y0 = PH, y1 = 0, k = 0;
  for(let y=0;y<PH;y++){ const o = y*PW;
    for(let x=0;x<PW;x++) if(HAIR[o+x] > .5){ k++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  BOITE.ok = k > 80;
  if(BOITE.ok){ BOITE.x0=x0; BOITE.x1=x1; BOITE.y0=y0; BOITE.y1=y1; }
  /* les reperes : le visage s'il vient d'etre lu, sinon la boite des cheveux
     (demo, contre-jour) — de cette facon le dessin ne s'effondre jamais */
  const L = dernierVisage;
  if(L && performance.now() - dernierVisageT < 2500){
    REP.cx = (L[234].x + L[454].x)/2 * PW;
    REP.w = Math.max(10, Math.abs(L[454].x - L[234].x) * PW / 2);
    REP.yFront = L[10].y * PH;
  } else if(BOITE.ok){
    REP.cx = (x0+x1)/2; REP.w = Math.max(10, (x1-x0)*.40); REP.yFront = y0 + (y1-y0)*.40;
  }
  parts();
  tenseur();                  /* l'encre coule le long des meches */
  graines();
  versionMasque++;
}

/* LA PART DE CHAQUE COTE DANS CHAQUE PIXEL.
   Un pixel n'appartient pas a un cote : il en montre plusieurs, plus ou moins.
   On lui donne donc quatre poids, doux, dont la somme fait 1 — sans quoi le
   figeage dessinerait des frontieres droites en travers de la chevelure.
   Le cote « gauche » (la personne tourne vers SA gauche) devoile la masse qui
   part vers la DROITE de l'ecran : c'est le miroir, et c'est deja la
   convention du reste du parcours. */
function parts(){
  const cx = REP.cx, w = REP.w, yf = REP.yFront;
  for(let y=0;y<PH;y++){
    const dy = (yf - y) / Math.max(6, w*.85);
    const haut = sm((dy - .05) / .55);
    for(let x=0;x<PW;x++){
      const i = y*PW + x, j = i*4;
      const dx = (x - cx) / w;
      const g = sm((dx - .12)/.42) * (1 - haut*.72);
      const d = sm((-dx - .12)/.42) * (1 - haut*.72);
      const de = haut * (1 - .5*sm((Math.abs(dx) - .85)/.5));
      let f = 1 - clamp(g + d + de, 0, 1); if(f < 0) f = 0;
      const s = (f + g + d + de) || 1;
      ZW[j] = (f/s)*255; ZW[j+1] = (g/s)*255; ZW[j+2] = (d/s)*255; ZW[j+3] = (de/s)*255;
    }
  }
}
/* combien de ce pixel a deja ete lu : 0 = encore liquide, 1 = fige */
function froid(i){
  const j = i*4;
  return (ZW[j]*Z.face + ZW[j+1]*Z.gauche + ZW[j+2]*Z.droite + ZW[j+3]*Z.dessus) / 255;
}

/* LE SENS DES MECHES, PAR TENSEUR DE STRUCTURE.
   Sobel sur l'image en gris, puis on moyenne les produits des gradients sur un
   petit voisinage (flou en croix, separable). La direction propre dominante est
   celle du GRADIENT ; une meche court perpendiculairement a son gradient, donc
   on tourne de 90 degres. La coherence dit si l'endroit a vraiment un sens
   (une meche) ou pas (une masse plate) : les reflets n'y coulent qu'a peine. */
const R_TENS = 3;
function tenseur(){
  if(!BOITE.ok) return;
  /* on ne calcule QUE sur la boite des cheveux, un peu elargie : le decor n'a
     pas de meches, et le tenseur sur toute l'image coutait quatre images par
     seconde pour rien. */
  const M = R_TENS + 2;
  const x0 = Math.max(1, BOITE.x0 - M), x1 = Math.min(PW-2, BOITE.x1 + M);
  const y0 = Math.max(1, BOITE.y0 - M), y1 = Math.min(PH-2, BOITE.y1 + M);
  const d = pctx.getImageData(x0, y0, x1-x0+1, y1-y0+1).data, lw = x1-x0+1;
  for(let y=y0;y<=y1;y++){ const o = (y-y0)*lw;
    for(let x=x0;x<=x1;x++){ const j = (o + x-x0)*4;
      GRIS[y*PW+x] = (d[j]*.30 + d[j+1]*.59 + d[j+2]*.11) / 255; } }
  for(let y=y0+1;y<y1;y++) for(let x=x0+1;x<x1;x++){
    const i = y*PW + x;
    const gx = (GRIS[i+1-PW] + 2*GRIS[i+1] + GRIS[i+1+PW]) - (GRIS[i-1-PW] + 2*GRIS[i-1] + GRIS[i-1+PW]);
    const gy = (GRIS[i+PW-1] + 2*GRIS[i+PW] + GRIS[i+PW+1]) - (GRIS[i-PW-1] + 2*GRIS[i-PW] + GRIS[i-PW+1]);
    Jxx[i] = gx*gx; Jyy[i] = gy*gy; Jxy[i] = gx*gy;
  }
  const R = R_TENS;
  for(let y=y0+1;y<y1;y++) for(let x=x0+1+R;x<x1-R;x++){
    const i = y*PW + x; let a=0,b=0,c=0;
    for(let k=-R;k<=R;k++){ const q = i+k; a += Jxx[q]; b += Jyy[q]; c += Jxy[q]; }
    Kxx[i]=a; Kyy[i]=b; Kxy[i]=c;
  }
  for(let y=y0+1+R;y<y1-R;y++) for(let x=x0+1+R;x<x1-R;x++){
    const i = y*PW + x;
    if(HAIR[i] < .35){ COH[i] = 0; continue; }                 /* pas de cheveux : rien a orienter */
    let a=0,b=0,c=0;
    for(let k=-R;k<=R;k++){ const q = i+k*PW; a += Kxx[q]; b += Kyy[q]; c += Kxy[q]; }
    const th = .5 * Math.atan2(2*c, a - b);                    /* le gradient */
    DIRX[i] = -Math.sin(th); DIRY[i] = Math.cos(th);           /* la meche : 90 degres de plus */
    const tr = a + b;
    COH[i] = tr > 1e-6 ? clamp(Math.hypot(a-b, 2*c) / tr, 0, 1) : 0;
  }
}

/* quelques milliers de points ou il y a vraiment des cheveux : c'est la que
   naissent l'encre et l'or (jamais dans le decor) */
function graines(){
  GRAINES.length = 0;
  for(let y=0;y<PH;y+=2) for(let x=0;x<PW;x+=2){ const i = y*PW+x; if(HAIR[i] > .55) GRAINES.push(i); }
}
const auHasard = () => GRAINES.length ? GRAINES[(Math.random()*GRAINES.length)|0] : -1;

/* DESSINER DEUX MILLE FILETS SANS DEUX MILLE APPELS AU PINCEAU.
   Premiere mesure : 17 images par seconde sur l'or. Un beginPath()/stroke()
   par grain coutait, a lui seul, plus que la lecture MediaPipe. On range donc
   les segments dans des seaux — deux familles de couleur, huit tranches
   d'opacite — et on ne trace que seize fois par image. */
const N_SEAU = 8, SEAUX = [[], []];
for(const f of SEAUX) for(let i=0;i<N_SEAU;i++) f.push([]);
function seauxVides(){ for(const f of SEAUX) for(const s of f) s.length = 0; }
function seau(fam, a, x0, y0, x1, y1){
  let k = (a*N_SEAU)|0; if(k < 0) k = 0; if(k > N_SEAU-1) k = N_SEAU-1;
  const s = SEAUX[fam][k]; s.push(x0, y0, x1, y1);
}
function seauxTracer(c, couleurs, largeurs){
  for(let f=0;f<2;f++) for(let k=0;k<N_SEAU;k++){
    const s = SEAUX[f][k]; if(!s.length) continue;
    c.globalAlpha = (k + .5) / N_SEAU;
    c.strokeStyle = couleurs[f]; c.lineWidth = largeurs[f];
    c.beginPath();
    for(let i=0;i<s.length;i+=4){ c.moveTo(s[i], s[i+1]); c.lineTo(s[i+2], s[i+3]); }
    c.stroke();
  }
  c.globalAlpha = 1;
}

/* du petit cadre vers l'ecran */
let RC = { x:0, y:0, w:1, h:1 };
const EX = x => RC.x + (x / PW) * RC.w, EY = y => RC.y + (y / PH) * RC.h;
const ES = () => RC.w / PW;

/* une toile de trainees, a demi-definition : c'est elle qui donne la matiere
   (encre ou or) sans couter une image pleine a chaque fois */
const tr1 = document.createElement('canvas'), t1 = tr1.getContext('2d');
function tailleTrainee(){ const w = Math.round(W*.5), h = Math.round(H*.5); if(tr1.width !== w){ tr1.width = w; tr1.height = h; } }
function effacerTrainee(){ t1.setTransform(1,0,0,1,0,0); t1.clearRect(0,0,tr1.width,tr1.height); }
const TX = x => (EX(x) / W) * tr1.width, TY = y => (EY(y) / H) * tr1.height;

/* ==========================================================================
   1 · ENCRE — VOS CHEVEUX SONT UNE ENCRE VIVANTE.
   Le masque nourrit un ecoulement : chaque grain suit le contour de la
   chevelure (la tangente au gradient du masque), retombe, et sort par le bas
   en filets. Ce n'est pas un decor pose a cote : sans cheveux vus, il ne coule
   rien. A mesure qu'un cote est lu, son encre CESSE de couler et se fige : le
   bleu profond se pose, le bord devient net, et le liquide ne repart plus de
   la. A la fin la tete entiere est une encre seche, nette, bleu nuit.
   ========================================================================== */
const N_GRAIN = 1050;   /* mesure : au-dela, l'encre ne gagne plus rien a l'oeil et coute des images */
const GR = { x:new Float32Array(N_GRAIN), y:new Float32Array(N_GRAIN), px:new Float32Array(N_GRAIN),
             py:new Float32Array(N_GRAIN), vx:new Float32Array(N_GRAIN), vy:new Float32Array(N_GRAIN),
             v:new Float32Array(N_GRAIN), e:new Float32Array(N_GRAIN) };
function naitre(i){
  const g = auHasard();
  if(g < 0){ GR.v[i] = 0; return; }
  GR.x[i] = (g % PW) + Math.random() - .5; GR.y[i] = ((g / PW)|0) + Math.random() - .5;
  GR.px[i] = GR.x[i]; GR.py[i] = GR.y[i];
  GR.vx[i] = 0; GR.vy[i] = 0; GR.v[i] = .6 + Math.random()*.8; GR.e[i] = .35 + Math.random()*.65;
}
function encreVide(){ for(let i=0;i<N_GRAIN;i++) GR.v[i] = 0; effacerTrainee(); FLAQUE.h = 0; }
const FLAQUE = { h:0 };
const encreCv = document.createElement('canvas'), ec = encreCv.getContext('2d');
let encreId = null, encreVersion = -1, encreZ = -1;

/* L'ENCRE SECHE. Elle ne recouvre pas la chevelure d'un aplat : elle la TEINT.
   Le bleu prend la teinte (mode « color » : la luminosite reste celle des
   cheveux, donc les meches restent des meches), puis un passage en « multiply »
   l'epaissit jusqu'au bleu nuit, et un liseré clair en « screen » redonne au
   bord la nettete de l'encre seche. Trois passages, pas un aplat. */
const rimCv = document.createElement('canvas'), rc2 = rimCv.getContext('2d');
let rimId = null;
/* Le bord du masque monte de 256 px a 1 400 : sans adoucissement il fait des
   marches d'escalier. On floute UNE fois, a la taille du masque (ou un pixel
   ne coute rien), au lieu de trois fois plein cadre : la premiere version
   tombait a 17 images par seconde rien que pour cela. */
const douxCv = document.createElement('canvas'), dc = douxCv.getContext('2d');
const rimDouxCv = document.createElement('canvas'), rdc = rimDouxCv.getContext('2d');
function adoucir(){
  for(const c of [douxCv, rimDouxCv]) if(c.width !== PW || c.height !== PH){ c.width = PW; c.height = PH; }
  dc.setTransform(1,0,0,1,0,0); dc.clearRect(0,0,PW,PH); dc.filter = 'blur(.85px)'; dc.drawImage(encreCv,0,0); dc.filter = 'none';
  rdc.setTransform(1,0,0,1,0,0); rdc.clearRect(0,0,PW,PH); rdc.filter = 'blur(1.15px)'; rdc.drawImage(rimCv,0,0); rdc.filter = 'none';
}
function encreFigee(){
  if(!ZW) return;
  const n = PW*PH, tt = Z.face + Z.gauche + Z.droite + Z.dessus;
  if(encreVersion === versionMasque && Math.abs(encreZ - tt) < 1e-4) return;
  encreVersion = versionMasque; encreZ = tt;
  if(encreCv.width !== PW || encreCv.height !== PH){
    encreCv.width = rimCv.width = PW; encreCv.height = rimCv.height = PH;
    encreId = ec.createImageData(PW, PH); rimId = rc2.createImageData(PW, PH);
  }
  const D = encreId.data, Rd = rimId.data;
  for(let i=0;i<n;i++){
    const j = i*4, h = HAIR[i];
    if(h < .26){ D[j+3] = 0; Rd[j+3] = 0; continue; }
    const f = froid(i);
    if(f < .02){ D[j+3] = 0; Rd[j+3] = 0; continue; }
    const dedans = sm((h - .44)/.14);
    const bord = sm((h - .34)/.11) * (1 - sm((h - .56)/.13));
    /* un bleu d'encre, pas un bleu de perruque : le mode « color » prend la
       saturation de CETTE couleur telle quelle, donc elle est deja rabattue */
    D[j] = 74; D[j+1] = 108; D[j+2] = 206;
    D[j+3] = clamp(dedans * f * 255, 0, 255);
    Rd[j] = 120; Rd[j+1] = 186; Rd[j+2] = 250;
    Rd[j+3] = clamp((bord*1.0 + dedans*.14) * f * f * 215, 0, 255);
  }
  ec.putImageData(encreId, 0, 0); rc2.putImageData(rimId, 0, 0);
  adoucir();
}
function dessin1(t, dt){
  peindre(ctx, RC, 'saturate(1.04) brightness(.58) contrast(1.08)');
  vignette(.94, .13); voiles(.55, .90);

  /* L'ECOULEMENT. Dans la chevelure, l'encre suit le SENS DES MECHES (tenseur
     de structure) melange a la tangente du bord ; dehors, elle tombe. */
  tailleTrainee();
  t1.setTransform(1,0,0,1,0,0);
  t1.globalCompositeOperation = 'destination-out';
  t1.fillStyle = 'rgba(0,0,0,.075)'; t1.fillRect(0,0,tr1.width,tr1.height);
  t1.globalCompositeOperation = 'lighter'; t1.lineCap = 'round';
  seauxVides();
  for(let i=0;i<N_GRAIN;i++){
    if(GR.v[i] <= 0){ if(Math.random() < .3) naitre(i); continue; }
    let x = GR.x[i], y = GR.y[i];
    const xi = x|0, yi = y|0;
    if(xi < 1 || xi > PW-2 || yi < 1 || yi > PH-2){ GR.v[i] = 0; continue; }
    const k = yi*PW + xi, h = HAIR[k], dedans = h > .42;
    const f = froid(k);
    if(f > .5 && dedans){ GR.v[i] -= dt*2.2; if(GR.v[i] <= 0) continue; }
    /* le sens de la meche, remis vers le bas */
    let mx = DIRX[k], my = DIRY[k]; if(my < 0){ mx = -mx; my = -my; }
    const co = COH[k];
    /* la tangente au bord du masque : l'encre epouse la silhouette */
    const gx = HAIR[k+1] - HAIR[k-1], gy = HAIR[k+PW] - HAIR[k-PW];
    let tx = gy, ty = -gx; if(ty < 0){ tx = -tx; ty = -ty; }
    let dx, dy2;
    if(dedans){ const p = .35 + .55*co; dx = mx*p + tx*(1-p)*1.6; dy2 = my*p + ty*(1-p)*1.6 + .30; }
    else { dx = tx*.5 + Math.sin(y*.19 + t*.0011 + i*.7)*.13; dy2 = 1.25; }
    const nn = Math.hypot(dx, dy2) || 1; dx /= nn; dy2 /= nn;
    const vit = (dedans ? 20 + 24*co : 34) * dt;
    GR.px[i] = x; GR.py[i] = y;
    x += dx*vit*GR.v[i]; y += dy2*vit*GR.v[i];
    GR.x[i] = x; GR.y[i] = y;
    GR.v[i] -= dt*(dedans ? .10 : .30);
    if(y > PH-1){ GR.v[i] = 0; continue; }
    const a = clamp(GR.e[i] * GR.v[i] * (dedans ? (.16 + .26*co) : .24) * (1 - f*.85), 0, 1);
    if(a < .02) continue;
    seau(dedans ? 0 : 1, a, TX(GR.px[i]), TY(GR.py[i]), TX(x), TY(y));
  }
  const lg1 = (tr1.width/W) * ES();
  seauxTracer(t1, ['rgba(92,168,240,1)', 'rgba(56,126,214,1)'], [1.2*lg1 + .45, .85*lg1 + .35]);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .78;
  ctx.drawImage(tr1, 0, 0, W, H); ctx.restore();

  /* l'encre seche : teinte, epaisseur, puis le bord net */
  encreFigee();
  ctx.save();
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(douxCv, RC.x, RC.y, RC.w, RC.h);
  ctx.globalCompositeOperation = 'screen';   ctx.drawImage(rimDouxCv, RC.x, RC.y, RC.w, RC.h);
  ctx.restore();

  /* LE DEPOT. L'encre sortie par le bas s'accumule : le niveau EST le
     pourcentage lu — la meme mesure, montree autrement. */
  const tt = total();
  FLAQUE.h += (tt * H * .048 - FLAQUE.h) * clamp(dt*2, 0, 1);
  if(FLAQUE.h > .8){
    const yb = H - FLAQUE.h;
    ctx.save(); ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, yb);
    for(let x=0;x<=W;x+=18) ctx.lineTo(x, yb + Math.sin(x*.0125 + t*.0017)*2.4 + Math.sin(x*.0043 - t*.0009)*1.7);
    ctx.lineTo(W, H); ctx.closePath();
    const g = ctx.createLinearGradient(0, yb, 0, H);
    g.addColorStop(0, 'rgba(10,46,104,.88)'); g.addColorStop(.35, 'rgba(4,20,56,.95)'); g.addColorStop(1, 'rgba(1,6,20,.99)');
    ctx.fillStyle = g; ctx.fill();
    ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = 'rgba(132,196,255,.62)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
}

/* ==========================================================================
   LA PORTE DE SORTIE — ?tete=1 : L'ANCIENNE TETE EN POINTS.
   Ce qui suit est le code du 23/09, mot pour mot. Il ne s'execute QUE si
   ?tete=1 est demande, et c'est seulement a ce moment-la que three.js part
   au telechargement. Tant que personne ne le demande, la page ne paie rien
   pour lui : ni octets, ni contexte WebGL, ni images par seconde.
   ========================================================================== */
async function monterTete(){
  const THREE = await import('three');
  const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
  const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
  const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
  const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');

  /* ==========================================================================
     A · LE DOUBLE — une tete de points, a droite, qui tourne comme la votre.
     Ses cheveux sont en quatre zones ; elles passent du gris au bleu quand
     elles ont ete lues. On tourne pour remplir le gris.
     ========================================================================== */
  const gl = $('gl');
  const re = new THREE.WebGLRenderer({ canvas:gl, antialias:true, alpha:true }); re.setPixelRatio(Math.min(devicePixelRatio,1.5)); re.setClearColor(0x000000, 0);
  const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, .1, 50); cam.position.set(0, .15, 7.2);
  const co = new EffectComposer(re); co.addPass(new RenderPass(sc, cam));
  const bloom = new UnrealBloomPass(new THREE.Vector2(512,512), .7, .5, .2); co.addPass(bloom); co.addPass(new OutputPass());
  const tete = new THREE.Group(); sc.add(tete);
  const NPT = 14000, pos = new Float32Array(NPT*3), col = new Float32Array(NPT*3), zon = new Int8Array(NPT), seuil = new Float32Array(NPT);
  function rnd(n){ const s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); }
  for(let i=0;i<NPT;i++){
    /* une tete : ellipsoide, un peu plus haute que large, menton affine */
    const u = rnd(i)*2-1, a = rnd(i*3.7)*Math.PI*2, s = Math.sqrt(1-u*u);
    let x = s*Math.cos(a)*.92, y = u*1.18, z = s*Math.sin(a)*1.02;
    if(y < -.3){ const k = 1 - (-.3 - y)*.45; x *= k; z *= k; }
    if(z > .5 && Math.abs(x) < .16 && y > -.45 && y < .2) z += .22 * (1 - Math.abs(x)/.16) * (1 - Math.abs(y + .12)/.33);   /* le nez */
    if(z > .5 && y < .12 && y > -.02 && Math.abs(Math.abs(x) - .32) < .14) z -= .06;                                     /* les orbites */
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
    /* les cheveux : tout le haut et l'arriere, sauf le visage */
    const visageZ = z > .35 && y < .42 && y > -1.1 && Math.abs(x) < .72;
    let zz = -1;
    if(!visageZ && (y > .05 || z < -.1)){
      if(y > .72 && Math.abs(x) < .55 && z > -.55) zz = 3;           /* dessus */
      else if(x < -.3 && y > -.7) zz = 2;                              /* montre en tournant vers la droite de l'ecran */
      else if(x > .3 && y > -.7) zz = 1;                               /* montre en tournant vers la gauche */
      else if(z > .1) zz = 0;                                          /* devant */
      else zz = 3 + 1;                                                 /* arriere : jamais lu seul */
    }
    if(zz >= 0){ const k = 1.07 + rnd(i*4.4)*.06; pos[i*3]*=k; pos[i*3+1]*=k; pos[i*3+2]*=k; }   /* le volume des cheveux, au-dessus du crane */
    zon[i] = zz; seuil[i] = rnd(i*9.1);
  }
  const gt = new THREE.BufferGeometry(); gt.setAttribute('position', new THREE.BufferAttribute(pos,3)); gt.setAttribute('color', new THREE.BufferAttribute(col,3));
  tete.add(new THREE.Points(gt, new THREE.PointsMaterial({ size:.018, vertexColors:true, transparent:true, opacity:.95, blending:THREE.AdditiveBlending, depthWrite:false })));
  function couleursTete(t){
    for(let i=0;i<NPT;i++){
      const zz = zon[i]; let r, g, b;
      if(zz < 0){ const k = pos[i*3+2] > .35 ? .22 + .3*Math.max(0,pos[i*3+2]-.35) : .05; r = g = b = k; }   /* exactement la version du 21/09 23h41 */         /* visage : on doit le reconnaitre */
      else if(zz === 4){ r = g = b = .05; }                                                    /* arriere */
      else {
        const lu = Z[ZONES[zz]] > seuil[i], actif = ZONES[zz] === pose && Z[ZONES[zz]] < 1;
        if(lu){ r = .35; g = .78; b = 1.3; }
        else { const k = actif ? .45 + .25*Math.sin(t/120 + i) : .26; r = g = b = k; }
      }
      col[i*3]=r; col[i*3+1]=g; col[i*3+2]=b;
    }
    gt.attributes.color.needsUpdate = true;
  }
  function tailleGL(){ const w = gl.clientWidth || innerWidth, h = gl.clientHeight || innerHeight; re.setSize(w, h, false); co.setSize(w, h); cam.aspect = w/h; cam.updateProjectionMatrix(); }
  addEventListener('resize', tailleGL);

  /* ---------------- les trois dessins ---------------- */
  let G = clamp(+(Q.get('g') || 1), 1, 3);
  /* ---------------- LE DOUBLE, DESSINE D'APRES VOTRE TETE ----------------
     23/09 — premiere version : un ellipsoide de principe, le meme pour tout le
     monde (« on dirait un Playmobil »). Deuxieme : la bonne forme, mais un
     ballon rond autour d'un visage plat et un halo de poussiere en guise de
     cheveux. Celle-ci DESSINE :
     - le crane est serre sur l'anatomie : largeur de tete = largeur des
       pommettes, sommet juste au-dessus de la ligne de cheveux MESUREE, et la
       silhouette du volume est celle du masque de cheveux, direction par
       direction : le contour du double et celui de la tete se superposent ;
     - le visage a du relief : chaque point est eclaire par la normale de son
       triangle, et les aretes vives du maillage (dos du nez, arcades,
       pommettes, levres, machoire) recoivent plus de points et plus de lumiere.
       De trois quarts, on lit le profil du nez ;
     - les cheveux sont des MECHES : des segments qui partent du front, passent
       sur le crane et tombent derriere et sur les cotes — le sens ou les cheveux
       poussent. Leur longueur est celle que le masque a mesuree a cet endroit :
       une coupe ras donne un duvet colle au crane, un volume donne de longues
       meches. Une coiffure, pas un nuage.
     Rien d'autre ne bouge : memes couleurs, meme passage au bleu par zone, et
     14 000 sommets en tout comme la tete de principe. Tout est construit dans
     LE REPERE DE LA TETE (unite = demi-largeur du visage) et pose dans l'image
     par la matrice mTete : le double tourne parce que la tete tourne. */
  const racine = new THREE.Group(); sc.add(racine);
  const corps = new THREE.Group(); corps.matrixAutoUpdate = false; racine.add(corps);

  function P(l){ return [ (l.x - .5) * PW, -(l.y - .5) * PH, -l.z * PW ]; }
  const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]], nrm = a => { const n = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/n, a[1]/n, a[2]/n]; };
  const dot = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2], crs = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

  /* le maillage : les triangles se deduisent des aretes (trois points relies
     deux a deux). Les yeux et la bouche sont des trous dans ce maillage ; on y
     seme quand meme un peu de poussiere, sinon le double a des orbites vides. */
  const ARETES = FaceLandmarker.FACE_LANDMARKS_TESSELATION || [];
  const TRIS = (function(){
    const vois = new Map(), add = (a,b) => { if(!vois.has(a)) vois.set(a, new Set()); vois.get(a).add(b); };
    ARETES.forEach(e => { add(e.start, e.end); add(e.end, e.start); });
    const vu = new Set(), out = [];
    ARETES.forEach(e => { const A = vois.get(e.start), B = vois.get(e.end); if(!A || !B) return;
      for(const c of A){ if(!B.has(c)) continue; const k = [e.start, e.end, c].sort((x,y) => x-y).join(','); if(vu.has(k)) continue; vu.add(k); out.push(e.start, e.end, c); } });
    return out;
  })();
  function anneau(con){ const s = new Set(); (con || []).forEach(c => { s.add(c.start); s.add(c.end); }); return [...s]; }
  const TROUS = [FaceLandmarker.FACE_LANDMARKS_LEFT_EYE, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE, FaceLandmarker.FACE_LANDMARKS_LIPS]
    .map(anneau).filter(z => z.length > 2);

  /* LE MEME NOMBRE DE SOMMETS QU'AVANT : 8 800 points de visage + 2 600 meches
     a deux bouts = 14 000, exactement la tete de principe (une seule des deux
     est affichee a la fois). Des meches longues et peu nombreuses dessinent une
     coiffure ; des meches courtes et serrees ne font qu'une fourrure. */

  /* ---- le visage ----

  const vI = new Int32Array(NV*3), vW = new Float32Array(NV*3), vJ = new Float32Array(NV*3), vRid = new Float32Array(NV);

  function semer(Ll){

      const v = [Ll[c*3]-Ll[a*3], Ll[c*3+1]-Ll[a*3+1], Ll[c*3+2]-Ll[a*3+2]];

      /* le maillage n'a pas d'endroit ni d'envers : on tourne la normale vers
         l'exterieur de la tete */

  /* les mesures de la chevelure, lissees ; valeurs de depart = cheveux courts */
  const CH = { haut:1.8, cote:1.2, long:-.6, dens:1, front:1.05, menton:-1.55, frontZ:.9, large:1 }, CHc = Object.assign({}, CH);
  /* LE PROFIL DE LA CHEVELURE : le rayon du masque de cheveux, direction par

      if(HAIR[y*PW + x] < .5) continue;

  /* LE CRANE, SERRE SUR L'ANATOMIE.

     large) ; l'avant se cale juste derriere le front lu, donc l'arriere tombe

     Sommet : JUSTE SOUS la ligne de cheveux mesuree, jamais au-dessus. */
  const CRANE = { cy:.3, cz:-.4, rx:1.02, ry:1.2, rz:1.28 };

      let lg = tombe ? (.22 + .22*mBase[i*4+1]) * (.5 + .5*clamp(CH.long, 0, 2))

      const lis = front + .16*Math.min(1, x*x) + (mBase[i*4+2] - .5)*.13;

      mPos[i*6+3] = x + gx*lg; mPos[i*6+4] = y + gy*lg; mPos[i*6+5] = z + gz*lg;
      mNor[i*3] = nx; mNor[i*3+1] = ny; mNor[i*3+2] = nz;

  /* le visage, replie dans le repere de la tete */

    let A = P(L[234]), B = P(L[454]); if(A[0] > B[0]){ const c = A; A = B; B = c; }

      let nx = (Lloc[b+1]-Lloc[a+1])*(Lloc[c+2]-Lloc[a+2]) - (Lloc[b+2]-Lloc[a+2])*(Lloc[c+1]-Lloc[a+1]);

      let nz = (Lloc[b]-Lloc[a])*(Lloc[c+1]-Lloc[a+1])   - (Lloc[b+1]-Lloc[a+1])*(Lloc[c]-Lloc[a]);
      const nl = Math.hypot(nx, ny, nz) || 1; nx/=nl; ny/=nl; nz/=nl;

      const face = nx*VUE[0] + ny*VUE[1] + nz*VUE[2];
      const e0 = 1 - Math.abs(face), bord = e0*e0*e0;               /* le trait du bord : le profil du nez */
      const vers = .30 + .70*sm((face + .04) / .34);                 /* l'autre joue s'efface */
      const k = clamp((.09 + .68*lam*lam + .45*bord + .75*vRid[i]*(.35 + .65*lam)) * vers, .03, .98);
      vCol[i*3] = vCol[i*3+1] = vCol[i*3+2] = k;
    }
    gV.attributes.position.needsUpdate = true; gV.attributes.color.needsUpdate = true;
    /* les mesures que le crane attend : largeur, front, menton, avancee du front */
    CHc.large = clamp(large, .95, 1.18);
    CHc.front = clamp(Lloc[10*3+1] - .05, .7, 1.5);
    CHc.menton = clamp(Lloc[152*3+1], -2.2, -1.1);
    CHc.frontZ = clamp(Lloc[10*3+2], .3, 1.4);
    /* la coiffure suit les mesures, sans a-coups */
    let bouge = false;
    for(const k2 of ['haut','cote','long','dens','front','menton','frontZ','large']){
      const n = CH[k2] + (CHc[k2] - CH[k2]) * .08; if(Math.abs(n - CH[k2]) > .004) bouge = true; CH[k2] = n;
    }
    if(!mechesFaites || (bouge && now - dernCoque > 160)){ faireMeches(); mechesFaites = true; dernCoque = now; }
    couleursMeches(t);
    /* la tete se pose dans l'image : la matrice porte l'orientation ET l'echelle */
    mTete.set(X[0]*w, Y[0]*w, Zv[0]*w, O[0],
              X[1]*w, Y[1]*w, Zv[1]*w, O[1],
              X[2]*w, Y[2]*w, Zv[2]*w, O[2],
              0, 0, 0, 1);
    corps.matrix.copy(mTete); corps.matrixWorldNeedsUpdate = true;
    /* tout est recentre sur le volume de la tete et mis a l'echelle de l'ecran,
       a la place exacte de l'ancienne tete de principe */
    const S = ECHELLE / w, cy = .1, cz = -.35;
    const C = [O[0] + Y[0]*w*cy + Zv[0]*w*cz, O[1] + Y[1]*w*cy + Zv[1]*w*cz, O[2] + Y[2]*w*cy + Zv[2]*w*cz];
    racine.scale.setScalar(S); racine.position.set(.25 - C[0]*S, -C[1]*S, -C[2]*S);
    /* ?debug=1 : les mesures de la tete, pour les relire au banc d'essai */
    if(DEBUG) window.__dbl = { w, ECHELLE, CRANE:Object.assign({}, CRANE), CH:Object.assign({}, CH), SIL:[].slice.call(SIL) };
    return true;
  }

  function dessinA(t, r){
    /* 23/09 — on ne passe plus la personne en noir et blanc : lumiere naturelle,
       a peine posee. Seule la moitie droite est assombrie, pour que la tete en
       points reste lisible par-dessus. */
    peindre(ctx, r, 'saturate(1) brightness(.82) contrast(1.04)');
    const vd = ctx.createLinearGradient(W*.30, 0, W, 0);
    vd.addColorStop(0, 'rgba(0,0,0,0)'); vd.addColorStop(.45, 'rgba(0,0,0,.82)'); vd.addColorStop(1, 'rgba(0,0,0,.95)');
    ctx.fillStyle = vd; ctx.fillRect(W*.30, 0, W*.70, H);
    /* le texte du bas reste lisible meme sur une piece claire */
    const vb = ctx.createLinearGradient(0, H*.55, 0, H);
    vb.addColorStop(0, 'rgba(0,0,0,0)'); vb.addColorStop(1, 'rgba(0,0,0,.85)');
    ctx.fillStyle = vb; ctx.fillRect(0, H*.55, W*.62, H*.45);
    cheveux(r, BLEU(.9));
    gl.style.display = 'block';
    /* Le style est celui du 21/09, 23h41 (la tete que Charles a trouvee stylee) ;
       seule la FORME a change.
       LA TETE, C'EST LA VOTRE : tant que le visage a ete lu il y a moins d'une
       seconde et demie, le double est bati sur vos 478 points. Sinon (demo,
       visage jamais trouve, contre-jour) on retombe sur la tete de principe,
       dans le meme style. */
    const reel = (t - dernierVisageT < 1500) && majDouble(t, t);
    racine.visible = reel; tete.visible = !reel;
    if(!reel){
      tete.position.set(.25, 0, 0);
      tete.rotation.y += ((yawV * .95) - tete.rotation.y) * .15;
      tete.rotation.x += ((clamp(pitchV,0,1.4) * .55) - tete.rotation.x) * .15;
      couleursTete(t);
    }
    co.render();
  }
  function bord(cote, force, t){
    const a = force * (.55 + .45*Math.sin(t/260));
    let g;
    if(cote === 'gauche'){ g = ctx.createLinearGradient(0,0,W*.22,0); g.addColorStop(0,BLEU(a)); g.addColorStop(1,BLEU(0)); ctx.fillStyle = g; ctx.fillRect(0,0,W*.22,H); }
    if(cote === 'droite'){ g = ctx.createLinearGradient(W,0,W*.78,0); g.addColorStop(0,BLEU(a)); g.addColorStop(1,BLEU(0)); ctx.fillStyle = g; ctx.fillRect(W*.78,0,W*.22,H); }
    if(cote === 'dessus'){ g = ctx.createLinearGradient(0,0,0,H*.28); g.addColorStop(0,BLEU(a)); g.addColorStop(1,BLEU(0)); ctx.fillStyle = g; ctx.fillRect(0,0,W,H*.28); }
    if(cote === 'face'){ g = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,H*.6); g.addColorStop(0,BLEU(a*.35)); g.addColorStop(1,BLEU(0)); ctx.fillStyle = g; ctx.fillRect(0,0,W,H); }
  }
  function dessinB(t, r){
    gl.style.display = 'none';
    peindre(ctx, r, 'grayscale(1) brightness(.42) contrast(1.1)');
    /* les cheveux vus maintenant : gris s'ils restent a lire, bleus s'ils le sont */
    const z = ZONES.includes(pose) ? Z[pose] : 0;
    cheveux(r, 'rgba(' + Math.round(lerp(150,64,z)) + ',' + Math.round(lerp(160,170,z)) + ',' + Math.round(lerp(175,255,z)) + ',.95)', z > .05 ? 'color' : 'saturation');
    if(z > .05){ ctx.save(); ctx.globalAlpha = .25*z; cheveux(r, BLEU(1), 'screen'); ctx.restore(); }
    /* la lumiere au bord : c'est elle qui fait tourner la tete */
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    const m = manquante(); if(m && m !== pose) bord(m, .75, t);
    ctx.restore();
  }
  function dessinC(t, r){
    gl.style.display = 'none';
    peindre(ctx, r, 'grayscale(1) brightness(.34) contrast(1.1)');
    cheveux(r, BLEU(.9));
    /* quatre mots, chacun sur le bord qu'il designe ; il se remplit quand c'est lu */
    const fs = Math.min(W, H) * .16;
    const mots = [
      { z:'gauche', x: fs*.62,   y: H/2, rot:-Math.PI/2 },
      { z:'droite', x: W-fs*.62, y: H/2, rot: Math.PI/2 },
      { z:'dessus', x: W/2,      y: fs*.95, rot:0 },
      { z:'face',   x: W/2,      y: H - fs*.62, rot:0 }
    ];
    ctx.save(); ctx.font = '800 ' + fs + 'px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(const m of mots){
      const mot = m.z.toUpperCase(), w = ctx.measureText(mot).width, v = Z[m.z], actif = pose === m.z && v < 1;
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.rot);
      ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(234,246,255,' + (actif ? .9 : .38) + ')'; ctx.strokeText(mot, 0, 0);
      ctx.save(); ctx.beginPath(); ctx.rect(-w/2, fs*.5 - fs*v, w, fs*v + 2); ctx.clip();
      ctx.fillStyle = v >= 1 ? '#eaf6ff' : 'rgba(96,190,255,.95)'; ctx.fillText(mot, 0, 0); ctx.restore();
      ctx.restore();
    }
    ctx.restore();
  }

  /* 23/09 — le choix de propale (touches 1 a 3) n'a plus rien a faire ici : il
     remettait le pourcentage a zero SANS vider les images gardees, et la zone ne
     pouvait plus jamais se remplir. Le style est fige. */
  function choisir(g){ G = g; document.body.className = 'g' + g; }

  /* les deux seules prises dont la page a besoin de l'exterieur */
  hookMasqueTete = mesurerChevelure;
  dessinTete = function(t, r){ if(G === 1) dessinA(t, r); else if(G === 2) dessinB(t, r); else dessinC(t, r); };
  choisir(G); tailleGL();
}

/* ---------------- la boucle ---------------- */
let debutSansVisage = 0, consigneCle = null;
const DELAI_OFFRE = 3000, DELAI_AUTO = 6000;
const CLEF_CONSIGNE = { face:'hcg.c.face', gauche:'hcg.c.gauche', droite:'hcg.c.droite', dessus:'hcg.c.dessus' };
/* le francais, si le dictionnaire n'est pas encore charge */
const CONSIGNES_FR = { 'hcg.c.face':'Regardez l’écran, bien de face.', 'hcg.c.gauche':'Tournez doucement la tête vers la gauche.',
  'hcg.c.droite':'Tournez doucement la tête vers la droite.', 'hcg.c.dessus':'Baissez la tête pour montrer le dessus.',
  'hcg.presque':'Presque fini.', 'hcg.r.visage':'Votre visage n’est pas visible.', 'hcg.r.cheveux':'On ne voit pas assez vos cheveux.',
  'hcg.r.bouge':'Ne bougez plus.', 'hcg.r.flou':'L’image est floue : un peu plus de lumière.',
  'hcg.r.sombre':'Pas assez de lumière. Mettez-vous dans une zone bien éclairée, face à la lumière.' };
/* 26/09 — journal technique anonyme (chiffres seulement) vers /api/journal, pour comprendre un echec sur telephone */
const JOURNAL = { t0: performance.now(), refus:{}, visageVu:0, images:0, cheveuxMax:0, netMax:0, envoye:{} };
function journal(evt, extra){
  if(DEMO || PHOTO || JOURNAL.envoye[evt]) return; JOURNAL.envoye[evt] = 1;
  try{ const L = window.__lecture || {};
    navigator.sendBeacon('/api/journal', JSON.stringify(Object.assign({ page:'scan-guide', evt, s:Math.round((performance.now()-JOURNAL.t0)/1000),
      ua:navigator.userAgent.slice(0,160), modeles:L, video:(vid && vid.videoWidth)?vid.videoWidth+'x'+vid.videoHeight:'aucune',
      refus:JOURNAL.refus, visageVu:JOURNAL.visageVu, images:ZONES.map(z=>z+':'+IMAGES[z].length).join(' '),
      cheveuxMax:+JOURNAL.cheveuxMax.toFixed(3), netMax:+JOURNAL.netMax.toFixed(6), seuilNet:+seuilNet().toFixed(6) }, extra||{})));
  }catch(e){}
}
function image(now){
  requestAnimationFrame(image);
  if(!src || !HAIR) return;
  /* 23/09 — si le visage n'est JAMAIS vu (contre-jour, camera trop sombre), on
     restait a 0 % sans issue. Au bout de 20 s sans une seule image gardee, on
     rend la main au parcours, qui proposera l'ancien enchainement. */
  if(!demo()){
    if(!debutSansVisage) debutSansVisage = now;
    const rienDuTout = ZONES.every(z => IMAGES[z].length === 0);
    /* 26/09 (iPhone de Charles, chambre peu eclairee) : au lieu d'abandonner au bout de 20 s,
       on devient plus tolerant a 8 s puis a 16 s ; a 24 s, si le visage a ete vu, on termine
       avec la meilleure image vue ; sinon seulement, on rend la main. */
    const attente = now - debutSansVisage;
    TOL = rienDuTout ? (attente > 16000 ? .3 : attente > 8000 ? .55 : 1) : TOL;
    if(rienDuTout && attente > 8000) journal('lent');
    if(rienDuTout && attente > 24000){
      debutSansVisage = now + 1e9;
      if(JOURNAL.visageVu > 10 && SECOURS){ MEILLEURE.face = SECOURS; IMAGES.face.push(0); journal('secours'); rendre(); }
      else { journal('abandon'); if(parent !== window) parent.postMessage({ type:'vyvre-scan-sans-visage' }, location.origin); }
    }
    if(!rienDuTout) debutSansVisage = now + 1e9;
  }
  const dt = Math.min(.1, (now - tPrec)/1000); tPrec = now;
  lire(now); lirePose(now, dt);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#000'; ctx.fillRect(0,0,cv.width,cv.height); ctx.restore();
  RC = cadre();
  /* le seul aiguillage : l'encre par defaut, la tete en points sous ?tete=1 */
  const tD = performance.now();
  if(TETE){ if(dessinTete) dessinTete(now, RC); } else dessin1(now, dt);
  msDessin = msDessin ? msDessin*.94 + (performance.now() - tD)*.06 : (performance.now() - tD);
  const tt = total();
  /* « Lu. » ne doit pas etre reecrit par le pourcentage ; il est repeint a
     chaque image pour suivre un changement de langue arrive apres coup. */
  if(!finiDepuis){ const v = Math.round(tt*100), el = $('pct'); el.textContent = v + ' %';
    /* un éclat à chaque dizaine franchie */
    const d = Math.floor(v/10); if(d !== (el._d ?? 0)){ el._d = d; el.classList.remove('monte'); void el.offsetWidth; el.classList.add('monte'); } }
  else $('pct').textContent = T('hcg.lu') ?? 'Lu.';
  /* secours : bloque 5 s, on nomme ce qui manque (et seulement a ce moment-la) */
  const m = manquante();
  const RAISONS = { visage:'Votre visage n’est pas visible.', angle:'Tenez la tête un instant.', cheveux:'On ne voit pas assez vos cheveux.', bouge:'Ne bougez plus.', flou:'L’image est floue : un peu plus de lumière.' };
  const CLEF_RAISON = { visage:'hcg.r.visage', angle:'hcg.r.angle', cheveux:'hcg.r.cheveux', bouge:'hcg.r.bouge', flou:'hcg.r.flou' };
  /* 23/09 — Charles n'etait pas assiste pendant son essai : on dit tot, en une
     phrase, LE GESTE qui manque ; la raison technique ne vient qu'apres. */
  const GESTES = { face:'Revenez bien de face.', gauche:'Tournez un peu plus à gauche.',
                   droite:'Tournez un peu plus à droite.', dessus:'Baissez la tête pour montrer le dessus.' };
  const CLEF_GESTE = { face:'hcg.g.face', gauche:'hcg.g.gauche', droite:'hcg.g.droite', dessus:'hcg.g.dessus' };
  /* 27/09 (test iPhone de Charles : « trop complique, il faut valider avant 100 %
     si ca traine ») :
     - UNE consigne a la fois, et c'est la phrase en grand : le geste qui manque
       (« Tournez doucement la tete vers la gauche. »), ou, si une image est
       refusee depuis 1,5 s, la raison (« Ne bougez plus. ») ;
     - le pourcentage ne bouge plus depuis 3 s, le visage est lu et la moitie de
       la chevelure : le bouton « Terminer avec cette lecture » apparait (avant :
       8 s) et la phrase dit « Presque fini. » ;
     - il ne bouge toujours pas 6 s apres la derniere image, avec le visage et
       60 % : on termine tout seul avec ce qui est lu. La jauge du bouton montre
       ce delai. Le moteur lit les cotes presents (chaque mesure prend la
       meilleure pose disponible) ; un ou deux cotes manquants ne le bloquent pas. */
  const bloque = now - bloqueDepuis;
  const assez = !!(m && total() >= .5 && MEILLEURE.face && ZONES.filter(z => MEILLEURE[z]).length >= 2);
  const auto = !!(assez && total() >= .6);
  const offre = assez && bloque > DELAI_OFFRE && !finiDepuis;
  $('finir').classList.toggle('on', offre);
  if(offre) $('finir').style.setProperty('--k', auto ? clamp((bloque - DELAI_OFFRE) / (DELAI_AUTO - DELAI_OFFRE), 0, 1).toFixed(3) : '0');
  if(auto && bloque > DELAI_AUTO && !finiDepuis){
    finiDepuis = now; document.body.classList.add('fini'); rendre();
  }
  /* les etapes en clair : celle qu'on lit (ou la prochaine) allumee, les finies marquees */
  { const cible = (ZONES.includes(pose) && Z[pose] < 1) ? pose : m;
    document.querySelectorAll('#etapes span').forEach(el => { const z = el.dataset.z;
      el.style.setProperty('--p', Z[z].toFixed(3));
      el.classList.toggle('fait', Z[z] >= 1); el.classList.toggle('actif', z === cible && Z[z] < 1); }); }
  let cle = null;
  const sombre = LUM >= 0 && LUM < SEUIL_SOMBRE;
  document.body.classList.toggle('sombre', sombre);
  if(sombre && !finiDepuis){ cle = 'hcg.r.sombre'; journal('sombre'); }
  else if(offre) cle = 'hcg.presque';
  else if(refus && now - refusDepuis > 1500 && CLEF_RAISON[refus] && refus !== 'angle') cle = CLEF_RAISON[refus];
  /* on est en train de lire une zone : on le dit, au lieu de demander deja la suivante
     (Charles, tete baissee : « Regardez l'ecran, bien de face. ») */
  else if(ZONES.includes(pose) && Z[pose] < 1 && !refus) cle = 'hcg.r.bouge';
  else if(m) cle = CLEF_CONSIGNE[m];
  if(cle && cle !== consigneCle && !finiDepuis){
    consigneCle = cle;
    const el = $('phraseTxt'); el.setAttribute('data-i18n', cle);
    el.textContent = T(cle) ?? CONSIGNES_FR[cle] ?? el.textContent;
  }
  if(tt >= 1){
    if(!finiDepuis){ finiDepuis = now; document.body.classList.add('fini'); $('pct').textContent = T('hcg.lu') ?? 'Lu.'; }
    else if(now - finiDepuis > 300) rendre();
  }
  if(DEBUG) $('lectureDebug').textContent = 'lacet ' + yawV.toFixed(2) + '\ntangage ' + pitchV.toFixed(2) + '\nvisage ' + visage + '\ncheveux ' + (vuCheveux*100).toFixed(1) + ' %\npose ' + pose + '\ndessin ' + msDessin.toFixed(2) + ' ms';
}

(async function(){
  taille(); tailleTrainee();
  document.body.className = TETE ? 'g1' : 'encre';
  if(TETE) await monterTete();          /* et seulement la, three.js */
  /* 05/10 (iPhone de Charles : « mon visage s'affiche puis ca bloque quelques secondes ») : les modeles se chargent
     pendant que la camera s'ouvre, puis on les met en route sur une petite image AVANT d'afficher la lecture.
     Le premier calcul (compilation sur le processeur graphique) figeait l'ecran ; il se fait maintenant pendant
     « Preparation de la lecture ». */
  const lecture = ouvrirLecture();
  await ouvrirSource();

  tailles();
  if(!TETE) allouer(PW*PH);   /* les tampons du dessin, a la taille du masque */
  dit($('phraseTxt'), 'hcg.prepa'); if(!T('hcg.prepa')) $('phraseTxt').textContent = 'Préparation de la lecture…';
  await lecture;
  await new Promise(r => setTimeout(r, 30));

    if(miroir){ g.translate(PW, 0); g.scale(-1, 1); } g.drawImage(src, 0, 0, PW, PH);
    const t0 = performance.now();
    if(segH) segH.segmentForVideo(c, t0, () => {});
    if(face) face.detectForVideo(c, t0 + 1);
  } catch(e) {}
  dit($('phraseTxt'), 'hcg.remplir'); if(!T('hcg.remplir')) $('phraseTxt').textContent = 'Remplissez vos cheveux de bleu.';
  bloqueDepuis = performance.now();

})();
