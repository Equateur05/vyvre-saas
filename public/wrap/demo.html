<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>vyvre · Wrap (démonstration)</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;background:#060606;color:#f3ead6;font:300 15px/1.6 Inter,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 16px;box-sizing:border-box}
  h1{font:italic 400 44px/1 Didot,"Bodoni 72",Georgia,serif;margin:0;color:#efe3c6}
  p{margin:0;max-width:420px;text-align:center;color:rgba(243,234,214,.6)}
  .ligne{display:flex;flex-direction:column;gap:14px;align-items:center}
  .ligne span{font:400 10px/1 "JetBrains Mono",Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;color:#d9c9a3}
</style>
</head>
<body>
  <h1>Le Wrap</h1>
  <p>Page de démonstration : les valeurs ci-dessous sont des exemples, signalés comme tels dans le Wrap.</p>
  <div class="ligne"><span>Peau</span><div id="z-peau"></div></div>
  <div class="ligne"><span>Cheveux</span><div id="z-cheveux"></div></div>
  <div class="ligne"><span>Assiette</span><div id="z-aliment"></div></div>
<script src="/wrap/vy-wrap.js?v=9"></script>
<script src="/wrap/exemples.js?v=3"></script>
<script>
  var EXEMPLES = window.VYW_EXEMPLES;
  ['peau', 'cheveux', 'aliment'].forEach(function(k){
    document.getElementById('z-' + k).appendChild(VyWrap.bouton(function(){ return EXEMPLES[k]; }, { type:k }));
  });
  /* ?ouvrir=peau|cheveux|aliment : ouvre directement (tests) */
  var o = (location.search.match(/[?&]ouvrir=(\w+)/) || [])[1], st = (location.search.match(/[?&]style=([A-DRLX][1-4]?)/) || [])[1] || 'A';
  if (o && EXEMPLES[o]) VyWrap.ouvrir(Object.assign({}, EXEMPLES[o], { style:st })).then(function(c){ window.__wrap = c; });
</script>
</body>
</html>
