<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>vyvre · Wrap R, la révélation</title>
<style>
  :root{color-scheme:dark;--champ:#d9c9a3;--fond:#050505;--texte:#f3ead6;--doux:rgba(243,234,214,.62);--filet:rgba(217,201,163,.2)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fond);color:var(--texte);overflow-x:hidden}
  body{font:300 15px/1.6 Inter,"Helvetica Neue",Arial,sans-serif;padding:calc(env(safe-area-inset-top) + 30px) 16px calc(env(safe-area-inset-bottom) + 40px)}
  header{max-width:1500px;margin:0 auto 24px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
  .sur{font:400 10px/1 "JetBrains Mono",Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;color:var(--champ)}
  h1{margin:10px 0 6px;font:italic 400 clamp(34px,6vw,64px)/1 Didot,"Bodoni 72",Georgia,serif;color:#efe3c6;letter-spacing:-.01em}
  header p{margin:0;max-width:560px;color:var(--doux)}
  .reglages{display:flex;flex-wrap:wrap;gap:10px}
  .choix{display:inline-flex;max-width:100%;padding:4px;border-radius:999px;border:1px solid var(--filet);background:rgba(255,255,255,.02)}
  .choix button{border:0;background:none;color:var(--doux);font:500 11px/1 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:13px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .palettes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:980px;margin:14px auto 0}
  .palettes button{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--filet);background:rgba(255,255,255,.02);color:var(--doux);font:500 11px/1 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;padding:8px 13px 8px 8px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .palettes button[aria-pressed=true]{border-color:#d3bf92;color:#f3ead6;background:rgba(211,191,146,.12)}
  .palettes i{display:inline-flex;border-radius:999px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  .palettes i b{display:block;width:12px;height:22px}
  .choix button[aria-pressed=true]{background:linear-gradient(180deg,#efe4c8,#d3bf92);color:#14110b}
  .grille{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
  @media (max-width:1300px){.grille{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:860px){.grille{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}}
  .carte{display:flex;flex-direction:column;gap:10px;min-width:0}
  .carte.ref .ecran{box-shadow:0 30px 70px -30px rgba(0,0,0,.95),0 0 0 1px rgba(243,234,214,.12)}
  .ecran{position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 30px 70px -30px rgba(0,0,0,.95),0 0 0 1px var(--filet)}
  .ecran canvas{display:block;width:100%;height:100%}
  .lettre{position:absolute;left:10px;top:10px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:rgba(0,0,0,.6);border:1px solid rgba(217,201,163,.45);font:500 12px/1 "JetBrains Mono",Menlo,monospace;color:var(--champ)}
  .carte h2{margin:2px 0 0;font:500 16px/1.25 Inter,"Helvetica Neue",Arial,sans-serif;color:#f6eedb}
  .carte p{margin:0;font-size:12.5px;line-height:1.5;color:var(--doux)}
  .carte p b{font-weight:500;color:rgba(243,234,214,.85)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .actions button{flex:1 1 110px;min-height:44px;border-radius:999px;cursor:pointer;font:500 10.5px/1 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:0 10px}
  .ecouter{border:1px solid rgba(217,201,163,.45);background:transparent;color:var(--champ)}
  .ecouter[aria-pressed=true]{background:rgba(217,201,163,.16)}
  .creer{border:0;background:linear-gradient(180deg,#efe4c8,#d3bf92);color:#14110b}
  footer{max-width:1500px;margin:30px auto 0;color:rgba(243,234,214,.42);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <div class="sur" data-t="sur"></div>
    <h1 data-t="titre"></h1>
    <p data-t="intro"></p>
  </div>
  <div class="reglages">
    <div class="choix" role="group" id="types">
      <button type="button" data-type="peau" aria-pressed="true"></button>
      <button type="button" data-type="cheveux" aria-pressed="false"></button>
      <button type="button" data-type="aliment" aria-pressed="false"></button>
    </div>
    <div class="choix" role="group" id="langues" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="palettes" id="palettes" role="group"></div>
</header>
<main class="grille" id="grille"></main>
<footer data-t="pied"></footer>

<script src="/wrap/vy-wrap.js?v=10"></script>
<script src="/wrap/exemples.js?v=3"></script>
<script>
(function(){
  var TX = {
    fr:{ sur:'vyvre · Le Wrap · série R', titre:'La révélation.', types:{ peau:'Peau', cheveux:'Cheveux', aliment:'Assiette' },
      intro:'Plus de prénom en vedette : la phrase de votre besoin, en géant. Trois secondes de suspense, le BIM sur la phrase, la preuve (la vraie mesure), puis les soins et « Et toi ? ». Le D4 à gauche pour comparer. Un seul son à la fois.',
      pied:'Données d’exemple, signalées « EXEMPLE » dans chaque Wrap. La phrase vient de la mesure la plus basse, par une table écrite à l’avance : rien d’aléatoire, aucune valeur inventée. Ajoutez ?diag=1 à l’adresse pour voir la ligne technique sous la vidéo.',
      ecouter:'Écouter', couper:'Couper le son', creer:'Créer la vidéo' },
    en:{ sur:'vyvre · The Wrap · R series', titre:'The reveal.', types:{ peau:'Skin', cheveux:'Hair', aliment:'Plate' },
      intro:'No more first name in the spotlight: the phrase of your need, giant. Three seconds of suspense, the BIM on the phrase, the proof (the real measure), then the products and “And you?”. D4 on the left for comparison. One sound at a time.',
      pied:'Example data, marked “EXAMPLE” in every Wrap. The phrase comes from the lowest measure, through a table written in advance: nothing random, no invented value. Add ?diag=1 to the address to see the technical line under the video.',
      ecouter:'Listen', couper:'Mute', creer:'Create the video' }
  };
  var STYLES = [
    { k:'D4', ref:true,
      fr:{ t:'D4 · La carte (référence)', d:'Le format actuel, pour comparer. <b>Son :</b> UK garage 2-step 132 BPM.' },
      en:{ t:'D4 · The card (reference)', d:'The current format, for comparison. <b>Sound:</b> UK garage 2-step 132 BPM.' } },
    { k:'R1',
      fr:{ t:'R1 · Le roulement', d:'Rideau fermé, projecteur qui se resserre, l’accroche qui tremble à chaque coup puis se cache ; la salle s’éteint un demi-temps ; BIM : le rideau s’envole, la phrase en géant. <b>Son :</b> caisse claire qui accélère, grondement, silence, impact, puis groove 120 BPM.' },
      en:{ t:'R1 · The drum roll', d:'Closed curtain, a tightening spotlight, the hook shaking at every hit then hiding; the room goes dark for half a beat; BIM: the curtain flies off, the phrase goes giant. <b>Sound:</b> accelerating snare roll, rumble, silence, impact, then a 120 BPM groove.' } },
    { k:'R2',
      fr:{ t:'R2 · Le tirage', d:'Une machine à sous : les besoins défilent, ralentissent, passent un par un au cliquet… et s’arrêtent sur le vôtre au BIM. <b>Son :</b> un tic par mot qui passe, pièces qui montent, cloches du gros lot, disco house 124 BPM.' },
      en:{ t:'R2 · The draw', d:'A slot machine: the needs spin, slow down, click past one by one… and stop on yours on the BIM. <b>Sound:</b> a tick per passing word, rising coins, jackpot bells, disco house 124 BPM.' } },
    { k:'R3',
      fr:{ t:'R3 · Le scan', d:'Une barre de lecture balaie vos vraies mesures, les chiffres montent, elle revient lentement se poser sur la plus basse. Un temps de silence, puis BIM. <b>Son :</b> balayage, un bip par mesure lue, techno 128 BPM, vrai silence avant l’impact.' },
      en:{ t:'R3 · The scan', d:'A reading bar sweeps your real measures, the numbers climb, it slowly comes back to rest on the lowest. One beat of silence, then BIM. <b>Sound:</b> sweep, a beep per measure read, techno 128 BPM, real silence before the hit.' } },
    { k:'R4',
      fr:{ t:'R4 · Le battement', d:'Un cœur de lumière bat de plus en plus vite, l’écran se resserre autour de lui, puis explose : les lettres de la phrase claquent en place. <b>Son :</b> battements qui accélèrent, tension qui monte, aspiration, explosion, groove 116 BPM.' },
      en:{ t:'R4 · The heartbeat', d:'A heart of light beats faster and faster, the screen closes in around it, then bursts: the letters of the phrase slam into place. <b>Sound:</b> accelerating heartbeats, rising tension, a suck-in, an explosion, 116 BPM groove.' } }
  ];
  var grille = document.getElementById('grille'), type = 'peau', lang = 'fr', apercus = [];
  /* 06/10 : les palettes facon defiles (definies dans vy-wrap.js) */
  var PAL = VyWrap.palettes || { origine:null }, pal = (location.search.match(/[?&]pal=([a-z]+)/) || [])[1];
  if (!(pal in PAL)) pal = 'origine';
  var zp = document.getElementById('palettes');
  function hex(c){ return 'rgb(' + c.join(',') + ')'; }
  Object.keys(PAL).forEach(function(k){
    var P = PAL[k], b = document.createElement('button'); b.type = 'button'; b.dataset.pal = k; b.setAttribute('aria-pressed', String(k === pal));
    var cs = P ? [P.noir, P.c1, P.c2, P.blanc] : [[8, 8, 8], [255, 92, 60], [255, 168, 196], [250, 246, 238]];
    b.innerHTML = '<i>' + cs.map(function(c){ return '<b style="background:' + hex(c) + '"></b>'; }).join('') + '</i><span></span>';
    b.querySelector('span').textContent = P ? P.nom : 'Origine';
    b.addEventListener('click', function(){
      pal = k; zp.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      try { var u = new URL(location.href); u.searchParams.set('pal', k); history.replaceState(null, '', u); } catch(e){}
      construire();
    });
    zp.appendChild(b);
  });
  function lp(){ return TX[lang]; }
  function textes(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = lp()[el.dataset.t]; });
    document.querySelectorAll('#types button').forEach(function(b){ b.textContent = lp().types[b.dataset.type]; });
    document.getElementById('types').setAttribute('aria-label', lang === 'fr' ? 'Type de scan' : 'Scan type');
  }
  function toutTaire(){
    apercus.forEach(function(a){ a.taire(); });
    grille.querySelectorAll('.ecouter').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); x.textContent = lp().ecouter; });
  }
  function construire(){
    apercus.forEach(function(a){ a.arreter(); }); apercus = []; grille.innerHTML = '';
    STYLES.forEach(function(s){
      var c = document.createElement('article'); c.className = 'carte' + (s.ref ? ' ref' : '');
      c.innerHTML = '<div class="ecran"><canvas></canvas><span class="lettre"></span></div><h2></h2><p></p>' +
        '<div class="actions"><button type="button" class="ecouter" aria-pressed="false"></button><button type="button" class="creer"></button></div>';
      c.querySelector('.lettre').textContent = s.k;
      c.querySelector('h2').textContent = s[lang].t;
      c.querySelector('p').innerHTML = s[lang].d;
      c.querySelector('.ecouter').textContent = lp().ecouter;
      c.querySelector('.creer').textContent = lp().creer;
      grille.appendChild(c);
      var donnees = Object.assign({}, window.VYW_EXEMPLES[type], { style:s.k, palette:pal });
      var ap = VyWrap.apercu(c.querySelector('canvas'), donnees); apercus.push(ap);
      var b = c.querySelector('.ecouter');
      b.addEventListener('click', function(){
        var on = b.getAttribute('aria-pressed') !== 'true';
        toutTaire();
        if (on && ap.ecouter()){ b.setAttribute('aria-pressed', 'true'); b.textContent = lp().couper; }
      });
      c.querySelector('.creer').addEventListener('click', function(){ toutTaire(); VyWrap.amorcer(); VyWrap.ouvrir(donnees); });
    });
  }
  document.querySelectorAll('#types button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#types button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      type = b.dataset.type; construire();
    });
  });
  document.querySelectorAll('#langues button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#langues button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      lang = b.dataset.lang; textes(); construire();
    });
  });
  var q = (location.search.match(/[?&]type=(peau|cheveux|aliment)/) || [])[1], ql = (location.search.match(/[?&]lang=(fr|en)/) || [])[1];
  if (q){ type = q; document.querySelectorAll('#types button').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.type === q)); }); }
  if (ql){ lang = ql; document.querySelectorAll('#langues button').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.lang === ql)); }); }
  textes(); construire();
  window.__propalesR = function(){ return apercus; };
})();
</script>
</body>
</html>
