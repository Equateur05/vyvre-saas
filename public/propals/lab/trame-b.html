<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYVRE · Trame B</title>
<meta name="robots" content="noindex">
<style>
/* 01/10 : variante B du « corps en matrice de points ».
   Mannequin en SDF (raymarching dans le fragment shader), visage = carte de profondeur 64x64
   construite a partir des 478 points 3D du detecteur de visage. Les points sont une grille posee
   SUR la surface (grille d'un « capteur » attache au corps), vue de biais par la camera : colonnes droites,
   rangees qui ondulent avec le relief et se tassent la ou la surface fuit. Ombrage = Lambert + occlusion + bord.
   Le code du rendu vit dans buste-gl.js (source unique) ; cette page n'est que le banc d'essai.
   API : window.Buste = { init(canvas), dessine(lm, t, opts), etat } — voir l'en-tete de buste-gl.js. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#a6dfe1}
canvas#buste{position:fixed;inset:0;width:100vw;height:100vh;display:block}
video,canvas#det{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="buste"></canvas>
<video id="cam" playsinline muted autoplay></video>
<canvas id="det"></canvas>
<script src="/propals/lab/buste-gl.js?v=10" id="lib"></script>
<script>/* banc d'essai : ?lib=buste-gl-v8.js pour comparer avec une version figee */
(function(){ const l = new URLSearchParams(location.search).get('lib'); if(l && /^buste-gl[-\w.]*\.js$/.test(l)){ window.Buste = undefined; document.write('<script src="/propals/lab/' + l + '?ancien=1"><\/script>'); } })();</script>
<script type="module">
/* banc d'essai de buste-gl.js : vraie camera, detecteur de visage + segmenteur de cheveux, zoom qui alterne tout seul.
   Sequence automatique : buste entier, zoom sur le visage, la tete tourne, retour (24 s).
   URL : ?genre=f|h|n (defaut f), ?cheveux=0 pour les couper, ?photo=0 pour le visage sculpte seul, ?zoom=0..1, ?tourne=0..1 et ?revele=0..1 pour les figer ; ?simul=barbe,court,photobarbe,sombre pour fabriquer un homme barbu sous faible lumiere. Touches : G (genre), C (cheveux), Z (zoom). */
import { FilesetResolver, FaceLandmarker, ImageSegmenter } from '/cheveux/vendor/mediapipe/vision_bundle.mjs';

const Q = new URLSearchParams(location.search);
const GENRES = { f:'f', h:'h', n:null };
let genre = Q.has('genre') ? (GENRES[Q.get('genre')] !== undefined ? GENRES[Q.get('genre')] : 'f') : 'f';
let avecCheveux = Q.get('cheveux') !== '0';
let avecPhoto = Q.get('photo') !== '0';   /* ?photo=0 : visage sculpte seul (rendu d'avant) */
let zoomFixe = Q.has('zoom') ? Math.min(1, Math.max(0, +Q.get('zoom') || 0)) : null;
/* banc d'essai : ?simul=barbe ajoute une barbe et une moustache au masque ; ?simul=court efface les cheveux sous les oreilles
   (?simul=barbe,court = homme barbu aux cheveux courts, simule a partir de la video de test) */
const SIMUL = (Q.get('simul') || '').split(',');
function simuleMasque(m, w, h, lm){
  if(!lm || lm.length < 455) return;
  const P = i => [lm[i].x*w, lm[i].y*h];
  const L = P(234), R = P(454), hi = P(10), lo = P(152), ne = P(2);
  let X = [R[0]-L[0], R[1]-L[1]]; const fw = Math.hypot(X[0], X[1]); X = [X[0]/fw, X[1]/fw];
  let Y = [hi[0]-lo[0], hi[1]-lo[1]]; const yx = Y[0]*X[0]+Y[1]*X[1]; Y = [Y[0]-X[0]*yx, Y[1]-X[1]*yx]; const yl = Math.hypot(Y[0],Y[1]); Y = [Y[0]/yl, Y[1]/yl];
  const c = [(L[0]+R[0])/2, (L[1]+R[1])/2];
  const vv = q => ((q[0]-c[0])*Y[0] + (q[1]-c[1])*Y[1])/fw;
  const vNez = vv(ne), vMenton = vv(lo);
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    const dx = i+0.5-c[0], dy = j+0.5-c[1], u = (dx*X[0]+dy*X[1])/fw, v = (dx*Y[0]+dy*Y[1])/fw, k = j*w+i;
    if(SIMUL.includes('court') && v < 0.0) m[k] = 0;
    if(SIMUL.includes('barbe')){
      /* barbe : joues basses, menton et dessous du menton ; moustache sous le nez */
      /* barbe pleine telle que le segmenteur la voit : elle deborde des joues et rejoint les favoris */
      const au = Math.abs(u);
      const joue = au < 0.66 && v < vNez + 0.02 && v > vMenton - 0.3 && !(au < 0.2 && v > vMenton + 0.12 && v < vNez - 0.12);
      const favori = au > 0.42 && au < 0.66 && v >= vNez && v < 0.15;
      if(joue || favori) m[k] = 0.95;
    }
  }
}
let reveleFixe = Q.has('revele') ? Math.min(1, Math.max(0, +Q.get('revele') || 0)) : null;
/* photo simulee pour le banc d'essai : ?simul=...,photobarbe (fausse barbe sombre dans l'image), sombre (eclairage -40 %) */
const phc = window.__phc = document.createElement("canvas"), phx = phc.getContext('2d', { willReadFrequently:true });
let tPhc = 0;
function photoSimulee(){
  const W = 480, H = Math.round(480*video.videoHeight/video.videoWidth);
  if(phc.width !== W){ phc.width = W; phc.height = H; }
  phx.drawImage(video, 0, 0, W, H);
  const lm = dernier && dernier.points; if(!lm) return phc;
  const im = phx.getImageData(0, 0, W, H), d = im.data;
  const P = i => [lm[i].x*W, lm[i].y*H];
  const L = P(234), R = P(454), hi = P(10), lo = P(152), ne = P(2), lb = P(17), lh = P(0);
  let X = [R[0]-L[0], R[1]-L[1]]; const fw = Math.hypot(X[0], X[1]); X = [X[0]/fw, X[1]/fw];
  let Y = [hi[0]-lo[0], hi[1]-lo[1]]; const yx = Y[0]*X[0]+Y[1]*X[1]; Y = [Y[0]-X[0]*yx, Y[1]-X[1]*yx]; const yl = Math.hypot(Y[0],Y[1]); Y = [Y[0]/yl, Y[1]/yl];
  const c = [(L[0]+R[0])/2, (L[1]+R[1])/2];
  const vv = q => ((q[0]-c[0])*Y[0] + (q[1]-c[1])*Y[1])/fw;
  const vNez = vv(ne), vMenton = vv(lo), vLb = vv(lb), vLh = vv(lh);
  const barbe = SIMUL.includes('photobarbe'), sombre = SIMUL.includes('sombre');
  for(let j=0;j<H;j++) for(let i=0;i<W;i++){
    const k = (j*W+i)*4; let f = sombre ? 0.6 : 1;
    if(barbe){ const dx = i+0.5-c[0], dy = j+0.5-c[1], u = (dx*X[0]+dy*X[1])/fw, v = (dx*Y[0]+dy*Y[1])/fw, au = Math.abs(u);
      /* barbe et moustache : sous le nez, joues basses, menton (les levres restent visibles) */
      const bord = 0.47 - 0.12*Math.max(0, (vNez - v)/(vNez - vMenton + 1e-3))**2;
      const dansB = v < vNez - 0.02 && v > vMenton - 0.06 && au < bord;
      const levres = au < 0.17 && v < vLh + 0.005 && v > vLb - 0.005;
      if(dansB && !levres){ const t = 0.5 + 0.5*Math.sin(i*1.7)*Math.sin(j*2.3); f *= 0.5 + 0.12*t; }
    }
    d[k] *= f; d[k+1] *= f; d[k+2] *= f;
  }
  phx.putImageData(im, 0, 0);
  return phc;
}
let tourneFixe = Q.has('tourne') ? Math.min(1, Math.max(0, +Q.get('tourne') || 0)) : null;

const canvas = document.getElementById('buste');
const video = document.getElementById('cam');
const det = document.getElementById('det');
const dctx = det.getContext('2d', { willReadFrequently:false });
const info = window.__trameB = { webgl:false, camera:false, detecteur:null, segmenteur:null, visage:false, nbVisages:0, masque:false, fps:0, erreur:null };
let detecteur = null, segmenteur = null, dernier = null, tDet = -1, tSeg = -1, dernierTemps = -1, dernierTempsS = -1;
let masque = null, mw = 0, mh = 0;

try { Buste.init(canvas); info.webgl = true; } catch(e){ info.erreur = String(e.message||e); console.log('ERREUR GL', info.erreur); }

async function camera(){
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480} }, audio:false });
    video.srcObject = st; await video.play(); info.camera = true;
  } catch(e){ info.erreur = 'camera: ' + (e.message||e); }
}
async function detecteurInit(){
  const fs = await FilesetResolver.forVisionTasks('/cheveux/vendor/mediapipe/wasm');
  const opts = d => ({ baseOptions:{ modelAssetPath:'/cheveux/vendor/mediapipe/modeles/face_landmarker.task', delegate:d }, runningMode:'VIDEO', numFaces:1 });
  try { detecteur = await FaceLandmarker.createFromOptions(fs, opts('GPU')); info.detecteur = 'GPU'; }
  catch(e){ detecteur = await FaceLandmarker.createFromOptions(fs, opts('CPU')); info.detecteur = 'CPU'; }
  const so = d => ({ baseOptions:{ modelAssetPath:'/cheveux/vendor/mediapipe/modeles/hair_segmenter.tflite', delegate:d }, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
  try { segmenteur = await ImageSegmenter.createFromOptions(fs, so('GPU')); info.segmenteur = 'GPU'; }
  catch(e){ try { segmenteur = await ImageSegmenter.createFromOptions(fs, so('CPU')); info.segmenteur = 'CPU'; } catch(e2){ info.erreur = 'segmenteur: ' + (e2.message||e2); } }
}
camera().then(() => detecteurInit()).catch(e => { info.erreur = 'detecteur: ' + (e.message||e); });

/* sequence de demonstration (24 s) : buste entier 5 s, zoom sur le visage, la tete tourne 2 allers-retours, puis retour */
/* sequence de la page des resultats (32 s) : la forme se construit (7 s), pause sur le torse entier (2,5 s),
   zoom sur le visage (3 s), la tete tourne (2 allers-retours), puis retour au buste et on recommence */
const T0 = performance.now()/1000;
function sequence(t){
  const u = (t - T0) % 32;
  const r = (a, b) => Math.min(1, Math.max(0, (u - a)/(b - a)));
  const revele = r(0, 7);
  const zoom = u < 28 ? r(9.5, 12.5) : 1 - r(28, 30.5);
  const tourne = r(12.5, 13.5) * (1 - r(25.5, 27.5));
  return { revele, zoom, tourne };
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(k === 'g') genre = genre === 'f' ? 'h' : genre === 'h' ? null : 'f';
  if(k === 'c') avecCheveux = !avecCheveux;
  if(k === 'z') zoomFixe = zoomFixe === null ? 1 : zoomFixe === 1 ? 0 : null;
});

function boucle(){
  const now = performance.now();
  const t = now/1000;
  if(video.readyState >= 2 && video.videoWidth){
    const W = 480, H = Math.round(480*video.videoHeight/video.videoWidth);
    if(det.width !== W){ det.width = W; det.height = H; }
    const nouvelle = (detecteur && now - tDet > 60) || (segmenteur && now - tSeg > 150);
    if(nouvelle) dctx.drawImage(video, 0, 0, W, H);
    if(detecteur && now - tDet > 60){
      tDet = now;
      try {
        const ts = Math.max(now, dernierTemps + 1); dernierTemps = ts;
        const res = detecteur.detectForVideo(det, ts);
        info.nbVisages = res.faceLandmarks ? res.faceLandmarks.length : 0;
        if(info.nbVisages){ dernier = { points: res.faceLandmarks[0], w: W, h: H }; info.visage = true; }
      } catch(e){ info.erreur = 'detect: ' + (e.message||e); }
    }
    if(segmenteur && now - tSeg > 150){
      tSeg = now;
      try {
        const ts = Math.max(now, dernierTempsS + 1); dernierTempsS = ts;
        segmenteur.segmentForVideo(det, ts, r => {
          const cm = r.confidenceMasks; if(!cm || !cm.length) return;
          const m = cm[1] || cm[0]; const a = m.getAsFloat32Array();
          if(!masque || masque.length !== a.length) masque = new Float32Array(a.length);
          masque.set(a); mw = m.width; mh = m.height; info.masque = true;
          if(SIMUL[0] && dernier) simuleMasque(masque, mw, mh, dernier.points);
          window.__m = { m: masque, w: mw, h: mh };
        });
      } catch(e){ info.erreur = 'segment: ' + (e.message||e); }
    }
  }
  const seq = sequence(t);
  const revele = reveleFixe !== null ? reveleFixe : (zoomFixe !== null ? 1 : seq.revele);
  let photoImg = video;
  if(SIMUL.includes('photobarbe') || SIMUL.includes('sombre')){ if(now - tPhc > 70 && video.readyState >= 2){ tPhc = now; photoSimulee(); } photoImg = phc; }
  const zoom = zoomFixe !== null ? zoomFixe : seq.zoom;
  const tourne = tourneFixe !== null ? tourneFixe : (zoomFixe !== null ? 0 : seq.tourne);
  if(info.webgl) Buste.dessine(dernier, t, { genre, cheveux: (avecCheveux && masque) ? { masque, mw, mh } : null, zoom, tourne,
    /* la video brute : les landmarks viennent de la meme image (non retournee), donc miroir: false */
    photo: (avecPhoto && video.readyState >= 2) ? { image: photoImg, miroir: false } : null, revele });
  info.fps = Buste.etat.fps; info.echelle = Buste.etat.echelle; info.genre = genre; info.zoom = zoom; info.tourne = tourne; info.revele = revele;
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
</script>
<div id="balai"></div>
<style>
/* le balayage : la forme se decouvre de haut en bas, sous une ligne lumineuse, puis recommence */
:root{--p:-3}
#scene,#buste{-webkit-mask-image:linear-gradient(180deg,#000 calc(var(--p)*1% - 3%),rgba(0,0,0,.55) calc(var(--p)*1%),transparent calc(var(--p)*1% + .6%));mask-image:linear-gradient(180deg,#000 calc(var(--p)*1% - 3%),rgba(0,0,0,.55) calc(var(--p)*1%),transparent calc(var(--p)*1% + .6%))}
#balai{position:fixed;left:0;right:0;top:calc(var(--p)*1%);height:3px;margin-top:-1.5px;background:#f4fffe;box-shadow:0 0 18px 4px rgba(160,255,250,.85);pointer-events:none;z-index:5;opacity:var(--o,1);transition:opacity .5s}
#balai::before{content:'';position:absolute;left:0;right:0;bottom:3px;height:90px;background:linear-gradient(180deg,rgba(235,255,253,0),rgba(235,255,253,.45))}
</style>
<script>
(function(){ const r = document.documentElement.style, DUREE = 4800, PAUSE = 6000; let t0 = performance.now();
  const f = now => { const u = (now - t0)/DUREE; if(u <= 1){ const e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2)/2; r.setProperty('--p', (-3 + 106*e).toFixed(2)); r.setProperty('--o', u > .96 ? '0' : '1'); }
    else if(now - t0 > DUREE + PAUSE){ t0 = now; r.setProperty('--o', '1'); } requestAnimationFrame(f); };
  requestAnimationFrame(f); addEventListener('pointerdown', () => { t0 = performance.now(); }); })();
</script>
</body>
</html>
