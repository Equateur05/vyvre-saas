<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VYVRE · Menu sur le vrai site</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#sel{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;display:flex;gap:4px;align-items:center;
  padding:5px;border-radius:999px;background:rgba(255,40,60,.16);border:1px solid rgba(255,90,100,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px -10px #000}
#sel b{font:500 9px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#ffb3ba;padding:0 6px 0 8px}
#sel a{font:500 13px/1 Inter,sans-serif;color:#fff;text-decoration:none;padding:9px 11px;border-radius:999px;cursor:pointer}
#sel a.on{background:#fff;color:#000}
#info{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:10;width:min(92vw,420px);text-align:center;
  font:300 13px/1.45 Inter,sans-serif;color:#fff;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s}
#info.cache{opacity:0}
</style>
</head>
<body>
<iframe id="f" src="/scan/" title="vyvre.fr"></iframe>
<div id="info"></div>
<nav id="sel"><b>MENU</b><a data-m="actuel">Actuel</a><a data-m="F">F</a><a data-m="G">G</a><a data-m="H">H</a><a data-m="A">A</a><a data-m="B">B</a><a data-m="C">C</a><a data-m="D">D</a><a data-m="E">E</a></nav>
<script>
/* 30/09 (Charles : « refais tes propals avec le vrai menu, j'ai du mal a me rendre compte ») :
   la vraie page vyvre.fr/scan est chargee telle quelle ; chaque proposition remplace seulement son menu. */
const INFO = {
  actuel:'Le menu d’aujourd’hui : liens de 9 à 11 px, gris à moitié transparent.',
  A:'A · Deux niveaux : sous la marque, un grand sélecteur Peau / Cheveux / Aliment. Le reste est dans « Menu ».',
  B:'B · Onglets en bas : les trois scans en bas de l’écran, sous le pouce, comme une app. « Menu » en haut pour le reste.',
  C:'C · Sommaire : un seul bouton « Menu » bien visible, qui ouvre un sommaire plein écran.',
  D:'D · Une barre lisible : le même menu qu’aujourd’hui, en vrai texte blanc de 14 px, qui défile au doigt.',
  E:'E · La capsule : une capsule de verre avec les trois scans ; le « + » l’ouvre pour le reste.' ,
  F:'F · En haut à droite : Peau, Cheveux, Aliment en vrai texte lisible ; le reste dans le petit bouton.',
  G:'G · En haut à droite : un petit sélecteur Peau | Cheveux | Aliment ; le reste dans le petit bouton.',
  H:'H · En haut à droite, sur deux lignes : les trois scans, puis Manifeste, Méthode, Pour les marques.' };
const LIENS = [['Manifeste','/manifeste'],['Méthode','/accuracy'],['Pour les marques','/marques']];
const SCANS = [['Peau','/scan/'],['Cheveux','/cheveux'],['Aliment','/aliment']];
const BASE = `
header .vy-menu{display:none!important}
#vp-voile{position:fixed;inset:0;z-index:300;background:rgba(5,5,6,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .35s;padding:130px 28px 0;font-family:Inter,sans-serif}
#vp-voile.on{opacity:1;pointer-events:auto}
#vp-voile a{display:flex;justify-content:space-between;align-items:baseline;color:#fff;text-decoration:none;font-weight:200;font-size:30px;letter-spacing:-.02em;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.12)}
#vp-voile a span{font:500 11px 'IBM Plex Mono',monospace;color:#d9c9a3;letter-spacing:.2em}
#vp-voile .g{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.28em;color:#d9c9a3;margin:20px 0 4px}
.vp-btn{font:500 13px/1 Inter,sans-serif;letter-spacing:.14em;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:11px 16px;cursor:pointer;position:relative;z-index:310}
`;
const DROITE = `
header .brand{width:100%}
@media (max-width:560px){header .brand .brand-x,header .brand .brand-partner{display:none!important}header .brand{flex-wrap:nowrap!important}}
#vp-d{margin-left:auto;display:flex;align-items:center;gap:14px;position:relative;z-index:310}
#vp-d #vy-lang{position:static!important;inset:auto!important;transform:none!important;margin:0!important}
#vp-d #vy-lang ul{right:0}
#vp-d .sc{display:flex;align-items:center;gap:14px}
#vp-d .sc a{font:400 14px/1 Inter,sans-serif;color:rgba(255,255,255,.72);text-decoration:none;padding:10px 0;position:relative;letter-spacing:.01em}
#vp-d .sc a.on{color:#fff}
#vp-d .sc a.on:after{content:'';position:absolute;left:0;right:0;bottom:3px;height:1px;background:#d9c9a3}
#vp-d .burger{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);display:grid;place-items:center;cursor:pointer}
#vp-d .burger i{display:block;width:15px;height:7px;border-top:1.3px solid #fff;border-bottom:1.3px solid #fff}
`;
const CSS = {
  A: BASE + `
#vp-a{display:flex;width:100%;margin-top:12px;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px;background:rgba(255,255,255,.04)}
#vp-a a{flex:1;text-align:center;padding:12px 0;border-radius:999px;font:400 14.5px/1 Inter,sans-serif;color:rgba(255,255,255,.75);text-decoration:none}
#vp-a a.on{background:#fff;color:#000;font-weight:500}
header .brand{flex-wrap:wrap!important}
#vp-btn-haut{margin-left:auto}`,
  B: BASE + `
#vp-tabs{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));height:72px;border-radius:26px;z-index:200;display:flex;border:1px solid rgba(255,255,255,.14);background:rgba(18,18,22,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#vp-tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.66);text-decoration:none;font:400 12.5px/1 Inter,sans-serif}
#vp-tabs a.on{color:#fff}#vp-tabs a.on svg{stroke:#d9c9a3}
#vp-tabs svg{width:24px;height:24px;fill:none;stroke:rgba(255,255,255,.72);stroke-width:1.2}
#vp-btn-haut{margin-left:auto}`,
  C: BASE + `
#vp-btn-haut{margin-left:auto;display:inline-flex;align-items:center;gap:10px}
#vp-btn-haut i{display:inline-block;width:18px;height:8px;border-top:1.5px solid #fff;border-bottom:1.5px solid #fff}
#vp-voile a.gros{display:block}
#vp-voile a.gros b{font-weight:200;font-size:36px}
#vp-voile a.gros small{display:block;font-size:13px;color:rgba(255,255,255,.6);font-weight:300;margin-top:3px}`,
  D: `
header .vy-menu{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;gap:8px!important;margin:10px 0 0!important;width:100%!important;padding:8px 0 2px}
header .vy-menu::-webkit-scrollbar{display:none}
header .vy-menu a,header .vy-menu a.vy-autre{flex:none;font:400 14px/1 Inter,sans-serif!important;letter-spacing:.01em!important;text-transform:none!important;color:rgba(255,255,255,.92)!important;padding:11px 14px!important;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.03)!important;min-height:0!important}
header .vy-menu a.vp-on{border-color:#d9c9a3!important;color:#fbf0d2!important}
header .vy-menu a.vp-nv{position:relative}
header .vy-menu a.vp-nv::after{content:'NOUVEAU';position:absolute;top:-7px;right:8px;font:500 7.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;background:#d9c9a3;color:#000;padding:3px 5px;border-radius:5px}
header .brand{flex-wrap:wrap!important}`,
  F: BASE + DROITE,
  G: BASE + DROITE + `
#vp-d .sc{gap:0;padding:3px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.04)}
#vp-d .sc a{font-size:12.5px;padding:8px 11px;border-radius:999px}
#vp-d .sc a.on{background:#fff;color:#111}#vp-d .sc a.on:after{display:none}`,
  H: DROITE + `
header .vy-menu{display:none!important}
#vp-d{flex-direction:column;align-items:flex-end;gap:4px}
#vp-d .sc a{font-size:14px;padding:4px 0}
#vp-d .sec{display:flex;gap:12px}
#vp-d .sec a{font:400 11.5px/1 Inter,sans-serif;color:rgba(255,255,255,.6);text-decoration:none;padding:6px 0}
@media (max-width:560px){#vp-d .sec a{font-size:11px}#vp-d .sc{gap:11px}}`,
  E: BASE + `
#vp-cap{position:fixed;top:calc(env(safe-area-inset-top) + 150px);left:50%;transform:translateX(-50%);z-index:250;width:min(92vw,330px);height:56px;overflow:hidden;border-radius:28px;border:1px solid rgba(255,255,255,.18);background:rgba(18,18,22,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:height .45s cubic-bezier(.2,.9,.2,1)}
#vp-cap.ouv{height:300px}
#vp-cap .l1{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 12px}
#vp-cap .l1 a{font:400 14px/1 Inter,sans-serif;color:rgba(255,255,255,.72);text-decoration:none;padding:10px 12px;border-radius:999px}
#vp-cap .l1 a.on{background:rgba(255,255,255,.14);color:#fff}
#vp-cap .l1 button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;font-size:18px}
#vp-cap .reste a{display:block;color:#fff;text-decoration:none;font:300 20px/1 Inter,sans-serif;padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}` };
const ICONES = ['<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="7" ry="9"/><path d="M9.5 15.5c1.5 1 3.5 1 5 0"/></svg>','<svg viewBox="0 0 24 24"><path d="M6 20c0-8 2-14 6-16 4 2 6 8 6 16"/><path d="M9 20c0-6 1-10 3-12M15 20c0-6-1-10-3-12"/></svg>','<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 6c0-2 1-3 3-3"/></svg>'];
let M = new URLSearchParams(location.search).get('m') || 'F';
const f = document.getElementById('f'), info = document.getElementById('info');

function appliquer(){
  let d; try { d = f.contentDocument; } catch(e){ return; } if(!d || !d.querySelector('header')) return;
  const lg = d.getElementById('vy-lang'); if(lg && lg.dataset.vpDeplace && appliquer.parent){ appliquer.parent.insertBefore(lg, appliquer.suivant || null); delete lg.dataset.vpDeplace; }
  d.querySelectorAll('[data-vp]').forEach(e => e.remove());
  const nav = d.querySelector('header .vy-menu');
  if(nav){ nav.querySelectorAll('[data-vp-ajout]').forEach(e => e.remove()); nav.querySelectorAll('a').forEach(a => a.classList.remove('vp-on', 'vp-nv')); }
  if(M === 'actuel') return;
  const st = d.createElement('style'); st.setAttribute('data-vp', ''); st.textContent = CSS[M]; d.head.appendChild(st);
  const brand = d.querySelector('header .brand'), ici = (d.defaultView.location.pathname.indexOf('/cheveux') === 0) ? 1 : 0;
  const el = (html, parent) => { const w = d.createElement('div'); w.innerHTML = html; const n = w.firstElementChild; n.setAttribute('data-vp', ''); (parent || d.body).appendChild(n); return n; };
  const voile = (inner) => { const v = el('<div id="vp-voile">' + inner + '</div>'); return v; };
  const bouton = (txt, v) => { const b = el('<button class="vp-btn" id="vp-btn-haut">' + txt + '</button>', brand); b.onclick = () => { v.classList.toggle('on'); b.innerHTML = v.classList.contains('on') ? (M === 'C' ? '<i></i>FERMER' : 'FERMER') : (M === 'C' ? '<i></i>MENU' : 'MENU'); }; return b; };
  const liens = LIENS.map((l, k) => '<a href="' + l[1] + '">' + l[0] + '<span>' + String(k + 1).padStart(2, '0') + '</span></a>').join('');
  if(M === 'A'){ const v = voile(liens); bouton('MENU', v); el('<nav id="vp-a">' + SCANS.map((s, k) => '<a href="' + s[1] + '"' + (k === ici ? ' class="on"' : '') + '>' + s[0] + '</a>').join('') + '</nav>', brand); }
  if(M === 'B'){ const v = voile(liens); bouton('MENU', v); el('<nav id="vp-tabs">' + SCANS.map((s, k) => '<a href="' + s[1] + '"' + (k === ici ? ' class="on"' : '') + '>' + ICONES[k] + s[0] + '</a>').join('') + '</nav>'); }
  if(M === 'C'){ const v = voile('<div class="g">LES SCANS</div>' + [['Peau','La lumière de votre peau'],['Cheveux','Face, profils, crâne, nuque'],['Aliment','Ce qui nourrit votre peau']].map((s, k) => '<a class="gros" href="' + SCANS[k][1] + '"><span style="font-size:11px">' + String(k + 1).padStart(2, '0') + '</span><b>' + s[0] + '<small>' + s[1] + '</small></b></a>').join('') + '<div class="g">VYVRE</div>' + liens); bouton('<i></i>MENU', v); }
  if(M === 'D' && nav){
    const peau = d.createElement('a'); peau.href = '/scan/'; peau.textContent = 'Scan peau'; peau.setAttribute('data-vp-ajout', ''); nav.insertBefore(peau, nav.firstChild);
    const al = d.createElement('a'); al.href = '/aliment'; al.textContent = 'Scan aliment'; al.className = 'vp-nv'; al.setAttribute('data-vp-ajout', ''); nav.insertBefore(al, nav.children[2]);
    (ici ? nav.querySelector('.vy-autre') : peau).classList.add('vp-on'); }
  if(M === 'F' || M === 'G'){ const v = voile(liens); const d0 = el('<div id="vp-d"><nav class="sc">' + SCANS.map((sc, k) => '<a href="' + sc[1] + '"' + (k === ici ? ' class="on"' : '') + '>' + sc[0] + '</a>').join('') + '</nav><button class="burger" aria-label="Menu"><i></i></button></div>', brand);
    d0.querySelector('.burger').onclick = () => v.classList.toggle('on'); ranger(d, d0, d0.querySelector('.burger')); }
  if(M === 'H'){ const dh = el('<div id="vp-d"><nav class="sc">' + SCANS.map((sc, k) => '<a href="' + sc[1] + '"' + (k === ici ? ' class="on"' : '') + '>' + sc[0] + '</a>').join('') + '</nav><nav class="sec">' + LIENS.map(l => '<a href="' + l[1] + '">' + l[0] + '</a>').join('') + '</nav></div>', brand); ranger(d, dh, null); }
  if(M === 'E'){ const c = el('<div id="vp-cap"><div class="l1"><nav>' + SCANS.map((s, k) => '<a href="' + s[1] + '"' + (k === ici ? ' class="on"' : '') + '>' + s[0] + '</a>').join('') + '</nav><button>+</button></div><div class="reste">' + LIENS.map(l => '<a href="' + l[1] + '">' + l[0] + '</a>').join('') + '</div></div>');
    const b = c.querySelector('button'); b.onclick = () => { c.classList.toggle('ouv'); b.textContent = c.classList.contains('ouv') ? '×' : '+'; }; }
}
/* le bouton de langue quitte sa place flottante et rejoint la rangee du menu (plus aucun chevauchement) */
function ranger(d, rangee, avant){ const lg = d.getElementById('vy-lang'); if(!lg) return; if(!lg.dataset.vpDeplace){ appliquer.parent = lg.parentNode; appliquer.suivant = lg.nextSibling; lg.dataset.vpDeplace = '1'; } rangee.insertBefore(lg, avant); }
function choisir(m){ M = m; document.querySelectorAll('#sel a').forEach(a => a.classList.toggle('on', a.dataset.m === m));
  try { history.replaceState(null, '', '?m=' + m); } catch(e){}
  info.textContent = INFO[m]; info.classList.remove('cache'); clearTimeout(choisir.t); choisir.t = setTimeout(() => info.classList.add('cache'), 3200); appliquer(); }
document.querySelectorAll('#sel a').forEach(a => a.onclick = () => choisir(a.dataset.m));
f.addEventListener('load', () => { appliquer(); setTimeout(appliquer, 800); });
choisir(M);
</script>
</body>
</html>
