        const bornes = [vals[0], q[0], q[1], q[2], vals[vals.length - 1]];
        for(let c2 = 0; c2 < 4; c2++){ x.fillStyle = rgba(K.halo, AL[c2]*4); x.fillRect(lx + c2*34, ly, 30, 7); texte(f(bornes[c2]) + '–' + f(bornes[c2 + 1]), lx + c2*34, ly + 18, 'left', .4); } }
      else texte('APPROCHEZ-VOUS DE LA LUMIÈRE', W/2, H*.3, 'center', .6); }

    ST.forEach(i2 => { const p = PC[i2]; x.strokeStyle = rgba(K.trait, .55*VIE); x.lineWidth = .6; x.beginPath(); x.moveTo(p.x, p.y - 5); x.lineTo(p.x + 4.3, p.y + 2.5); x.lineTo(p.x - 4.3, p.y + 2.5); x.closePath(); x.stroke(); x.fillStyle = rgba(K.coeur, .8); x.fillRect(p.x - .6, p.y - .6, 1.2, 1.2); });

  } else if(S === 32){

    else { const vague = (ttv*1.2) % 10;
      for(let n = 1; n <= 10; n++){ const g = Math.exp(-Math.pow(((n - vague + 10) % 10) - 0, 2)/2); x.fillStyle = rgba(g > .6 ? K.coeur : K.trait, (.22 + .45*g)*VIE*Math.sqrt(K.ft));

    x.setLineDash([2, 3]); x.lineWidth = .5; for(let n = 1; n < 7; n++){ [coupeDir(0, 1, y0 + n*h/7, .3), coupeDir(1, 0, x0 + n*w/7, .3)].forEach(pts => { if(pts.length > 3){ tracer(pts); x.strokeStyle = rgba(K.trait, .26*VIE*Math.sqrt(K.ft)); x.stroke(); } }); } x.setLineDash([]);

/* 29/09 (iPhone de Charles) : Safari sur iPhone lit mal la video donnee directement a MediaPipe,

function imageDetection(){
  const c = imageDetection.c || (imageDetection.c = document.createElement('canvas')), g = imageDetection.g || (imageDetection.g = c.getContext('2d'));
  const w = 480, h = Math.round(w * (v.videoHeight || 720) / (v.videoWidth || 1280));
  if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  g.drawImage(v, 0, 0, w, h); return c;
}
