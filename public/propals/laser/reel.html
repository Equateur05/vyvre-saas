<body>

<script type="module">
/* ==========================================================================
   LE VRAI LASER (28/09/2026). Charles : « trop enfant, plus fin, plus
   rétroéclairé, on doit sentir un vrai laser ». Donc : on ne DESSINE plus le
   visage. Une nappe laser est PROJETEE : une ligne de lumière qui balaie et se
   courbe sur le relief réel (maillage 3D de face_landmarker), comme une vraie
   ligne rouge posée sur la peau.
   Le rendu d'un vrai laser : un coeur presque blanc de moins d'un pixel, un
   halo rouge qui diffuse dans la peau, le grain (speckle) qui scintille, et la
   ligne qui continue, plus sombre, sur le décor.
   Les valeurs L*a*b* et ITA° sont lues dans les pixels, là où la ligne passe.
   ========================================================================== */
import { FilesetResolver, FaceLandmarker } from "/cheveux/vendor/mediapipe/vision_bundle.mjs";

const MODELES = { 1:'UNE LIGNE', 2:'LIGNES CROISÉES', 3:'RIDEAU', 4:'POINT', 5:'ROTATION', 6:'TRAME', 7:'SÉQUENCE' };
const Q = new URLSearchParams(location.search), S = MODELES[Q.get('s')] ? +Q.get('s') : 1, CROIX = S === 2;
document.getElementById('choix').innerHTML = Object.keys(MODELES).map(k => '<a href="?s=' + k + '"' + (+k === S ? ' class="on"' : '') + '>' + k + ' · ' + MODELES[k] + '</a>').join('');
const v = document.getElementById('v'), cv = document.getElementById('c'), x = cv.getContext('2d');
let W = 0, H = 0;
function taille(){ const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; x.setTransform(d,0,0,d,0,0); }
addEventListener('resize', taille); taille();
try { v.srcObject = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:'user', width:{ ideal:1280 }, height:{ ideal:720 } } }); await v.play(); document.getElementById('msg').style.display = 'none'; }
catch(e){ document.getElementById('msg').innerHTML = 'La caméra est nécessaire.<small>AUTORISEZ-LA, PUIS RECHARGEZ</small>'; throw e; }
const fs = await FilesetResolver.forVisionTasks('/cheveux/vendor/mediapipe/wasm');
const fo = d => ({ baseOptions:{ modelAssetPath:'/cheveux/vendor/mediapipe/modeles/face_landmarker.task', delegate:d }, runningMode:'VIDEO', numFaces:1 });
let face; try { face = await FaceLandmarker.createFromOptions(fs, fo('GPU')); } catch(e){ face = await FaceLandmarker.createFromOptions(fs, fo('CPU')); }
const ARETES = FaceLandmarker.FACE_LANDMARKS_TESSELATION;
const OVALE = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

let L = null, vu = 0;
const ech = document.createElement('canvas'), ec = ech.getContext('2d', { willReadFrequently:true });
function lire(now){
  let r; try { r = face.detectForVideo(v, now); } catch(e){ return; }
  const n = r.faceLandmarks && r.faceLandmarks[0]; if(!n) return;
  if(!L) L = n.map(p => ({ x:p.x, y:p.y, z:p.z })); else for(let i=0;i<L.length;i++){ L[i].x += (n[i].x-L[i].x)*.45; L[i].y += (n[i].y-L[i].y)*.45; L[i].z += (n[i].z-L[i].z)*.45; }
  vu = now;
  const EW = 320, EH = Math.round(EW * v.videoHeight / v.videoWidth); if(ech.width !== EW || ech.height !== EH){ ech.width = EW; ech.height = EH; }
  ec.drawImage(v, 0, 0, EW, EH);
}
let dw=0, dh=0, ox=0, oy=0;
function cadre(){ const vw = v.videoWidth || 1280, vh = v.videoHeight || 720, s = Math.max(W/vw, H/vh); dw = vw*s; dh = vh*s; ox = (W-dw)/2; oy = (H-dh)/2; }
const P = i => ({ x: ox + (1 - L[i].x) * dw, y: oy + L[i].y * dh });

/* ---- la ligne projetee : coupe du maillage, deplacee selon la profondeur ---- */
function lisse(o, cle){ return o.map((p, i) => { const w = o.slice(Math.max(0, i-2), i+3).map(q => q[cle]).sort((a, b) => a-b); const r = { x:p.x, y:p.y }; r[cle] = w[w.length >> 1]; return r; }); }
function coupeH(y){ const pts = [], k = dw*.3;
  for(const e of ARETES){ const a = P(e.start), b = P(e.end); if((a.y-y)*(b.y-y) < 0){ const t = (y-a.y)/(b.y-a.y), z = L[e.start].z + (L[e.end].z-L[e.start].z)*t; pts.push({ x:a.x+(b.x-a.x)*t, y:y - z*k }); } }
  pts.sort((p,q) => p.x-q.x); const o = []; for(const p of pts) if(!o.length || p.x - o[o.length-1].x > 1.2) o.push(p); return lisse(o, 'y'); }
function coupeV(xx){ const pts = [], k = dw*.3;
  for(const e of ARETES){ const a = P(e.start), b = P(e.end); if((a.x-xx)*(b.x-xx) < 0){ const t = (xx-a.x)/(b.x-a.x), z = L[e.start].z + (L[e.end].z-L[e.start].z)*t; pts.push({ x:xx - z*k*.7, y:a.y+(b.y-a.y)*t }); } }
  pts.sort((p,q) => p.y-q.y); const o = []; for(const p of pts) if(!o.length || p.y - o[o.length-1].y > 1.2) o.push(p); return lisse(o, 'x'); }

function coupeDir(nx, ny, c){ // la nappe laser : les points ou n·p = c, deplaces le long de n selon la profondeur
  const pts = [], k = dw*.3, tx = -ny, ty = nx;
  for(const e of ARETES){ const a = P(e.start), b = P(e.end), sa = a.x*nx + a.y*ny - c, sb = b.x*nx + b.y*ny - c;
    if(sa*sb < 0){ const t = sa/(sa - sb), z = L[e.start].z + (L[e.end].z-L[e.start].z)*t;
      pts.push({ x:a.x+(b.x-a.x)*t - nx*z*k, y:a.y+(b.y-a.y)*t - ny*z*k, s:(a.x+(b.x-a.x)*t)*tx + (a.y+(b.y-a.y)*t)*ty }); } }
  pts.sort((p,q) => p.s-q.s); const o = []; for(const p of pts) if(!o.length || p.s - o[o.length-1].s > 1.2) o.push(p);
  // lissage median perpendiculaire a la ligne
  return o.map((p, i) => { const w = o.slice(Math.max(0, i-2), i+3).map(q => q.x*nx + q.y*ny).sort((a, b) => a-b); const m = w[w.length >> 1], d = m - (p.x*nx + p.y*ny); return { x:p.x + nx*d, y:p.y + ny*d, s:p.s }; });
}
function longueurs(p){ const l=[0]; for(let i=1;i<p.length;i++) l.push(l[i-1]+Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y)); return l; }
function pointA(p,l,d){ let i=1; while(i<l.length-1&&l[i]<d) i++; const t=Math.max(0,Math.min(1,(d-l[i-1])/((l[i]-l[i-1])||1))); return {x:p[i-1].x+(p[i].x-p[i-1].x)*t,y:p[i-1].y+(p[i].y-p[i-1].y)*t}; }
function point(p, intensite){ // un point laser : coeur blanc, halo qui diffuse
  [[16,.04],[9,.08],[4.5,.2],[2.2,.5]].forEach(([r, a]) => { x.fillStyle = 'rgba(255,24,40,' + a*intensite + ')'; x.beginPath(); x.arc(p.x, p.y, r, 0, 7); x.fill(); });
  x.fillStyle = 'rgba(255,240,240,' + intensite + ')'; x.beginPath(); x.arc(p.x, p.y, .9, 0, 7); x.fill();
}

/* ---- le rendu physique d'une ligne laser ---- */
function tracer(pts){ x.beginPath(); x.moveTo(pts[0].x, pts[0].y); for(let i=1;i<pts.length-1;i++) x.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x+pts[i+1].x)/2, (pts[i].y+pts[i+1].y)/2); x.lineTo(pts[pts.length-1].x, pts[pts.length-1].y); }
function laser(pts, intensite){
  if(pts.length < 2) return;
  x.lineCap = 'round'; x.lineJoin = 'round';
  // halo : plusieurs passes de plus en plus larges et faibles (un « bloom » qui marche partout, iPhone compris)
  [[26,.030],[14,.055],[7,.11],[3,.30]].forEach(([w, a]) => { tracer(pts); x.strokeStyle = 'rgba(255,24,40,' + a*intensite + ')'; x.lineWidth = w; x.stroke(); });
  tracer(pts); x.strokeStyle = 'rgba(255,70,80,' + .95*intensite + ')'; x.lineWidth = 1.3; x.stroke();
  tracer(pts); x.strokeStyle = 'rgba(255,236,236,' + .95*intensite + ')'; x.lineWidth = .55; x.stroke();   // le coeur, presque blanc
  // le speckle : le grain lumineux qui scintille sur une vraie ligne laser
  for(let i = 0; i < pts.length; i++){ if(Math.random() > .35) continue; const p = pts[i];
    x.fillStyle = 'rgba(255,' + (180 + Math.random()*75|0) + ',' + (180 + Math.random()*75|0) + ',' + (Math.random()*.9*intensite) + ')';
    x.fillRect(p.x + (Math.random()-.5)*2, p.y + (Math.random()-.5)*2, 1, 1); }
}
/* la lumiere qui diffuse dans la peau, autour de la ligne, seulement sur le visage */
function diffusion(pts, horizontal){
  if(pts.length < 2) return;
  x.save(); x.beginPath(); OVALE.forEach((i, k) => { const p = P(i); k ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y); }); x.closePath(); x.clip();
  tracer(pts); x.strokeStyle = 'rgba(255,30,45,.10)'; x.lineWidth = 60; x.stroke();
  tracer(pts); x.strokeStyle = 'rgba(255,30,45,.08)'; x.lineWidth = 30; x.stroke();
  x.restore();
}
/* la ligne continue sur le decor, en plus sombre, de part et d'autre du visage */
function decor(pts, horizontal, pos){
  x.strokeStyle = 'rgba(255,30,45,.22)'; x.lineWidth = .8; x.beginPath();
  if(horizontal){ const a = pts[0], b = pts[pts.length-1]; x.moveTo(0, pos); x.lineTo(a.x, a.y); x.moveTo(b.x, b.y); x.lineTo(W, pos); }
  else { const a = pts[0], b = pts[pts.length-1]; x.moveTo(pos, 0); x.lineTo(a.x, a.y); x.moveTo(b.x, b.y); x.lineTo(pos, H); }
  x.stroke();
  x.strokeStyle = 'rgba(255,30,45,.05)'; x.lineWidth = 8; x.stroke();
}

/* ---- colorimetrie, lue la ou la ligne passe ---- */
function lin(c){ c /= 255; return c <= .04045 ? c/12.92 : Math.pow((c + .055)/1.055, 2.4); }
function lab(r, g, b){ r = lin(r); g = lin(g); b = lin(b);
  let X = (r*.4124 + g*.3576 + b*.1805)/.95047, Y = r*.2126 + g*.7152 + b*.0722, Z = (r*.0193 + g*.1192 + b*.9505)/1.08883;
  const f = t => t > .008856 ? Math.cbrt(t) : 7.787*t + 16/116; X = f(X); Y = f(Y); Z = f(Z); return { L:116*Y - 16, a:500*(X - Y), b:200*(Y - Z) }; }
function zone(ids){ let cx = 0, cy = 0; ids.forEach(i => { cx += L[i].x; cy += L[i].y; }); cx /= ids.length; cy /= ids.length;
  const px = Math.round(cx*ech.width), py = Math.round(cy*ech.height), r = Math.max(3, Math.round(ech.width*.012));
  let d; try { d = ec.getImageData(Math.max(0, px-r), Math.max(0, py-r), r*2, r*2).data; } catch(e){ return null; }
  let R0 = 0, G0 = 0, B0 = 0, n = 0; for(let i=0;i<d.length;i+=4){ R0 += d[i]; G0 += d[i+1]; B0 += d[i+2]; n++; }
  const c = lab(R0/n, G0/n, B0/n); c.ita = c.b > 2 ? Math.atan((c.L - 50)/c.b)*180/Math.PI : null; return c; }
const ZONES = [{ nom:'FRONT', ids:[151,9,108,337] }, { nom:'JOUE', ids:[205,50,187,123] }, { nom:'JOUE', ids:[425,280,411,352] }, { nom:'MENTON', ids:[199,175,200,18] }];
const lu = ZONES.map(() => ({ t:-9, c:null }));
const f = (n, d = 1) => n.toFixed(d).replace('.', ',');
function texte(t, px, py, al, a, rgb = '255,255,255'){ x.font = '300 9px "IBM Plex Mono", monospace'; x.textAlign = al; x.fillStyle = 'rgba(' + rgb + ',' + a + ')'; x.fillText(t, px, py); }

/* ---- le deroule ---- */
const t0 = performance.now(); let tLire = 0, debut = null, passages = 0, dernierSens = 1;
function image(now){
  if(v.readyState >= 2 && now - tLire > 33){ tLire = now; lire(now); }
  cadre(); x.clearRect(0, 0, W, H);
  const t = (now - t0)/1000;
  if(!L || now - vu > 3000){ debut = null; document.getElementById('phase').textContent = 'PLACEZ-VOUS FACE À L’ÉCRAN'; requestAnimationFrame(image); return; }
  if(debut === null){ debut = t; passages = 0; }
  const tt = t - debut;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; OVALE.forEach(i => { const p = P(i); x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
  const h = y1 - y0, w = x1 - x0;
  const per = 4.2, cx0 = (x0 + x1)/2, cy0 = (y0 + y1)/2;
  const va = (tt2, p) => .5 - .5*Math.cos(((tt2 % p)/p) * 2*Math.PI);          // aller-retour doux
  let yL = null, xL = null;
  x.save(); x.globalCompositeOperation = 'lighter';
  const nappe = (nx, ny, c, fort = 1, bord = true) => { const pts = coupeDir(nx, ny, c); if(pts.length > 3){ diffusion(pts, ny !== 0); if(bord) decor(pts, ny !== 0, c); laser(pts, fort); } return pts; };
  if(S === 1 || S === 2){
    yL = y0 - h*.06 + va(tt, per) * h*1.12; nappe(0, 1, yL);
    if(S === 2){ xL = x0 - w*.06 + va(tt*.83 + 1.3, per) * w*1.12; nappe(1, 0, xL, .85); }
  } else if(S === 3){
    // rideau : 9 lignes paralleles tres fines qui descendent lentement, comme un scanner 3D a lumiere structuree
    const pas = h/9, dec = (tt * pas * .35) % pas;
    for(let k = -1; k < 11; k++){ const y = y0 - pas + dec + k*pas; if(y < y0 - h*.1 || y > y1 + h*.08) continue;
      const pts = coupeDir(0, 1, y); if(pts.length > 3){ decor(pts, true, y); laser(pts, .5); } }
    yL = y0 + ((tt * .35 * h/9 * 9) % h);
  } else if(S === 4){
    // un point laser qui balaie la surface ligne par ligne (balayage de type trame)
    const lignes = 34, vit = 5.5, prog = tt * vit, row = Math.floor(prog) % lignes, fr = prog - Math.floor(prog), aller = row % 2 === 0;
    const y = y0 + (row + .5) * h/lignes, pts = coupeDir(0, 1, y);
    if(pts.length > 3){ const l = longueurs(pts), d = (aller ? fr : 1 - fr) * l[l.length-1], p = pointA(pts, l, d);
      // la trainee : le bout de ligne que le point vient de parcourir
      const d0 = Math.max(0, aller ? d - l[l.length-1]*.25 : d), d1 = aller ? d : Math.min(l[l.length-1], d + l[l.length-1]*.25);
      const seg = [pointA(pts, l, d0)]; for(let q = 0; q < pts.length; q++) if(l[q] > d0 && l[q] < d1) seg.push(pts[q]); seg.push(pointA(pts, l, d1));
      if(!aller) seg.reverse(); if(seg.length > 1) laser(seg, .45);
      point(p, 1); yL = p.y; xL = p.x; }
  } else if(S === 5){
    // une nappe qui tourne autour de l'axe du nez, lentement, comme un scanner rotatif
    const c = P(168), n1 = P(1), ang = tt * .7, nx = Math.cos(ang), ny = Math.sin(ang);
    nappe(nx, ny, c.x*nx + c.y*ny, 1, false);
    const ang2 = ang + Math.PI/2; nappe(Math.cos(ang2), Math.sin(ang2), n1.x*Math.cos(ang2) + n1.y*Math.sin(ang2), .35, false);
    yL = c.y; xL = c.x;
  } else if(S === 7){
    // la sequence : deux balayages horizontaux, puis deux verticaux, puis la trame en deux allers-retours
    const cyc = tt % (per*4 + 1.2), ph = cyc < per ? 0 : cyc < per*2 ? 1 : cyc < per*4 ? 2 : 3;
    const etiq = ['BALAYAGE HORIZONTAL', 'BALAYAGE VERTICAL', 'TRAME', 'LECTURE COMPLÈTE'][ph];
    document.getElementById('phase').dataset.seq = etiq;
    if(ph === 0){ yL = y0 - h*.06 + va(cyc, per) * h*1.12; nappe(0, 1, yL); }
    else if(ph === 1){ xL = x0 - w*.06 + va(cyc - per, per) * w*1.12; nappe(1, 0, xL); }
    else if(ph === 2){ yL = trame(y0 + va(cyc - per*2, per*2/2) * h, 1); }
    else { trame(-1e9, Math.max(0, 1 - (cyc - per*4)/1.2)); }
  } else if(S === 6){
    yL = trame(y0 + va(tt, per) * h, 1);
  }
  function trame(onde, force){
    // une trame de points projetee : les sommets et le milieu des aretes, deplaces selon la profondeur,
    // avec une onde de lecture qui passe
    const k = dw*.3;
    for(let q = 0; q < ARETES.length; q += 2){ const e = ARETES[q], a = L[e.start], b = L[e.end];
      const px = ox + (1 - (a.x + b.x)/2)*dw, py = oy + (a.y + b.y)/2*dh - (a.z + b.z)/2*k;
      const f = Math.exp(-Math.pow((py - onde)/(h*.06), 2)), sc = .25 + .75*f;
      x.fillStyle = 'rgba(255,30,45,' + (.22*sc*force) + ')'; x.beginPath(); x.arc(px, py, 3.2, 0, 7); x.fill();
      x.fillStyle = 'rgba(255,' + (150 + 100*f|0) + ',' + (150 + 100*f|0) + ',' + (.6 + .4*f) * (Math.random() < .08 ? .45 : 1) * force + ')'; x.fillRect(px - .7, py - .7, 1.4, 1.4); }
    return onde;
  }
  x.restore();
  // les mesures apparaissent la ou la ligne passe, puis s'effacent
  ZONES.forEach((z, i) => {
    let cx = 0, cy = 0; z.ids.forEach(k => { const p = P(k); cx += p.x; cy += p.y; }); cx /= z.ids.length; cy /= z.ids.length;
    if((yL !== null && Math.abs(cy - yL) < 6) || (xL !== null && Math.abs(cx - xL) < 6) || (S === 5 && Math.random() < .01)){ const c = zone(z.ids); if(c){ lu[i].c = c; lu[i].t = tt; } }
    const a = Math.max(0, 1 - (tt - lu[i].t)/2.2); if(a <= 0 || !lu[i].c) return;
    const c = lu[i].c, gauche = cx < (x0 + x1)/2, bx = gauche ? x0 - 18 : x1 + 18;
    x.strokeStyle = 'rgba(255,255,255,' + .35*a + ')'; x.lineWidth = .5; x.beginPath(); x.moveTo(cx, cy); x.lineTo(bx, cy); x.stroke();
    x.fillStyle = 'rgba(255,255,255,' + .9*a + ')'; x.fillRect(cx - 1, cy - 1, 2, 2);
    const al = gauche ? 'right' : 'left', dx = gauche ? -6 : 6;
    texte(z.nom, bx + dx, cy - 4, al, .85*a, '255,90,100');
    texte('L* ' + f(c.L) + '   a* ' + f(c.a) + '   b* ' + f(c.b), bx + dx, cy + 8, al, .8*a);
    texte(c.ita == null ? 'ITA° —' : 'ITA° ' + f(c.ita), bx + dx, cy + 20, al, .65*a);
  });
  // progression : trois passages complets = une lecture
  const pc = S === 7 ? Math.min(100, Math.round((tt % (per*4 + 1.2)) / (per*4) * 100)) : Math.min(100, Math.round(tt / (4.2*1.5) * 100));
  document.getElementById('pct').textContent = String(pc).padStart(2, '0');
  const ph = document.getElementById('phase'); ph.textContent = S === 7 ? (ph.dataset.seq || '') : (pc < 100 ? 'LECTURE EN COURS' : 'LECTURE COMPLÈTE');
  const vus = lu.filter(z => z.c).map(z => z.c);
  if(pc >= 100 && vus.length){ const m = vus.reduce((s, c) => ({ L:s.L + c.L/vus.length, b:s.b + c.b/vus.length }), { L:0, b:0 });
    document.getElementById('synthese').textContent = m.b > 2 ? 'ITA° MOYEN ' + f(Math.atan((m.L - 50)/m.b)*180/Math.PI) : ''; }
  requestAnimationFrame(image);
}
requestAnimationFrame(image);
</script>
