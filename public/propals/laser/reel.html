/* ==========================================================================
   LE VRAI LASER (28/09/2026). Charles : « trop enfant, plus fin, plus
   rétroéclairé, on doit sentir un vrai laser ». Donc : on ne DESSINE plus le
   visage. Une nappe laser est PROJETEE : une ligne de lumière qui balaie et se
   courbe sur le relief réel (maillage 3D de face_landmarker), comme une vraie
   ligne rouge posée sur la peau.

   halo rouge qui diffuse dans la peau, le grain (speckle) qui scintille, et la
   ligne qui continue, plus sombre, sur le décor.

import { FilesetResolver, FaceLandmarker } from "/cheveux/vendor/mediapipe/vision_bundle.mjs";

const Q = new URLSearchParams(location.search), S = MODELES[Q.get('s')] ? +Q.get('s') : 1, CROIX = S === 2;

  blanc: { nom:'BLANC', nm:'LUMIÈRE BLANCHE', halo:'205,220,255', trait:'232,238,255', coeur:'255,255,255', peau:'200,214,255' },
  bleu:  { nom:'BLEU',  nm:'450 NM', halo:'30,120,255', trait:'90,170,255',  coeur:'228,242,255', peau:'40,120,255'  },

document.getElementById('nm').textContent = K.nm;
document.getElementById('choix').innerHTML = Object.keys(MODELES).map(k => '<a href="?s=' + k + '&c=' + CO + '"' + (+k === S ? ' class="on"' : '') + '>' + k + ' · ' + MODELES[k] + '</a>').join('');

  const pts = [], k = dw*kf, tx = -ny, ty = nx;

      pts.push({ x:a.x+(b.x-a.x)*t - nx*z*k, y:a.y+(b.y-a.y)*t - ny*z*k, s:(a.x+(b.x-a.x)*t)*tx + (a.y+(b.y-a.y)*t)*ty, z }); } }

  return o.map((p, i) => { const w = o.slice(Math.max(0, i-2), i+3).map(q => q.x*nx + q.y*ny).sort((a, b) => a-b); const m = w[w.length >> 1], d = m - (p.x*nx + p.y*ny); return { x:p.x + nx*d, y:p.y + ny*d, s:p.s, z:p.z }; });

function longueurs(p){ const l=[0]; for(let i=1;i<p.length;i++) l.push(l[i-1]+Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y)); return l; }

function point(p, intensite){ // un point laser : coeur blanc, halo qui diffuse
  intensite *= VIE;
  [[14,.025],[8,.05],[4,.13],[1.9,.35]].forEach(([r, a]) => { x.fillStyle = rgba(K.halo, a*intensite); x.beginPath(); x.arc(p.x, p.y, r, 0, 7); x.fill(); });
  x.fillStyle = rgba(K.coeur, intensite); x.beginPath(); x.arc(p.x, p.y, .8, 0, 7); x.fill();
}

/* ---- le rendu physique d'une ligne laser ---- */
function tracer(pts){ x.beginPath(); x.moveTo(pts[0].x, pts[0].y); for(let i=1;i<pts.length-1;i++) x.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x+pts[i+1].x)/2, (pts[i].y+pts[i+1].y)/2); x.lineTo(pts[pts.length-1].x, pts[pts.length-1].y); }
function laser(pts, intensite){
  if(pts.length < 2) return; intensite *= VIE;
  x.lineCap = 'round'; x.lineJoin = 'round';
  // halo : plusieurs passes de plus en plus larges et faibles (un « bloom » qui marche partout, iPhone compris)
  [[22,.018],[12,.033],[6,.066],[2.5,.19]].forEach(([w, a]) => { tracer(pts); x.strokeStyle = rgba(K.halo, a*intensite); x.lineWidth = w; x.stroke(); });
  tracer(pts); x.strokeStyle = rgba(K.trait, .7*intensite); x.lineWidth = 1.1; x.stroke();
  tracer(pts); x.strokeStyle = rgba(K.coeur, .85*intensite); x.lineWidth = .45; x.stroke();   // le coeur, presque blanc
  // le speckle : le grain lumineux qui scintille sur une vraie ligne laser
  for(let i = 0; i < pts.length; i++){ if(Math.random() > .35) continue; const p = pts[i];
    x.fillStyle = rgba(Math.random() < .5 ? K.coeur : K.trait, Math.random()*.6*intensite);
    x.fillRect(p.x + (Math.random()-.5)*2, p.y + (Math.random()-.5)*2, 1, 1); }

/* la lumiere qui diffuse dans la peau, autour de la ligne, seulement sur le visage */
function diffusion(pts, horizontal, fo = 1){
  if(pts.length < 2) return;
  x.save(); x.beginPath(); OVALE.forEach((i, k) => { const p = P(i); k ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y); }); x.closePath(); x.clip();
  tracer(pts); x.strokeStyle = rgba(K.peau, .06*fo*VIE); x.lineWidth = 52; x.stroke();
  tracer(pts); x.strokeStyle = rgba(K.peau, .05*fo*VIE); x.lineWidth = 26; x.stroke();
  x.restore();
}
/* la ligne continue sur le decor, en plus sombre, de part et d'autre du visage */
function decor(pts, horizontal, pos, fo = 1){
  x.strokeStyle = rgba(K.peau, .15*fo); x.lineWidth = .7; x.beginPath();
  if(horizontal){ const a = pts[0], b = pts[pts.length-1]; x.moveTo(0, pos); x.lineTo(a.x, a.y); x.moveTo(b.x, b.y); x.lineTo(W, pos); }
  else { const a = pts[0], b = pts[pts.length-1]; x.moveTo(pos, 0); x.lineTo(a.x, a.y); x.moveTo(b.x, b.y); x.lineTo(pos, H); }
  x.stroke();
  x.strokeStyle = rgba(K.peau, .05*fo); x.lineWidth = 7; x.stroke();
}

/* ---- colorimetrie, lue la ou la ligne passe ---- */
function lin(c){ c /= 255; return c <= .04045 ? c/12.92 : Math.pow((c + .055)/1.055, 2.4); }

  const px = Math.round(cx*ech.width), py = Math.round(cy*ech.height), r = Math.max(3, Math.round(ech.width*.012));
  let d; try { d = ec.getImageData(Math.max(0, px-r), Math.max(0, py-r), r*2, r*2).data; } catch(e){ return null; }

/* 30/09 (Charles) : de vraies mesures, lues dans les pixels de peau seulement (la barbe, l'ombre ou les

  if(px < r || py < r || px > ech.width - r || py > ech.height - r) return { peau:0, sombre:true, hors:true };
  let d; try { d = ec.getImageData(Math.max(0, px-r), Math.max(0, py-r), r*2, r*2).data; } catch(e){ return null; }

    const ty = Math.max(96, Math.min(H - 190, cy)), tx = gauche ? 14 : W - 14 - tw, fin = gauche ? tx + tw + 8 : tx - 8;
    x.fillStyle = 'rgba(0,0,0,' + .42*a + ')'; x.fillRect(tx - 6, ty - 15, tw + 12, 44);
    x.strokeStyle = 'rgba(255,255,255,' + .3*a + ')'; x.lineWidth = .5; x.beginPath(); x.moveTo(cx, cy); x.lineTo(fin, ty); x.stroke();
    x.fillStyle = 'rgba(255,255,255,' + .9*a + ')'; x.fillRect(cx - 1, cy - 1, 2, 2);
    texte(z.nom, tx, ty - 4, 'left', .9*a, K.trait); texte(l2, tx, ty + 8, 'left', .8*a); texte(l3, tx, ty + 20, 'left', .6*a);
  });
  // progression : trois passages complets = une lecture
  const pc = S === 7 ? Math.min(100, Math.round((ttv % (per*2 + 3.4)) / (per*2 + 2.2) * 100)) : Math.min(100, Math.round(tt / (per*1.5) * 100));
  document.getElementById('pct').textContent = String(pc).padStart(2, '0');
  const ph = document.getElementById('phase'); ph.textContent = S === 7 ? (ph.dataset.seq || '') : (pc < 100 ? 'LECTURE EN COURS' : 'LECTURE COMPLÈTE');
  const vus = ZONES.map(z => z.m).filter(m => m && !m.sombre && m.peau >= .5 && m.ita != null);
  document.getElementById('synthese').textContent = vus.length >= 2 ? 'ITA° PEAU ' + f(vus.reduce((q, m) => q + m.ita, 0)/vus.length) : '';
  requestAnimationFrame(image);
}
requestAnimationFrame(image);
/* 29/09 (iPhone de Charles) : Safari sur iPhone lit mal la video donnee directement a MediaPipe,
   le visage n'etait jamais trouve. Comme le scan cheveux, on lui donne une image copiee de la video. */
function imageDetection(){
  const c = imageDetection.c || (imageDetection.c = document.createElement('canvas')), g = imageDetection.g || (imageDetection.g = c.getContext('2d'));
  const w = 480, h = Math.round(w * (v.videoHeight || 720) / (v.videoWidth || 1280));
  if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  g.drawImage(v, 0, 0, w, h); return c;
}
