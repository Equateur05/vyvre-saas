  let cx = 0, cy = 0; ids.forEach(i => { cx += L[i].x; cy += L[i].y; }); cx /= ids.length; cy /= ids.length;

  // trop bleue (b* <= 2) ne permet pas de le calculer : on l'affiche comme tel, sans inventer.

  const mesures = [];
  if(ca > 0) ZONES.forEach((z, i) => {
    const za = ca * f01(tt, 8.6 + i*.45, 9.2 + i*.45); if(za <= 0) return;
    let cx = 0, cy = 0; z.ids.forEach(k => { const p = P(k); cx += p.x; cy += p.y; }); const p = { x: cx/z.ids.length, y: cy/z.ids.length };
    const c = zone(z.ids); if(!c) return;
    const Lv = doux('L'+i, c.L), av = doux('a'+i, c.a), bv = doux('b'+i, c.b), it = c.ita == null ? null : doux('i'+i, c.ita);
    mesures.push({ L:Lv, a:av, b:bv, ita:it });
    reticule(p, za);
    const cote2 = (p.x < (b.x0 + b.x1)/2) ? -1 : 1;
    etiquette(p, [z.nom, 'L* ' + Lv.toFixed(1).replace('.', ',') + '  a* ' + av.toFixed(1).replace('.', ',') + '  b* ' + bv.toFixed(1).replace('.', ','), it == null ? 'ITA° — LUMIÈRE TROP FROIDE' : 'ITA° ' + it.toFixed(1).replace('.', ',')], cote2, za);
  });
  // 5. SYNTHESE : une ligne, au pied du visage
  const sa = A * f01(tt, 11.2, 11.9);
  if(sa > 0 && mesures.length){
    const m = mesures.reduce((s, c) => ({ L:s.L + c.L/mesures.length, a:s.a + c.a/mesures.length, b:s.b + c.b/mesures.length }), { L:0, a:0, b:0 });
    m.ita = m.b > 2 ? Math.atan((m.L - 50) / m.b) * 180 / Math.PI : null;
    const hom = Math.max(0, 100 - Math.sqrt(mesures.reduce((s, c) => s + (c.L - m.L)**2 + (c.a - m.a)**2 + (c.b - m.b)**2, 0) / mesures.length) * 4);
    const y = Math.min(H - 118, b.y1 + 58);
    x.strokeStyle = 'rgba(255,255,255,'+(.3*sa)+')'; x.lineWidth = .5; x.beginPath(); x.moveTo(W/2 - 150, y - 16); x.lineTo(W/2 + 150, y - 16); x.stroke();
    texte((m.ita == null ? 'ITA° — ' : 'ITA° MOYEN ' + m.ita.toFixed(1).replace('.', ',')) + '   ·   HOMOGÉNÉITÉ DU TEINT ' + hom.toFixed(0) + ' %', W/2, y, 'center', sa, 9.5);
    texte('MESURE RELATIVE · SANS CARTE DE RÉFÉRENCE DANS LE CADRE', W/2, y + 15, 'center', sa * .6, 8);
  }
  // barre et phase
  const ph = PHASES.filter(p => tt >= p[0]).pop();
  document.getElementById('phase').textContent = ph ? ph[1] : '—';
  const pc = Math.min(100, Math.round(tt / 12 * 100)); document.getElementById('pct').textContent = String(pc).padStart(2, '0');
  document.getElementById('prog').style.width = pc + '%';
  document.getElementById('etat').textContent = pc >= 100 ? 'LECTURE COMPLÈTE' : 'LECTURE EN COURS';
}

let tLire = 0; const t0 = performance.now();
function image(now){
  if(v.readyState >= 2 && now - tLire > 33){ tLire = now; lire(now); }
  cadre(); x.clearRect(0, 0, W, H);
  const t = (now - t0) / 1000;
  if(!L || now - vu > 3000){ debut = null; document.getElementById('etat').textContent = 'VISAGE NON DÉTECTÉ'; document.getElementById('phase').textContent = 'PLACEZ-VOUS FACE À L’ÉCRAN'; requestAnimationFrame(image); return; }
  if(debut === null || t - debut > DUREE) debut = t;
  scene(t);
  requestAnimationFrame(image);
}
requestAnimationFrame(image);
/* 29/09 (iPhone de Charles) : Safari sur iPhone lit mal la video donnee directement a MediaPipe,
   le visage n'etait jamais trouve. Comme le scan cheveux, on lui donne une image copiee de la video. */
function imageDetection(){
  const c = imageDetection.c || (imageDetection.c = document.createElement('canvas')), g = imageDetection.g || (imageDetection.g = c.getContext('2d'));
  const w = 480, h = Math.round(w * (v.videoHeight || 720) / (v.videoWidth || 1280));
  if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  g.drawImage(v, 0, 0, w, h); return c;
}
