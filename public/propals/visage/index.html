<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Visage · propositions</title>
<style>
:root{--fond:#f6f6f3;--encre:#22251f;--doux:#7b8074;--ligne:#dcdfd6;--scene:#0b0c0d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--encre);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #7d926b;outline-offset:3px}
header{display:flex;align-items:baseline;gap:14px;padding:max(12px,env(safe-area-inset-top)) 20px 4px}
.marque{font-size:22px;font-weight:500;letter-spacing:-1.2px;text-decoration:none;color:inherit}
.titre{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--doux)}
.barre{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:8px 20px 12px}
.prim{border:0;border-radius:40px;background:#272d22;color:#fff;padding:10px 17px;font-size:13.5px;min-height:40px}
.prim.on{background:#4c5a3e}
.seg{display:flex;align-items:center;border:1px solid var(--ligne);border-radius:40px;padding:3px;background:#fff}
.seg span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--doux);padding:0 8px 0 10px}
.seg button{border:0;background:none;border-radius:40px;padding:8px 12px;font-size:13px;color:#4c5245;min-height:34px}
.seg button.on{background:#272d22;color:#fff}
.vars{margin-left:auto}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;padding:0 20px 16px}
#scenes{min-height:0;display:flex;justify-content:center;gap:10px}
.scene{position:relative;margin:0;height:100%;aspect-ratio:4/5;max-width:100%;border-radius:20px;overflow:hidden;background:var(--scene);display:none;isolation:isolate}
.scene.on{display:block}
.scene video,.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene video{object-fit:cover;transform:scaleX(-1);display:none}
body.src-cam .scene video{display:block}
body.src-cam .scene .fond{display:none}
.scene figcaption{position:absolute;left:12px;top:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(8,10,12,.5);border-radius:20px;padding:6px 11px;pointer-events:none}
.scene figcaption b{font-weight:600;margin-right:4px}
body:not(.quad) .scene figcaption{display:none}
aside{align-self:end;padding-bottom:6px}
aside h2{font-size:26px;font-weight:350;letter-spacing:-.04em;margin:0 0 10px}
aside p{font-size:14px;line-height:1.65;color:#5f6558;margin:0 0 12px}
aside .fine{font-size:12px;color:var(--doux);line-height:1.6}
body.quad main{grid-template-columns:1fr}
body.quad #scenes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
body.quad .scene{width:100%;height:100%;aspect-ratio:auto;cursor:zoom-in}
body.quad aside{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
body.quad aside h2{font-size:16px;margin:0}
body.quad aside p{margin:0;font-size:13px}
body.quad #iPerf{display:none}
body.nu header,body.nu .barre,body.nu aside{display:none}
body.nu main{padding:0;grid-template-columns:1fr}
body.nu .scene{border-radius:0;width:100%;aspect-ratio:auto}
@media (max-width:700px){
  header{padding:max(10px,env(safe-area-inset-top)) 16px 2px;gap:10px}
  .titre{font-size:10.5px}
  .barre{padding:6px 16px 10px;gap:8px}
  .prim{padding:9px 14px;font-size:13px}
  .seg button{padding:7px 10px;font-size:12.5px}
  .seg span{padding:0 4px 0 8px}
  .vars{margin-left:0;width:100%;justify-content:space-between}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:0 16px max(10px,env(safe-area-inset-bottom))}
  .scene{width:100%;aspect-ratio:auto;border-radius:18px}
  aside h2{font-size:18px;margin:0 0 4px}
  aside p{font-size:12.5px;line-height:1.5;margin:0 0 4px}
  aside .fine{font-size:11px}
  #iNote{display:none}
  body.quad #scenes{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
  body.quad .scene{border-radius:14px}
  .scene figcaption{left:8px;top:8px;font-size:9.5px;padding:5px 8px}
}
</style>
</head>
<body>
<header><a class="marque" href="/">vyvre</a><span class="titre">Animation du visage · 4 propositions</span></header>
<nav class="barre" aria-label="Réglages">
  <button type="button" class="prim" id="bCam">Ouvrir la caméra</button>
  <div class="seg" role="group" aria-label="Photo de test"><span>Photo</span><button type="button" data-photo="p_073">1</button><button type="button" data-photo="p_192">2</button><button type="button" data-photo="p_330">3</button></div>
  <div class="seg vars" role="group" aria-label="Variante"><button type="button" data-v="0">V1</button><button type="button" data-v="1">V2</button><button type="button" data-v="2">V3</button><button type="button" data-v="3">V4</button><button type="button" id="bQuad">Les 4</button></div>
</nav>
<main>
  <div id="scenes"></div>
  <aside>
    <h2 id="iNom"></h2>
    <p id="iTxt"></p>
    <p class="fine" id="iNote">Les points suivis sont les vrais points de votre visage (478), lus sur cet appareil. Les valeurs L* et a* sont mesurées dans l’image. L’image n’est jamais envoyée.</p>
    <p class="fine" id="iPerf"></p>
  </aside>
</main>
<script type="module" src="/propals/visage/visage.js?v=2"></script>
</body>
</html>
