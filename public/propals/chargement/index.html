<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dix chargements</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#f2f4f5;--dim:rgba(242,244,245,.55);--line:rgba(255,255,255,.09);--glace:#9fd8e8;--champ:#e7dccb}
*{box-sizing:border-box}html,body{margin:0;background:#010203;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;
 background:rgba(6,7,10,.7);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}
header b{font-weight:500;letter-spacing:.4em;font-size:13px}
header span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.intro{padding:9vh 6vw 1vh;max-width:820px}
.intro h1{font-weight:200;font-size:clamp(30px,4vw,54px);line-height:1.05;margin:12px 0 14px;letter-spacing:-.02em}
.intro h1 em{font-style:italic;color:var(--champ)}
.intro p{color:var(--dim);line-height:1.6;font-size:16px;max-width:52ch;margin:0}
.k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--glace)}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:26px;padding:5vh 4vw 12vh}
@media(max-width:900px){.grille{grid-template-columns:1fr;padding:4vh 5vw 10vh}}
.item{position:relative;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#030405;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 40px 90px -50px #000}
.scene{position:relative;aspect-ratio:16/9;background:#010203;cursor:pointer}
.scene canvas{position:absolute;inset:0;width:100%;height:100%}
.leg{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:18px 24px 22px;border-top:1px solid var(--line)}
.leg h2{margin:0;font-weight:300;font-size:20px;letter-spacing:-.01em}
.leg p{margin:6px 0 0;color:var(--dim);font-size:14px;line-height:1.5;max-width:44ch}
.num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--glace)}
</style></head><body>
<header><b>VYVRE</b><span>Chargement · entre la capture et les résultats</span></header>
<div class="intro"><div class="k">Propales</div><h1>Dix films de quatre secondes,<br><em>le temps du calcul.</em></h1>
<p>Chaque scène a un début, un point de bascule et une fin. Clique pour rejouer. Donne-moi un numéro, je l'installe dans le scan.</p></div>
<div class="grille" id="g"></div>
<script>
const P=[
 ["01","Encre","La goutte tombe, l'encre envahit l'eau, puis tout est aspiré en un point.","encre"],
 ["02","Sonar","Chaque onde révèle un fragment du visage jusqu'à le dessiner entier.","sonar"],
 ["03","Prisme","Un faisceau se brise en spectre, balaie le visage, se recompose en lumière.","prisme"],
 ["04","Givre","Le froid gagne l'écran branche après branche, puis fond d'un seul coup.","givre"],
 ["05","Soie","Une soie tombe au ralenti, épouse un visage, s'envole.","soie"],
 ["06","Mercure","Des gouttes de métal se cherchent, fusionnent, deviennent une sphère.","mercure"],
 ["07","Aurore","La caméra monte au-dessus de l'horizon, l'aurore se déplie et se referme.","aurore"],
 ["08","Ascension","La poussière d'or remonte et se noue en un anneau suspendu.","ascension"],
 ["09","Battement","Deux battements traversent la peau vue de très près.","battement"],
 ["10","Constellation","Les 68 repères s'allument, tournent, s'envolent, s'effondrent.","constellation"]];
const g=document.getElementById('g');
P.forEach(([n,t,d,cle])=>{const el=document.createElement('div');el.className='item';
 el.innerHTML='<div class="scene"><canvas data-a="'+cle+'"></canvas></div>'+
 '<div class="leg"><div><h2>'+t+'</h2><p>'+d+'</p></div><div class="num">'+n+'</div></div>';
 g.appendChild(el);});

const TAU=Math.PI*2, DUR=4.6;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(p,a,b)=>cl((p-a)/(b-a),0,1);
const eo=t=>1-Math.pow(1-t,3), ei=t=>t*t*t, eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo5=t=>1-Math.pow(1-t,5), eb=t=>1+2.2*Math.pow(t-1,3)+1.2*Math.pow(t-1,2);
function ctx(c){const x=c.getContext('2d');const r=()=>{const b=c.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);
 c.width=b.width*d;c.height=b.height*d;x.setTransform(d,0,0,d,0,0);};r();addEventListener('resize',r);return x;}
// visage 68 reperes normalises (-.5...5)
const FACE=(()=>{const P=[];for(let i=0;i<17;i++){const a=Math.PI*(1.03-i/16*1.06);P.push([Math.cos(a)*.40,Math.sin(a)*.50+.06]);}
 for(let i=0;i<5;i++)P.push([-.33+i*.065,-.24-.03*Math.sin(i/4*Math.PI)]);
 for(let i=0;i<5;i++)P.push([.07+i*.065,-.24-.03*Math.sin(i/4*Math.PI)]);
 for(let i=0;i<4;i++)P.push([0,-.15+i*.07]);for(let i=0;i<5;i++)P.push([-.10+i*.05,.12]);
 for(let i=0;i<6;i++){const a=i/6*TAU;P.push([-.19+Math.cos(a)*.075,-.13+Math.sin(a)*.035]);}
 for(let i=0;i<6;i++){const a=i/6*TAU;P.push([.19+Math.cos(a)*.075,-.13+Math.sin(a)*.035]);}
 for(let i=0;i<12;i++){const a=i/12*TAU;P.push([Math.cos(a)*.145,.30+Math.sin(a)*.055]);}
 for(let i=0;i<8;i++){const a=i/8*TAU;P.push([Math.cos(a)*.085,.30+Math.sin(a)*.028]);}return P;})();
function proj(q,yaw,S){const c=Math.cos(yaw),s=Math.sin(yaw);const z=Math.sin(Math.abs(q[0])*3.1)*.12;
 const X=q[0]*c+z*s, Z=-q[0]*s+z*c, k=1/(1+Z*.5);return [X*S*k, q[1]*S*k, k];}
function contour(x,pts,S,cx,cy,a){x.beginPath();for(let i=0;i<=17;i++){const q=pts[i%17];i?x.lineTo(cx+q[0]*S,cy+q[1]*S):x.moveTo(cx+q[0]*S,cy+q[1]*S);}
 x.strokeStyle='rgba(207,230,239,'+a+')';x.lineWidth=1;x.stroke();}
function vign(x,W,H,f){const g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);
 g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+(f||.62)+')');x.fillStyle=g;x.fillRect(0,0,W,H);}
function grain(x,W,H,t,a){x.globalAlpha=a||.045;for(let i=0;i<70;i++){const px=(Math.sin(i*97.1+t*61)*.5+.5)*W,py=(Math.cos(i*41.7+t*53)*.5+.5)*H;
 x.fillStyle=i%2?'#fff':'#9fd8e8';x.fillRect(px,py,1.3,1.3);}x.globalAlpha=1;}
function point(x,W,H,k,teinte){if(k<=0)return;const S=Math.min(W,H),cx=W/2,cy=H/2;
 const R=S*(.02+.46*ei(k));const g=x.createRadialGradient(cx,cy,0,cx,cy,R);
 g.addColorStop(0,'rgba(255,255,255,'+cl(k*1.1,0,1)+')');g.addColorStop(.18,'rgba('+(teinte||'207,230,239')+','+k*.55+')');
 g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.globalAlpha=cl(k*1.3,0,1);x.beginPath();x.arc(cx,cy,S*.012*(1+k),0,TAU);x.fillStyle='#fff';x.fill();x.globalAlpha=1;}
function trait(x,W,H,k){if(k<=0)return;const S=Math.min(W,H),L=S*.9*eo(k);
 const g=x.createLinearGradient(W/2-L/2,0,W/2+L/2,0);g.addColorStop(0,'rgba(255,255,255,0)');
 g.addColorStop(.5,'rgba(255,255,255,'+(1-k*.2)+')');g.addColorStop(1,'rgba(255,255,255,0)');
 x.fillStyle=g;x.fillRect(W/2-L/2,H/2-.7,L,1.4);}

const A={};
/* 01 ENCRE — la goutte, la floraison, l'aspiration */
A.encre=(x,W,H,p)=>{const cx=W/2,cy=H/2,S=Math.min(W,H);
 const chute=seg(p,0,.16), bloom=seg(p,.15,.62), asp=seg(p,.66,.94), fin=seg(p,.9,1);
 const fond=255-235*eo(asp);x.fillStyle='rgb('+fond+','+(fond+2)+','+(fond+3)+')';x.fillRect(0,0,W,H);
 if(chute<1){const y=-S*.2+(cy-S*.02+S*.2)*ei(chute);const r=S*.035*(1+.3*Math.sin(chute*9));
  x.beginPath();x.ellipse(cx,y,r*(1-.25*chute),r*(1+.5*chute),0,0,TAU);x.fillStyle='#07090b';x.fill();}
 if(bloom>0){const k=eo(bloom), rr=S*.46*k*(1-.94*eio(asp));
  for(let i=0;i<150;i++){const a=i/150*TAU;
   const w=.42+.3*Math.sin(a*6+i)+.2*Math.sin(a*3-i*.7)+.18*Math.sin(a*13+bloom*4);
   const d=rr*(.34+.66*w)*(.5+.5*k);
   const px=cx+Math.cos(a)*d*.55, py=cy+Math.sin(a)*d*.5+ (1-k)*S*.06;
   x.beginPath();x.arc(px,py,rr*(.30+.16*Math.sin(a*4+i))*(1-asp*.6),0,TAU);
   x.fillStyle='rgba(5,7,9,'+(.030+.022*Math.sin(a*5+bloom*3))*(1-asp*.35)+')';x.fill();}
  x.beginPath();x.arc(cx,cy,rr*.30,0,TAU);x.fillStyle='rgba(4,6,8,'+(.5*k*(1-asp))+')';x.fill();
  // filaments
  x.strokeStyle='rgba(6,8,10,'+(.16*k*(1-asp))+')';x.lineWidth=1;
  for(let i=0;i<26;i++){const a=i/26*TAU+i*.11;x.beginPath();x.moveTo(cx,cy);
   for(let s=1;s<=10;s++){const d=rr*.55*s/10;x.lineTo(cx+Math.cos(a+Math.sin(s*.9+i)*.2)*d*.8,cy+Math.sin(a+Math.cos(s*.7+i)*.2)*d*.72);}x.stroke();}}
 if(asp>0){x.globalAlpha=eo(asp)*.9;x.fillStyle='#010203';
  const r=Math.max(W,H)*(1-eio(asp));x.beginPath();x.rect(0,0,W,H);x.arc(cx,cy,r,0,TAU,true);x.fill();x.globalAlpha=1;}
 point(x,W,H,fin);vign(x,W,H,.45*eo(asp));};
/* 02 SONAR — chaque onde revele un fragment, le visage se dessine */
A.sonar=(x,W,H,p)=>{const cx=W/2,cy=H/2,S=Math.min(W,H);
 x.fillStyle='#02040a';x.fillRect(0,0,W,H);
 const yaw=Math.sin(p*2.1)*.22, rev=seg(p,.06,.80), fin=seg(p,.86,1);
 // grille de fond
 x.strokeStyle='rgba(159,216,232,.05)';x.lineWidth=1;
 for(let i=1;i<7;i++){x.beginPath();x.arc(cx,cy,S*.09*i,0,TAU);x.stroke();}
 const ondes=4;
 for(let k=0;k<ondes;k++){const q=((p*1.9+k/ondes)%1),r=q*S*.62,a=(1-q)*(1-fin);
  x.beginPath();x.arc(cx,cy,r,0,TAU);x.strokeStyle='rgba(207,230,239,'+(a*.42)+')';x.lineWidth=1.6-q;x.stroke();
  const g=x.createRadialGradient(cx,cy,r*.82,cx,cy,r);g.addColorStop(0,'rgba(159,216,232,0)');
  g.addColorStop(1,'rgba(159,216,232,'+(a*.10)+')');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,TAU);x.fill();}
 FACE.forEach((q,i)=>{const pr=proj(q,yaw,S);const px=cx+pr[0],py=cy+pr[1];
  const d=Math.hypot(pr[0],pr[1])/(S*.62);
  const vu=cl((rev-d*.55)*3.2,0,1);if(vu<=0)return;
  let fl=0;for(let k=0;k<ondes;k++){const q2=((p*1.9+k/ondes)%1);fl=Math.max(fl,1-cl(Math.abs(q2*S*.62-Math.hypot(pr[0],pr[1]))/(S*.035),0,1));}
  const b=cl(vu*.55+fl,0,1);
  x.beginPath();x.arc(px,py,1.5+fl*2.4,0,TAU);x.fillStyle='rgba(255,255,255,'+b*(1-fin)+')';x.fill();
  if(fl>.3){const g=x.createRadialGradient(px,py,0,px,py,S*.05*fl);g.addColorStop(0,'rgba(159,216,232,'+fl*.5+')');
   g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(px-S*.05,py-S*.05,S*.1,S*.1);}
  if(i>0&&i<17){const pr0=proj(FACE[i-1],yaw,S);x.beginPath();x.moveTo(cx+pr0[0],cy+pr0[1]);x.lineTo(px,py);
   x.strokeStyle='rgba(207,230,239,'+(b*.30*(1-fin))+')';x.lineWidth=1;x.stroke();}});
 point(x,W,H,fin);grain(x,W,H,p,.03);vign(x,W,H,.6);};
/* 03 PRISME — le faisceau, le spectre, le balayage, la recomposition */
A.prisme=(x,W,H,p)=>{const cx=W/2,cy=H/2,S=Math.min(W,H);
 x.fillStyle='#040508';x.fillRect(0,0,W,H);
 const arr=seg(p,0,.22), disp=seg(p,.20,.52), bal=seg(p,.34,.78), rec=seg(p,.74,.95), fin=seg(p,.92,1);
 const rot=-.5+p*1.5;
 const bx=cx*eo(arr);const g0=x.createLinearGradient(0,0,bx,0);
 g0.addColorStop(0,'rgba(255,255,255,0)');g0.addColorStop(1,'rgba(255,255,255,.85)');
 x.fillStyle=g0;x.fillRect(0,cy-1.1,bx,2.2);
 const cols=[[255,92,110],[255,178,92],[250,240,140],[126,235,170],[120,180,255],[168,150,255]];
 if(disp>0){const sp=eo(disp)*(1-eio(rec));
  cols.forEach((c,i)=>{const a=(i-2.5)*.085*sp+Math.sin(rot)*.03;
   const g=x.createLinearGradient(cx,cy,W,cy+Math.tan(a)*(W-cx));
   g.addColorStop(0,'rgba('+c+',.75)');g.addColorStop(1,'rgba('+c+',0)');
   x.beginPath();x.moveTo(cx,cy-1.5);x.lineTo(W,cy+Math.tan(a)*(W-cx)-S*.018);
   x.lineTo(W,cy+Math.tan(a)*(W-cx)+S*.018);x.lineTo(cx,cy+1.5);x.closePath();
   x.fillStyle=g;x.globalCompositeOperation='screen';x.fill();x.globalCompositeOperation='source-over';});}
 if(bal>0){const fx=cx+W*.28, fy=cy, fs=S*.8, a=cl(bal*2,0,1)*(1-fin);
  const sw=cx+ (W-cx)*bal;
  x.save();x.beginPath();x.rect(0,0,sw,H);x.clip();
  FACE.forEach((q,i)=>{const px=fx+q[0]*fs*.55,py=fy+q[1]*fs*.62;
   x.beginPath();x.arc(px,py,1.3,0,TAU);x.fillStyle='rgba(255,255,255,'+a*.8+')';x.fill();});
  x.beginPath();for(let i=0;i<=17;i++){const q=FACE[i%17];const px=fx+q[0]*fs*.55,py=fy+q[1]*fs*.62;i?x.lineTo(px,py):x.moveTo(px,py);}
  x.strokeStyle='rgba(207,230,239,'+a*.5+')';x.lineWidth=1;x.stroke();x.restore();
  x.fillStyle='rgba(255,255,255,'+(.10*a)+')';x.fillRect(sw-2,0,3,H);}
 x.save();x.translate(cx,cy);x.rotate(rot);
 x.beginPath();for(let i=0;i<3;i++){const a=i/3*TAU-Math.PI/2,px=Math.cos(a)*S*.17,py=Math.sin(a)*S*.17;i?x.lineTo(px,py):x.moveTo(px,py);}x.closePath();
 const gp=x.createLinearGradient(-S*.17,-S*.17,S*.17,S*.17);gp.addColorStop(0,'rgba(255,255,255,.14)');
 gp.addColorStop(.5,'rgba(255,255,255,.03)');gp.addColorStop(1,'rgba(255,255,255,.10)');
 x.fillStyle=gp;x.fill();x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=1.2;x.stroke();x.restore();
 if(rec>0)trait(x,W,H,rec*(1-fin));
 point(x,W,H,fin);vign(x,W,H,.6);};
/* 04 GIVRE — la glace gagne le cadre puis fond */
A.givre=(x,W,H,p)=>{const cx=W/2,cy=H/2,S=Math.min(W,H);
 x.fillStyle='#030609';x.fillRect(0,0,W,H);
 const cr=seg(p,.02,.62), fonte=seg(p,.68,.94), fin=seg(p,.9,1);
 const k=eo(cr)*(1-eio(fonte));
 x.save();x.translate(cx,cy);
 const br=(x0,y0,ang,len,prof,seed)=>{if(prof===0||len<2.4)return;
  const x1=x0+Math.cos(ang)*len,y1=y0+Math.sin(ang)*len;
  x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);
  x.globalAlpha=(.18+prof*.16)*(1-fonte);x.lineWidth=prof*.42;x.stroke();
  if(prof>2){x.globalAlpha=.10*(1-fonte);const g=x.createRadialGradient(x1,y1,0,x1,y1,len*.7);
   g.addColorStop(0,'rgba(159,216,232,.5)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;
   x.beginPath();x.arc(x1,y1,len*.7,0,TAU);x.fill();}
  br(x1,y1,ang-.52-.1*Math.sin(seed),len*.66,prof-1,seed+1.3);
  br(x1,y1,ang+.52+.1*Math.cos(seed),len*.66,prof-1,seed+2.1);
  if(prof>3)br(x1,y1,ang+.04,len*.72,prof-1,seed+.7);};
 x.strokeStyle='rgba(214,238,246,.9)';
 for(let i=0;i<8;i++)br(0,0,i/8*TAU+.2,S*.20*k,5,i);
 x.globalAlpha=1;x.restore();
 const g=x.createRadialGradient(cx,cy,0,cx,cy,S*.5*k);
 g.addColorStop(0,'rgba(159,216,232,'+(.14*k)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 if(fonte>0){for(let i=0;i<60;i++){const a=i*1.7,d=S*.24*(1+eo(fonte)*1.4);
  const px=cx+Math.cos(a)*d*(.4+(i%7)/7),py=cy+Math.sin(a)*d*(.4+(i%5)/5)+eo(fonte)*S*.2;
  x.beginPath();x.arc(px,py,1.4,0,TAU);x.fillStyle='rgba(207,230,239,'+((1-fonte)*.5)+')';x.fill();}}
 point(x,W,H,fin);vign(x,W,H,.6);};
/* 05 SOIE — la soie tombe, epouse un visage, s'envole */
A.soie=(x,W,H,p)=>{x.fillStyle='#040404';x.fillRect(0,0,W,H);const cx=W/2,cy=H/2,S=Math.min(W,H);
 const tomb=seg(p,0,.34), forme=seg(p,.30,.68), env=seg(p,.72,.97), fin=seg(p,.92,1);
 const off=(1-eo(tomb))*-H*.9 + ei(env)*-H*1.1;
 const mask=eio(forme)*(1-eio(env));
 for(let l=0;l<54;l++){const u0=l/53;
  x.beginPath();
  for(let i=0;i<=64;i++){const u=i/64;
   let px=u*W, py=off+H*(.14+u0*.72)+Math.sin(u*4.2+p*3+u0*3.1)*H*.05+Math.sin(u*9-p*2+u0*1.7)*H*.014;
   // attraction vers le contour du visage
   const q=FACE[Math.floor(u*16)%17];
   const fxp=cx+q[0]*S*.9, fyp=cy+q[1]*S*.95;
   const w=mask*Math.exp(-Math.pow((u0-.5)*2.6,2))*Math.exp(-Math.pow((u-.5)*2.2,2));
   px+= (cx+(px-cx)*.55+ (fxp-cx)*.25 - px)*w;
   py+= (cy+(py-cy)*.5 + (fyp-cy)*.35 - py)*w;
   i?x.lineTo(px,py):x.moveTo(px,py);}
  const sh=.5+.5*Math.sin(p*3+u0*4.4+1.2);
  x.strokeStyle='rgba(248,246,242,'+(.03+sh*.17)*(1-fin*.6)+')';x.lineWidth=1.05;x.stroke();}
 const bx=((p*1.1)%1.25-.12)*W;const g=x.createRadialGradient(bx,cy,0,bx,cy,W*.26);
 g.addColorStop(0,'rgba(231,220,203,.20)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 point(x,W,H,fin,'231,220,203');vign(x,W,H,.55);};
/* 06 MERCURE — les gouttes se cherchent, fusionnent, la sphere respire */
A.mercure=(x,W,H,p)=>{x.fillStyle='#050607';x.fillRect(0,0,W,H);const cx=W/2,cy=H/2,S=Math.min(W,H);
 const app=seg(p,0,.18), fus=seg(p,.16,.62), sph=seg(p,.60,.88), fin=seg(p,.9,1);
 const k=eio(fus), N=11, pts=[];
 for(let i=0;i<N;i++){const a=i/N*TAU+p*.5+Math.sin(i*2.1)*.6;
  const d=S*(.34*(1-k)+.02)*(.6+.4*Math.sin(i*1.7));
  pts.push([cx+Math.cos(a)*d*1.25,cy+Math.sin(a)*d*.9,S*(.032+.018*Math.sin(p*3+i))*eo(app)]);}
 const R=S*(.045+.135*k)*(1+.02*Math.sin(p*9)*sph);
 pts.push([cx,cy+Math.sin(p*4)*S*.006,R]);
 const step=Math.max(2,Math.floor(Math.min(W,H)/170));
 for(let yy=0;yy<H;yy+=step)for(let xx=0;xx<W;xx+=step){let f=0;
  for(const q of pts){const dx=xx-q[0],dy=yy-q[1];f+=q[2]*q[2]/(dx*dx+dy*dy+1);}
  if(f>1){const v=cl((f-1)*1.1,0,1);
   const nx=(xx-cx)/R,ny=(yy-cy)/R;const spec=cl(1-Math.hypot(nx+.42,ny+.46)*1.5,0,1);
   const b=cl(.35+.45*v+.75*spec*spec,0,1)*255|0;
   x.fillStyle='rgb('+(b*.93|0)+','+(b*.96|0)+','+b+')';x.fillRect(xx,yy,step,step);}}
 if(sph>0){const g=x.createRadialGradient(cx,cy,R*.6,cx,cy,R*2.6);
  g.addColorStop(0,'rgba(220,235,245,'+(.16*sph)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);}
 point(x,W,H,fin);vign(x,W,H,.6);};
/* 07 AURORE — la camera monte, les rideaux se deplient puis se referment */
A.aurore=(x,W,H,p)=>{const mont=seg(p,0,.40), depl=seg(p,.12,.70), ferm=seg(p,.72,.96), fin=seg(p,.93,1);
 const hz=H*(1.18-.5*eio(mont));
 const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#01030a');bg.addColorStop(.6,'#020410');bg.addColorStop(1,'#010206');
 x.fillStyle=bg;x.fillRect(0,0,W,H);
 for(let i=0;i<90;i++){const sx=(i*137.5%W),sy=(i*71.3%H)*.75-(1-eio(mont))*H*.3;
  x.fillStyle='rgba(255,255,255,'+(.06+.22*Math.abs(Math.sin(p*2+i)))*eo(mont)+')';x.fillRect(sx,sy,1.2,1.2);}
 const amp=eo(depl)*(1-eio(ferm));
 x.globalCompositeOperation='screen';
 for(let b=0;b<6;b++){const off=b*1.31, c=b%2?'159,216,232':'186,232,206', N=180;
  for(let i=0;i<N;i++){const u=i/N, px=u*W;
   const h=H*(.66*amp)*Math.max(0,Math.sin(u*2.4+p*1.1+off))*(.45+.55*Math.sin(u*7-p*1.6+off)*Math.sin(u*3.1+off));
   if(h<2)continue;
   const top=hz-h-H*.03*Math.sin(u*3+p+off);
   const g=x.createLinearGradient(px,top,px,hz);
   const a=.11*amp*(.55+.45*Math.sin(u*17+p*3+off));
   g.addColorStop(0,'rgba('+c+',0)');g.addColorStop(.30,'rgba('+c+','+a+')');
   g.addColorStop(.80,'rgba('+c+','+(a*.5)+')');g.addColorStop(1,'rgba('+c+',0)');
   x.fillStyle=g;x.fillRect(px-W/N*.6,top,W/N*2.2,hz-top);}}
 x.globalCompositeOperation='source-over';
 const gh=x.createLinearGradient(0,hz-H*.06,0,hz+H*.02);
 gh.addColorStop(0,'rgba(159,216,232,0)');gh.addColorStop(1,'rgba(207,230,239,'+(.35*(ferm>0?1:amp))+')');
 x.fillStyle=gh;x.fillRect(0,hz-H*.06,W,H*.08);
 x.fillStyle='rgba(207,230,239,'+(.20+.7*eo(ferm))+')';x.fillRect(0,hz-.7,W,1.4);
 x.fillStyle='#010206';x.fillRect(0,hz+1,W,H-hz);
 point(x,W,H,fin);vign(x,W,H,.58);};
/* 08 ASCENSION — la poussiere remonte et se noue en anneau */
A.ascension=(x,W,H,p)=>{x.fillStyle='#03040a';x.fillRect(0,0,W,H);const cx=W/2,cy=H*.48,S=Math.min(W,H);
 const mont=seg(p,0,.50), noue=seg(p,.42,.80), tour=seg(p,.55,1), fin=seg(p,.9,1);
 const k=eio(noue), R=S*.28;
 for(let i=0;i<260;i++){const s=(i*37%100)/100, a=i/260*TAU*3.1+tour*2.4;
  const yUp=H*1.1-((p*.9+s)%1)*H*1.35;
  const rx=Math.cos(a)*R, rz=Math.sin(a)*R;
  const px0=cx+(s-.5)*W*.9, py0=yUp;
  const px1=cx+rx, py1=cy+rz*.30;
  const px=px0+(px1-px0)*k, py=py0+(py1-py0)*k;
  const prof=(rz/R*.5+.5), r=(.9+1.5*prof)*(.6+.4*s);
  x.beginPath();x.arc(px,py,r,0,TAU);
  x.fillStyle='rgba(238,214,164,'+((.18+.65*s)*(.35+.65*prof)*(1-fin*.7))+')';x.fill();}
 if(k>.35){x.beginPath();x.ellipse(cx,cy,R,R*.30,0,0,TAU);
  x.strokeStyle='rgba(238,214,164,'+((k-.35)*1.1*(1-fin))+')';x.lineWidth=1.1;x.stroke();
  const g=x.createRadialGradient(cx,cy,0,cx,cy,R*1.5);
  g.addColorStop(0,'rgba(238,214,164,'+(.10*k)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);}
 point(x,W,H,fin,'238,214,164');vign(x,W,H,.6);};
/* 09 BATTEMENT — deux battements traversent la peau */
A.battement=(x,W,H,p)=>{x.fillStyle='#06060a';x.fillRect(0,0,W,H);const cx=W/2,cy=H/2,S=Math.min(W,H);
 const zoom=.78+.30*eio(seg(p,0,.85));
 const bat=(t0)=>{const d=p-t0;return d<0?0:Math.pow(Math.max(0,1-d*3.4),3);};
 const b=Math.max(bat(.16)+bat(.30)*.6, bat(.56)+bat(.70)*.6);
 const onde=[seg(p,.16,.70),seg(p,.56,1)];
 const fin=seg(p,.9,1);
 for(let i=0;i<30;i++){const base=S*(.035+i*.0205)*zoom, r=base*(1+b*.055);
  x.beginPath();
  for(let a2=0;a2<=54;a2++){const a=a2/54*TAU;
   let rr=r*(1+.055*Math.sin(a*5+p*2+i*.42)+.035*Math.sin(a*3-p*1.6)+.02*Math.sin(a*9+i));
   onde.forEach(o=>{if(o>0&&o<1){const front=o*1.15;const d=Math.abs(i/30-front);
    rr*=1+.075*Math.exp(-d*d*60)*(1-o);}});
   const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr*.84;a2?x.lineTo(px,py):x.moveTo(px,py);}
  x.closePath();
  let e=0;onde.forEach(o=>{if(o>0&&o<1){const d=Math.abs(i/30-o*1.15);e=Math.max(e,Math.exp(-d*d*90)*(1-o));}});
  x.strokeStyle='rgba(240,214,214,'+(.045+.13*(1-i/30)+b*.10+e*.5)+')';x.lineWidth=1+e*.8;x.stroke();}
 const g=x.createRadialGradient(cx,cy,0,cx,cy,S*.26*(1+b*.9));
 g.addColorStop(0,'rgba(236,206,206,'+(.08+b*.26)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 point(x,W,H,fin,'236,206,206');grain(x,W,H,p,.04);vign(x,W,H,.62);};
/* 10 CONSTELLATION — les 68 reperes s'allument, tournent, s'envolent */
A.constellation=(x,W,H,p)=>{x.fillStyle='#02030a';x.fillRect(0,0,W,H);const cx=W/2,cy=H/2,S=Math.min(W,H);
 const pose=seg(p,0,.40), tourne=seg(p,.30,.72), envol=seg(p,.66,.90), coll=seg(p,.86,1), fin=seg(p,.93,1);
 const yaw=Math.sin(eio(tourne)*Math.PI)*.62;
 const pts=FACE.map((q,i)=>{const pr=proj(q,yaw,S*.95);
  const rad=Math.hypot(q[0],q[1]), ang=Math.atan2(q[1],q[0])+eo(envol)*1.4;
  const ex=Math.cos(ang)*rad*S*2.0, ey=Math.sin(ang)*rad*S*2.0;
  const e=eio(envol), c=eio(coll);
  const px=(cx+pr[0]+(ex-pr[0])*e)*(1-c)+cx*c, py=(cy+pr[1]+(ey-pr[1])*e)*(1-c)+cy*c;
  const vu=cl((pose*72-i)*.5,0,1);
  return [px,py,vu,pr[2]];});
 x.lineWidth=.7;
 for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){
   const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);
   if(d<S*.115){const a=(1-d/(S*.115))*.34*Math.min(pts[i][2],pts[j][2])*(1-coll);
    x.beginPath();x.moveTo(pts[i][0],pts[i][1]);x.lineTo(pts[j][0],pts[j][1]);
    x.strokeStyle='rgba(159,216,232,'+a+')';x.stroke();}}}
 pts.forEach(q=>{if(q[2]<=0)return;const r=(1.2+1.3*q[3])*(1+envol*.5);
  x.beginPath();x.arc(q[0],q[1],r,0,TAU);x.fillStyle='rgba(255,255,255,'+(.55+.45*q[2])*(1-coll*.4)+')';x.fill();
  if(q[2]>.9&&envol<.2){const g=x.createRadialGradient(q[0],q[1],0,q[0],q[1],S*.03);
   g.addColorStop(0,'rgba(159,216,232,.22)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;
   x.fillRect(q[0]-S*.03,q[1]-S*.03,S*.06,S*.06);}});
 point(x,W,H,fin);vign(x,W,H,.62);};

document.querySelectorAll('canvas[data-a]').forEach(c=>{const x=ctx(c),f=A[c.dataset.a];let vis=false,t0=performance.now();
 new IntersectionObserver(es=>{vis=es[0].isIntersecting;},{threshold:.2}).observe(c);
 c.closest('.scene').addEventListener('click',()=>{t0=performance.now();});
 (function boucle(now){requestAnimationFrame(boucle);if(!vis)return;const b=c.getBoundingClientRect();
  const p=((now-t0)/1000%DUR)/DUR;f(x,b.width,b.height,p);})(t0);});
</script></body></html>
