const COMMON=`
precision highp float;
uniform vec2 R; uniform float T; uniform float P;
#define PI 3.14159265
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(vec3 p){p=fract(p*.3183+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
vec3 env(vec3 d){
  float y=d.y;
  vec3 c=vec3(.004,.005,.007);
  c+=vec3(1.,.97,.92)*pow(max(0.,dot(d,normalize(vec3(-.6,.7,-.3)))),24.)*2.2;
  c+=vec3(.75,.85,.95)*pow(max(0.,dot(d,normalize(vec3(.8,.3,.4)))),10.)*.55;
  c+=vec3(.9,.82,.7)*smoothstep(.0,.9,y)*.06;
  c+=vec3(1.)*smoothstep(.985,1.,abs(d.x))*.3;
  return c;}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
vec3 finir(vec3 col,vec2 uv){
  float fl=smoothstep(.86,1.,P);
  float r=length(uv);
  col=mix(col,col*.15,fl*.9);
  col+=vec3(1.,.98,.95)*(.012/(r+.012))*fl*1.4;
  col*=1.-.35*dot(uv,uv);
  col=aces(col);
  col=pow(col,vec3(.4545));
  col+=(hash(vec3(gl_FragCoord.xy,T*60.))-.5)*.018;
  col*=smoothstep(0.,.06,P);
  return col;}
`;
const S={};
/* 1 PLANETAIRE — sphère armillaire en laiton */
S.planetaire=`
float sdT(vec3 p,float R0,float r){vec2 q=vec2(length(p.xz)-R0,p.y);return length(q)-r;}
float align;
vec3 ringP(vec3 p,int i){
  float fi=float(i);
  float a=T*(.35+fi*.17)*(1.-align)+fi*1.3*(1.-align);
  p.yz*=rot(fi*.7*(1.-align)+.3);
  p.xy*=rot(fi*1.1*(1.-align));
  p.xz*=rot(a);
  return p;}
float M(vec3 p,out float mat){
  float d=length(p)-.22; mat=2.;
  for(int i=0;i<5;i++){
    float fi=float(i),R0=.5+fi*.23;
    vec3 q=ringP(p,i);
    float dr=max(sdT(q,R0,.018), -(abs(q.y)-.012));
    float band=sdT(q,R0,.012);
    float tick=max(band-.006, abs(fract(atan(q.z,q.x)/PI*18.)-.5)-.12);
    float dd=min(dr,tick);
    vec3 pp=q-vec3(R0,0.,0.)*mat3(1.);
    vec3 pl=q; pl.xz*=rot(T*(1.+fi*.3)); pl-=vec3(R0,0.,0.);
    float sp=length(pl)-(.035+.012*fi);
    if(dd<d){d=dd;mat=1.;}
    if(sp<d){d=sp;mat=3.+fi;}
  }
  return d;}
float Md(vec3 p){float m;return M(p,m);}
vec3 N(vec3 p){vec2 e=vec2(.001,0);return normalize(vec3(Md(p+e.xyy)-Md(p-e.xyy),Md(p+e.yxy)-Md(p-e.yxy),Md(p+e.yyx)-Md(p-e.yyx)));}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  align=smoothstep(.62,.84,P);
  float dist=mix(4.8,2.6,smoothstep(0.,.8,P));
  vec3 ro=vec3(0.,.9-.6*P,-dist); ro.xz*=rot(T*.18+.4);
  vec3 ta=vec3(0.),fw=normalize(ta-ro),ri=normalize(cross(vec3(0,1,0),fw)),up=cross(fw,ri);
  vec3 rd=normalize(uv.x*ri+uv.y*up+1.7*fw);
  float t=0.,m=0.;vec3 col=vec3(0.);float glow=0.;
  for(int i=0;i<110;i++){vec3 p=ro+rd*t;float d=M(p,m);glow+=.004/(.02+abs(length(p)-.22));if(d<.0008||t>12.)break;t+=d*.8;}
  vec3 bg=env(rd)*.04; bg+=vec3(1.)*step(.9975,hash(floor(rd*400.)))*.6;
  col=bg;
  if(t<12.){
    vec3 p=ro+rd*t,n=N(p),r=reflect(rd,n);
    float fr=pow(1.-max(0.,dot(-rd,n)),5.);
    if(m<1.5){ vec3 alb=vec3(.95,.78,.52); col=env(r)*alb*1.6+alb*.02; }
    else if(m<2.5){ col=vec3(1.,.93,.82)*2.5+env(r)*.4; }
    else { vec3 alb=mix(vec3(.7,.85,.95),vec3(.95,.9,.85),fract(m*.37)); col=env(r)*alb*.9+fr*.4; }
    col+=fr*env(r)*.5;
  }
  col+=vec3(1.,.85,.6)*glow*.012;
  gl_FragColor=vec4(finir(col,uv),1.);}
`;
/* 1B 1C 1D — la sphère armillaire, en haute définition (base commune) */
const ARM=`
uniform float Q;
float align,pa,Ic;
uniform mat3 RM[5];uniform vec3 PC[5];
float HT,HM,HR,ET,ER;vec3 HL;
vec4 IA,IB;float IA4,IB4,CT;bool PR;
float hash1(float x){return fract(sin(x*12.9898+.713)*43758.5453);}
float hash2(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
mat3 mYZ(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,s,0.,-s,c);}
mat3 mXY(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.,-s,c,0.,0.,0.,1.);}
mat3 mXZ(float a){float c=cos(a),s=sin(a);return mat3(c,0.,s,0.,1.,0.,-s,0.,c);}
vec3 env2(vec3 d){
  vec3 c=vec3(.003,.0035,.0045);
  vec3 k=normalize(vec3(-.6,.7,-.3));float kd=dot(d,k);
  c+=vec3(1.,.97,.92)*(smoothstep(.93,.975,kd)*2.6+pow(max(0.,kd),16.)*.7);
  vec2 hz=normalize(d.xz+1e-5);float az=dot(hz,normalize(vec2(.85,.45)));

  c+=vec3(.9,.93,1.)*pow(max(0.,dot(d,normalize(vec3(.2,.3,1.)))),30.)*1.1;
  c+=vec3(.9,.82,.7)*smoothstep(0.,.9,d.y)*.05+vec3(.5,.45,.4)*exp(-abs(d.y)*14.)*.06;
  c+=vec3(1.,.95,.88)*pow(max(0.,kd),5.)*.35+vec3(.75,.85,.95)*pow(max(0.,dot(d,vec3(.8,.3,.4)*1.0776)),10.)*.4;
  c+=vec3(.28,.25,.22)*smoothstep(0.,-.7,d.y)*.12;
  return c;}
float M(vec3 p,out float mat,out vec3 lq,out float ri){
  float d=length(p)-.22;mat=2.;lq=p;ri=0.;
  for(int i=0;i<5;i++){
    float fi=float(i),R0=.5+fi*.23;
    if(PR){float ia=fi<.5?IA.x:fi<1.5?IA.y:fi<2.5?IA.z:fi<3.5?IA.w:IA4,ib=fi<.5?IB.x:fi<1.5?IB.y:fi<2.5?IB.z:fi<3.5?IB.w:IB4;if(CT<ia-.005||CT>ib+.005)continue;}
    vec3 q=RM[i]*p;
    vec2 cs=vec2(length(q.xz)-R0,q.y);float lc=length(cs);
    if(lc-.05<d){
      float dr=max(lc-.018,.012-abs(q.y));
      if(dr<d){d=dr;mat=1.;lq=q;ri=fi;}
      if(lc-.018<d){
        float tick=max(lc-.018,(abs(fract(atan(q.z,q.x)/PI*18.)-.5)-.12)*R0*.174);
        if(tick<d){d=tick;mat=1.;lq=q;ri=fi;}
      }
      float rb=max(abs(q.y)-.0012,abs(cs.x+.034)-.014);
      if(rb<d){d=rb;mat=10.;lq=q;ri=fi;}
    }
    float sp=length(q-PC[i])-(.035+.012*fi);
    if(sp<d){d=sp;mat=3.+fi;lq=q-PC[i];ri=fi;}
  }
  return d;}
float Md(vec3 p){float m,r;vec3 l;return M(p,m,l,r);}
vec3 Nrm(vec3 p,float e){vec2 k=vec2(1.,-1.);return normalize(k.xyy*Md(p+k.xyy*e)+k.yyx*Md(p+k.yyx*e)+k.yxy*Md(p+k.yxy*e)+k.xxx*Md(p+k.xxx*e));}
bool trace(vec3 ro,vec3 rd,float ms){
  HT=-1.;ET=0.;ER=9.;PR=false;
  float b=dot(ro,rd),c=dot(ro,ro)-2.44,h=b*b-c;
  if(h<0.)return false;
  h=sqrt(h);float t=max(0.,-b-h),tf=-b+h,pr=1e9,pt=0.;
  float hc=b*b-dot(ro,ro)+.0576,ca=1e9,tend=-1.;
  if(hc>0.){hc=sqrt(hc);ca=-b-hc;tend=-b+hc;}
  for(int i=0;i<5;i++){
    vec3 o=RM[i]*ro,v=RM[i]*rd;float a0=-1e9,b0=1e9;
    if(abs(v.y)>1e-5){float s1=(-.09-o.y)/v.y,s2=(.09-o.y)/v.y;a0=min(s1,s2);b0=max(s1,s2);}
    else if(abs(o.y)>.09){a0=1e9;b0=-1e9;}
    float Rb=.6+float(i)*.23,qa=dot(v.xz,v.xz),qb=dot(o.xz,v.xz),qc=dot(o.xz,o.xz)-Rb*Rb,qh=qb*qb-qa*qc;
    if(qa<1e-8){if(qc>0.){a0=1e9;b0=-1e9;}}
    else if(qh<0.){a0=1e9;b0=-1e9;}
    else{qh=sqrt(qh);a0=max(a0,(-qb-qh)/qa);b0=min(b0,(-qb+qh)/qa);}
    if(b0<a0){a0=1e9;b0=-1e9;}
    if(i==0){IA.x=a0;IB.x=b0;}else if(i==1){IA.y=a0;IB.y=b0;}else if(i==2){IA.z=a0;IB.z=b0;}else if(i==3){IA.w=a0;IB.w=b0;}else{IA4=a0;IB4=b0;}
    tend=max(tend,b0);
  }
  tf=min(tf,tend+.01);
  if(tf<t)return false;
  PR=true;
  for(int i=0;i<170;i++){
    if(float(i)>ms)break;
    float m,r;vec3 l;CT=t;
    float d=M(ro+rd*t,m,l,r),fp=max(t*pa,1e-5);
    if(d<fp*.05){HT=t;HM=m;HL=l;HR=r;PR=false;return true;}
    float ra=d/fp;
    if(ra>pr&&pr<ER){ER=pr;ET=pt;}
    pr=ra;pt=t;
    float nx=ca>t?ca:1e9;
    if(IA.x>t)nx=min(nx,IA.x);if(IA.y>t)nx=min(nx,IA.y);if(IA.z>t)nx=min(nx,IA.z);if(IA.w>t)nx=min(nx,IA.w);if(IA4>t)nx=min(nx,IA4);
    t+=min(d*.9,nx-t+.001);
    if(t>tf)break;
  }
  PR=false;

vec3 stars(vec3 d){
  vec3 id=floor(d*300.);
  float h=hash2(id);
  if(h<.9965)return vec3(0.);
  vec3 c=(id+.5+(vec3(hash2(id+7.1),hash2(id+13.7),hash2(id+29.3))-.5)*.5)/300.;
  float px=length(d-normalize(c))/pa,b=(h-.9965)/.0035;
  return mix(vec3(.75,.85,1.),vec3(1.,.93,.85),fract(h*91.7))*exp(-px*px*1.3)*(.25+1.6*b*b);}
vec3 fond(vec3 rd){
  float kd=max(0.,dot(rd,vec3(-.6,.7,-.3)*1.0776));
  return vec3(.003,.0035,.0045)+vec3(1.,.96,.9)*kd*kd*kd*kd*.012+vec3(.9,.82,.7)*max(rd.y,0.)*.0015;}
vec3 shade(vec3 p,vec3 rd,float m,vec3 lq,float ri,float t){
  float fp=max(t*pa,1e-5);
  PR=true;CT=t;
  vec3 n=Nrm(p,clamp(fp*.5,.0002,.003)),r=reflect(rd,n);
  PR=false;
  float nv=clamp(dot(-rd,n),0.,1.),fr=pow(1.-nv,5.);
  float ao=.45+.55*clamp(Md(p+n*.05)/.05,0.,1.);
  vec3 L=normalize(vec3(-.6,.7,-.3));
  vec3 er=env2(r),col;
  if(m<1.5){
#ifdef V_C
    vec3 alb=vec3(.84,.86,.89);
    col=mix(er,env2(n)*1.4,.4)*alb*1.15+alb*.012;
    col+=vec3(1.)*pow(1.-nv,9.)*.5;
#else
    vec3 alb=vec3(.96,.8,.56);
    col=er*alb*1.55+alb*.012;
#endif
    float rad=length(lq.xz);
    float br=hash1(floor(rad*5200.)+ri*31.);
    col*=mix(1.,.78+.44*br,1.-smoothstep(.25,.9,fp*5200.));
    col+=fr*er*.6;
    col+=vec3(1.,.96,.9)*pow(max(0.,dot(r,L)),140.)*1.2;
  } else if(m<2.5){
    vec3 q=mXZ(T*.3)*p;
    float lon=atan(q.z,q.x),lat=asin(clamp(q.y/.22,-1.,1.)),st=PI/12.;
    float g=min(abs(fract(lon/st+.5)-.5)*cos(lat),abs(fract(lat/st+.5)-.5))*st*.22;
    float ln=1.-smoothstep(.0005,.0005+fp,g);
#ifdef V_C
    col=vec3(.92,.94,.96)*1.5*(1.-.75*ln)+er*.2;
#elif defined(V_B)
    col=vec3(1.,.94,.84)*(2.2+2.2*Ic)*(1.-.45*ln)+er*.3;
#else
    col=vec3(1.,.93,.82)*2.5*(1.-.62*ln)+er*.4;
#endif
    ao=1.;
  } else if(m<9.){
    vec3 alb=mix(vec3(.72,.85,.96),vec3(.96,.92,.86),fract(m*.37));
#ifdef V_C
    alb=vec3(.9,.91,.92);col=mix(er,env2(n),.5)*alb*.9+fr*.4;
#else
    col=er*alb*.95+fr*er*.8+fr*vec3(.3,.32,.35)+vec3(1.)*pow(max(0.,dot(r,L)),220.)*2.;

    float rad=length(lq.xz),rr=rad-(.5+ri*.23);

    float f1=abs(fract(u+.5)-.5),f5=abs(fract(u/5.+.5)-.5)*5.,f10=abs(fract(u/10.+.5)-.5)*10.;

vec3 finir2(vec3 col,vec2 uv,float grain,float vig){
  float fl=smoothstep(.86,1.,P),r=length(uv);
  col=mix(col,col*.15,fl*.9);
  col+=vec3(1.,.98,.95)*(.012/(r+.012))*fl*1.4;

  col=aces(col);col=pow(col,vec3(.4545));
  float l=dot(col,vec3(.3333));
  float gn=hash2(vec3(gl_FragCoord.xy,mod(floor(T*24.),97.)))-.5;
  col+=gn*(grain*(.35+2.6*l*(1.-l))+.006);
  col*=smoothstep(0.,.06,P);
  return col;}
#ifdef V_B
vec3 bokeh(vec2 uv,float ca){
  vec3 c=vec3(0.);
  for(int k=0;k<3;k++){float fk=float(k),s=2.2+fk*1.9;
    vec2 g=uv*s+vec2(-ca*(1.2-fk*.3),T*.015*(1.+fk));vec2 id=floor(g),f=fract(g)-.5;

vec3 floorCol(vec3 pf,vec3 rd,float tf){
  vec3 rr=vec3(rd.x,-rd.y,rd.z);

  return c*exp(-sqrt(d2)*.32);}

 {const s=onW(C.ang-.19,BOT+1.32);ox.fillStyle=ink(.5*A1);ox.fillText('ml',s[0]+5,s[1]);}

/* ---- Noyau : division, et chaque noyau porte un actif ---- */
function noyauEtat(t,p){
 const a=ss(.26,.42,p),b=ss(.48,.64,p),c=ss(.62,.84,p),s1=1-.35*a,s2=s1*(1-.38*b);
 let C,nu,s,k;
 if(a<.001){C=[[0,0,0]];nu=1;s=1;k=0;}
 else if(b<.001){C=[[.9*a,0,0],[-.9*a,0,0]];nu=2;s=s1;k=.35*s1*(1-a);}
 else{nu=4;s=s2;k=.3*s2*(1-b);const rt=.35*Math.sin(t*.3)*c;C=[];
  for(const sx of [1,-1])for(const sy of [1,-1]){const x=.9*sx*(1+.3*c),y=.62*b*sy*(1+.22*c)+.03*Math.sin(t*1.3+sx+2*sy)*c,z=.25*c*sx*sy;
   C.push([Math.cos(rt)*x-Math.sin(rt)*z,y,Math.sin(rt)*x+Math.cos(rt)*z]);}}
 const ringM=ss(.06,.14,p)*(1-ss(.2,.26,p)),ringD=ss(.68,.8,p),ring=nu===1?ringM:nu===4?ringD:0;
 const N=C.map((_,i)=>nrm3(rXZ([.45,1,.3],i*1.9+t*.25)));
 return {C,N,nu,s,k,ring};}
const ACTIFS=[{mot:'HYDRATATION',nom:'Acide hyaluronique',f:'(C14H21NO11)n'},{mot:'BARRIÈRE',nom:'Céramide NP',f:'C36H73NO4'},{mot:'REPULPANT',nom:'Rétinol',f:'C20H30O'},{mot:'ÉCLAT',nom:'Vitamine C',f:'C6H8O6'}];
const MERE={mot:'BIOMARQUEURS',nom:'Niacinamide',f:'C6H6N2O'};
function formule(x,y,str,align,size,style){
 const parts=[];for(let i=0;i<str.length;i++){const ch=str[i],sub=/\d/.test(ch)||(ch==='n'&&str[i-1]===')');parts.push([ch,sub]);}
 const fN=`300 ${size}px Inter,system-ui,sans-serif`,fS=`400 ${(size*.66).toFixed(1)}px Inter,system-ui,sans-serif`;
 let w=0;for(const [ch,sub] of parts){ox.font=sub?fS:fN;w+=ox.measureText(ch).width+(sub?.3:.6);}
 let xx=align==='right'?x-w:x;ox.textAlign='left';ox.fillStyle=style;
 for(const [ch,sub] of parts){ox.font=sub?fS:fN;ox.fillText(ch,xx,sub?y+size*.28:y);xx+=ox.measureText(ch).width+(sub?.3:.6);}}
function noyau(t,p){
 const W=innerWidth,Hh=innerHeight,d=oc._d,hair=1/d;
 ox.setTransform(d,0,0,d,0,0);ox.clearRect(0,0,W,Hh);ocSale=true;
 const E=noyauEtat(t,p),fin=1-ss(.88,.97,p);
 const al=(E.nu===1?ss(.08,.16,p)*(1-ss(.19,.25,p)):E.nu===4?ss(.72,.82,p):0)*fin;if(al<=0)return;
 const d0=lerp(4.4,3.8,ss(0,.22,p)),dist=lerp(d0,5.6,ss(.3,.7,p));
 const pr=P=>{const z=P[2]+dist;return [W/2+P[0]*1.6/z*Hh,Hh/2-P[1]*1.6/z*Hh,z];};
 const or=a=>`rgba(236,214,172,${(a*al).toFixed(3)})`,bl=a=>`rgba(244,242,238,${(a*al).toFixed(3)})`;
 ox.lineWidth=hair;
 E.C.forEach((C,i)=>{const L=E.nu===1?MERE:ACTIFS[i],n=E.N[i],R=(E.nu===1?1.4:1.75)*E.s;
  let u=nrm3(crs3(n,[0,0,1])),v=crs3(n,u);
  const th0=Math.atan2(v[1],u[1]);const pts=[];
  for(let j=0;j<=90;j++){const th=th0-Math.PI*.38+j/90*Math.PI*.76,c=Math.cos(th),s=Math.sin(th);pts.push(pr([C[0]+R*(c*u[0]+s*v[0]),C[1]+R*(c*u[1]+s*v[1]),C[2]+R*(c*u[2]+s*v[2])]));}
  if(pts[0][0]>pts[pts.length-1][0])pts.reverse();
  const cum=[0];for(let j=1;j<pts.length;j++)cum.push(cum[j-1]+Math.hypot(pts[j][0]-pts[j-1][0],pts[j][1]-pts[j-1][1]));
  ox.font=`500 ${W<760?8.5:10.5}px Inter,system-ui,sans-serif`;const tr=W<760?2.2:3.6;
  const ws=[...L.mot].map(ch=>ox.measureText(ch).width+tr),tw=ws.reduce((a,b)=>a+b,0)-tr;
  const tot=cum[cum.length-1];
  if(tot>tw+10){let sPos=(tot-tw)/2;ox.textAlign='center';ox.textBaseline='middle';ox.fillStyle=or(1);ox.shadowColor='rgba(0,0,0,.9)';ox.shadowBlur=5;
   [...L.mot].forEach((ch,ci)=>{const m=sPos+ws[ci]/2;let j=1;while(j<cum.length-1&&cum[j]<m)j++;
    const f=(m-cum[j-1])/Math.max(1e-6,cum[j]-cum[j-1]),x=lerp(pts[j-1][0],pts[j][0],f),y=lerp(pts[j-1][1],pts[j][1],f),an=Math.atan2(pts[j][1]-pts[j-1][1],pts[j][0]-pts[j-1][0]);
    ox.save();ox.translate(x+Math.sin(an)*7,y-Math.cos(an)*7);ox.rotate(an);ox.fillText(ch,0,0);ox.restore();sPos+=ws[ci];});ox.shadowBlur=0;}
  if(W<760)return;
  const c=pr(C),rpx=R*1.6/c[2]*Hh,dir=E.nu===1?1:(C[0]>=0?1:-1),x0=c[0]+dir*rpx*1.02,x1=c[0]+dir*(rpx+46);
  ox.beginPath();ox.moveTo(x0,c[1]);ox.lineTo(x1,c[1]);ox.strokeStyle=or(.55);ox.stroke();
  ox.beginPath();ox.arc(x0,c[1],1.6,0,Math.PI*2);ox.fillStyle=or(.9);ox.fill();
  const xt=x1+dir*8,al2=dir>0?'left':'right';
  ox.textBaseline='alphabetic';ox.textAlign=al2;ox.font=`300 13px Inter,system-ui,sans-serif`;ox.fillStyle=bl(.92);ox.fillText(L.nom,xt,c[1]-4);
  formule(xt,c[1]+15,L.f,al2,12,or(.95));
 });
}

function dessine(t,p){const L=LISTE[cur];

}

 const dt=now-last;last=now;const L=LISTE[cur],hd=estHD(cur);
