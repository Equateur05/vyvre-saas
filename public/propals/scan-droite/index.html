<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan aliment · partie droite · vyvre</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 01/10 (Charles) : « la partie droite du scan, pas assez stylee : 8 propales de dingue ».
   A gauche : la vraie camera et la cartographie (vy-carto.js, le meme module que le parcours).
   A droite : huit facons de montrer la recherche des aliments, nourries par les mesures reelles (window.__vyMES)
   et par les vrais aliments de la base (niveau de preuve A, B ou C, au moins une etude, photo detouree). */
*{box-sizing:border-box;margin:0;padding:0}
:root{--encre:#1f2419;--gris:#6b6f66;--pale:#9a9d93;--or:#c9a063;--or2:rgba(214,176,112,.35);--fond:#f7f6f2}
html,body{background:var(--fond);color:var(--encre);font-family:Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100svh}
header{display:flex;align-items:center;justify-content:space-between;padding:18px max(16px,3vw)}
.marque{font-size:24px;font-weight:600;letter-spacing:-.045em}
#sel{display:flex;gap:2px;padding:4px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #e6e6df;overflow-x:auto;max-width:calc(100vw - 150px)}
#sel a{flex:none;padding:8px 12px;border-radius:999px;font-size:13px;color:var(--gris);cursor:pointer;white-space:nowrap}
#sel a.on{background:var(--encre);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(18px,3vw,48px);padding:6px max(16px,3vw) 40px;align-items:start}
.camera{position:sticky;top:16px;aspect-ratio:4/5;max-height:calc(100svh - 110px);border-radius:28px;overflow:hidden;background:#e9e9e3}
.camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camera .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--gris);font-size:15px}
#droite{min-height:calc(100svh - 110px);border-radius:28px;background:#fff;box-shadow:0 30px 70px -45px rgba(0,0,0,.35),inset 0 0 0 1px #ecebe4;padding:clamp(18px,2.4vw,32px);position:relative;overflow:hidden}
.ov{font:500 11.5px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--pale)}
.titre{font-size:clamp(26px,2.6vw,38px);font-weight:600;letter-spacing:-.035em;margin:6px 0 4px}
.lead{color:var(--gris);font-size:15px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.piste{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 12px;border-radius:999px;background:var(--or2);color:#8a6a35;font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.fine{font-size:12.5px;color:var(--pale);margin-top:14px}
img.al{object-fit:contain;filter:drop-shadow(0 10px 12px rgba(40,30,15,.2))}
/* 1 · tambour */
.tambour{position:relative;height:420px;perspective:900px;margin-top:10px}
.tambour .cyl{position:absolute;inset:0;transform-style:preserve-3d}
.tambour .it{position:absolute;left:0;right:0;top:50%;height:64px;margin-top:-32px;display:flex;align-items:center;gap:18px;padding:0 18px;backface-visibility:hidden;font-size:19px;color:var(--gris)}
.tambour .it img{width:54px;height:54px}
.tambour .loupe{position:absolute;left:0;right:0;top:50%;height:74px;margin-top:-37px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.55));box-shadow:inset 0 0 0 1px var(--or2),0 10px 30px -12px rgba(0,0,0,.2);pointer-events:none}
.tambour::before,.tambour::after{content:'';position:absolute;left:0;right:0;height:38%;z-index:3;pointer-events:none}
.tambour::before{top:0;background:linear-gradient(#fff,rgba(255,255,255,0))}.tambour::after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff)}
/* 2 · orbite */
.orb{position:relative;height:440px;margin-top:10px}
.orb .coeur{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#fff 55%,#f5efe3);box-shadow:0 0 0 1px var(--or2),0 30px 60px -30px rgba(160,120,60,.5)}
.orb .coeur b{display:block;font:500 30px 'IBM Plex Mono',monospace}.orb .coeur span{font-size:12px;color:var(--gris)}
.orb .pl{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;transition:filter .4s}
.orb .pl img{width:100%;height:100%}
.orb .pl.vise{filter:drop-shadow(0 0 14px rgba(214,176,112,.9))}
/* 3 · radar */
.radar{position:relative;width:min(420px,100%);aspect-ratio:1;margin:14px auto 0;border-radius:50%;background:radial-gradient(circle,#fff 0,#fbfaf6 60%,#f3f1ea 100%);box-shadow:inset 0 0 0 1px #ebe7da}
.radar .an{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px #efeadc}
.radar .an.a2{inset:16%}.radar .an.a3{inset:32%}
.radar .fais{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(214,176,112,.45),rgba(214,176,112,0) 22%);animation:tour 3.2s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
.radar .bl{position:absolute;width:46px;height:46px;margin:-23px;opacity:.18;transition:opacity .6s,transform .6s}
.radar .bl img{width:100%;height:100%}.radar .bl.vu{opacity:1;transform:scale(1.18)}
.radar .bl em{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font:500 11.5px Inter;color:var(--encre);opacity:0;transition:opacity .4s}.radar .bl.vu em{opacity:1}
.radar .secteur{position:absolute;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--pale)}
/* 4 · oscillo */
.graphes{display:grid;gap:12px;margin-top:14px}
.gr{display:grid;grid-template-columns:110px 1fr 86px;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:#faf9f5}
.gr span{color:var(--gris);font-size:14px}.gr b{font:500 22px 'IBM Plex Mono',monospace;text-align:right}
.gr canvas{width:100%;height:46px}
.ruban{display:flex;gap:22px;margin-top:18px;white-space:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ruban .rb{display:flex;gap:22px;animation:defile 26s linear infinite}
.ruban .ch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gris)}.ruban .ch img{width:36px;height:36px}.ruban .ch.vise{color:var(--encre);font-weight:600}
@keyframes defile{to{transform:translateX(-50%)}}
/* 5 · tri */
.tri{position:relative;height:430px;margin-top:10px}
.tri .col{position:absolute;top:0;bottom:0;width:30%;border-radius:18px;padding:12px}
.tri .ecarte{left:0;background:#f6f5f1}.tri .garde{right:0;background:linear-gradient(160deg,#fbf6ec,#fff);box-shadow:inset 0 0 0 1px var(--or2)}
.tri .col .ov{font-size:10.5px}
.tri .vol{position:absolute;width:56px;height:56px;transition:transform 1.1s cubic-bezier(.3,.8,.2,1),opacity .6s,filter .6s}
.tri .vol img{width:100%;height:100%}.tri .vol.non{filter:grayscale(1);opacity:.35}
.tri .vol.non::after{content:'';position:absolute;left:8%;right:8%;top:50%;height:2px;background:#b44;transform:rotate(-20deg)}
.tri .pile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--pale);font-size:12.5px}
/* 6 · palette */
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.pal .ton{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 20px 40px -24px rgba(0,0,0,.4);display:grid;place-items:end center;padding-bottom:12%;transition:background .8s}
.pal .ton span{font:500 12px 'IBM Plex Mono',monospace;color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.4)}
.roue{position:relative;width:min(380px,100%);aspect-ratio:1;margin:18px auto 0}
.roue .cl{position:absolute;width:48px;height:48px;margin:-24px;transition:transform .8s,opacity .8s}
.roue .cl img{width:100%;height:100%}
.roue .centre{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:13px;color:var(--gris);max-width:40%}
/* 7 · journal */
.journal{margin-top:14px;height:430px;overflow:hidden;border-radius:18px;background:#15150f;color:#e9dcc2;padding:16px 18px;font:400 13px/1.7 'IBM Plex Mono',monospace;-webkit-mask-image:linear-gradient(transparent,#000 20%);mask-image:linear-gradient(transparent,#000 20%);display:flex;flex-direction:column;justify-content:flex-end}
.journal p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.journal i{color:#8e8674;font-style:normal}.journal b{color:#f0c979;font-weight:500}.journal .ok{color:#a8d49b}.journal .non{color:#e39b8c}
/* 8 · grille */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:14px;position:relative}
.grille .tu{aspect-ratio:1;border-radius:10px;background:#f7f6f1;display:grid;place-items:center;opacity:.28;filter:grayscale(.9);transition:opacity .5s,filter .5s,transform .5s,background .5s}
.grille .tu img{width:82%;height:82%}
.grille .tu.vise{opacity:1;filter:none;background:#fbf4e6;transform:scale(1.08);box-shadow:inset 0 0 0 1px var(--or2)}
.grille .ligne{position:absolute;left:-6px;right:-6px;height:2px;background:linear-gradient(90deg,transparent,var(--or),transparent);box-shadow:0 0 18px 4px rgba(214,176,112,.35);top:0;animation:balaye 3s ease-in-out infinite alternate;pointer-events:none}
@keyframes balaye{to{top:100%}}
@media (max-width:860px){main{grid-template-columns:1fr}.camera{position:relative;top:0;max-height:none;aspect-ratio:4/4}#droite{min-height:0}#sel{max-width:calc(100vw - 110px)}}
</style>
</head>
<body>
<header><div class="marque">vyvre.</div><nav id="sel"></nav></header>
<main>
  <div class="camera" id="cam"><div class="msg" id="msg">Autorisez la caméra : la lecture et la cartographie démarrent seules.</div></div>
  <section id="droite"></section>
</main>
<script type="module" src="/aliment/parcours/vy-carto.js?v=14"></script>
<script>
const NOMS = { 1:'Tambour', 2:'Orbite', 3:'Radar', 4:'Oscillo', 5:'Tri', 6:'Palette', 7:'Journal', 8:'Grille' };
const LAB = { eclat:'éclat', rougeurs:'rougeurs', hydratation:'hydratation', pores_sebum:'pores', uniformite:'teint', rides_fermete:'fermeté', texture:'grain de peau' };
const q = new URLSearchParams(location.search); let V = NOMS[q.get('v')] ? +q.get('v') : 1;
let AL = [], raf = 0, tick = null, t0 = performance.now();
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const img = (f, cls = 'al') => '<img class="' + cls + '" alt="" src="/scan/aliment/photos/' + f.id + '.png" decoding="async">';
const nom = f => f.nom.split(' (')[0];
const f1 = v => (v == null || isNaN(v)) ? '—' : v.toFixed(1).replace('.', ',');
/* la piste suit ce que la camera mesure : rougeur des joues, clarte ; sinon elle tourne */
function piste(){ const m = window.__vyMES, j = m && m.zones && (m.zones.Joues || m.zones.Front);
  if(j && j.a > 17) return 'rougeurs'; if(j && j.L < 55) return 'eclat';
  const cy = ['eclat', 'rougeurs', 'hydratation', 'rides_fermete', 'pores_sebum']; return cy[Math.floor((performance.now() - t0)/3200) % cy.length]; }
const pour = k => AL.filter(f => f.cibles_peau.includes(k));
function entete(t, l){ return '<div class="ov">Aliments pour votre peau · en direct</div><div class="titre">' + t + '</div><div class="lead">' + l + '</div>'; }
function pied(){ return '<p class="fine">Aperçu en direct parmi ' + AL.length + ' aliments étudiés. Le vrai choix se fait à la fin de la lecture.</p>'; }

const SCENES = {
  1(){ // Tambour : un vrai sélecteur iOS en 3D, qui accélère puis se pose sur la piste
    const D = document.getElementById('droite'); D.innerHTML = entete('Le tambour.', 'Il tourne parmi les aliments et se pose sur ce que votre peau appelle.') + '<div class="tambour"><div class="cyl" id="cyl"></div><div class="loupe"></div></div><div id="pst"></div>' + pied();
    const N = 18, cyl = document.getElementById('cyl'); let liste = [], pos = 0, vit = 0, cible = 0, k0 = null;
    return now => { const k = piste(); if(k !== k0){ k0 = k; const p = pour(k); liste = (p.length >= 6 ? p : AL).slice().sort(() => Math.random() - .5); while(liste.length < N) liste = liste.concat(liste); liste = liste.slice(0, N);
        cyl.innerHTML = liste.map((f, i) => '<div class="it" style="transform:rotateX(' + (-i*360/N) + 'deg) translateZ(190px)">' + img(f) + '<span>' + esc(nom(f)) + '</span></div>').join(''); cible = pos + N*2 + Math.floor(Math.random()*N); document.getElementById('pst').innerHTML = '<span class="piste">Piste · ' + LAB[k] + '</span>'; }
      const d = cible - pos; vit += (d*.9 - vit)*.06; pos += vit*.016; cyl.style.transform = 'rotateX(' + (pos*360/N) + 'deg)';
      if(Math.abs(d) < .02 && performance.now() % 4000 < 20) cible = pos + 3 + Math.floor(Math.random()*5); };
  },
  2(){ // Orbite : les aliments gravitent autour d'une jauge vivante ; ceux de la piste s'illuminent
    const D = document.getElementById('droite'); const sel = AL.slice().sort(() => Math.random() - .5).slice(0, 16);
    D.innerHTML = entete('L’orbite.', 'Autour de votre mesure, les aliments qui lui répondent s’illuminent.') + '<div class="orb" id="orb"><div class="coeur"><div><b id="vc">—</b><span id="vl">a* joues</span></div></div>' + sel.map(f => '<div class="pl" data-c="' + f.cibles_peau.join(' ') + '">' + img(f) + '</div>').join('') + '</div><div id="pst"></div>' + pied();
    const pl = [...D.querySelectorAll('.pl')];
    return now => { const t = (now - t0)/1000, k = piste(), m = window.__vyMES, j = m && m.zones && m.zones.Joues; document.getElementById('vc').textContent = j ? f1(j.a) : '—';
      const W = document.getElementById('orb').clientWidth, R1 = Math.min(W*.42, 200);
      pl.forEach((e, i) => { const a = t*.35 + i/pl.length*Math.PI*2, r = R1*(i % 2 ? .78 : 1), z = Math.sin(a); const vise = e.dataset.c.includes(k);
        e.style.transform = 'translate(' + (Math.cos(a)*r) + 'px,' + (z*r*.42) + 'px) scale(' + ((.65 + .35*(z + 1)/2)*(vise ? 1.25 : 1)) + ')'; e.style.zIndex = Math.round(z*10) + 20; e.style.opacity = vise ? 1 : .45; e.classList.toggle('vise', vise); });
      document.getElementById('pst').innerHTML = '<span class="piste">Piste · ' + LAB[k] + '</span>'; };
  },
  3(){ // Radar : le faisceau balaie ; chaque aliment apparait quand il passe sur son secteur
    const D = document.getElementById('droite'); const S = ['eclat', 'rougeurs', 'hydratation', 'rides_fermete', 'pores_sebum'];
    const pts = []; S.forEach((s, si) => pour(s).slice(0, 5).forEach((f, j) => pts.push({ f, s, a:(si + .15 + j*.16)/S.length*Math.PI*2, r:.28 + (j % 3)*.18 })));
    D.innerHTML = entete('Le radar.', 'Le faisceau passe sur chaque besoin ; les aliments étudiés pour lui apparaissent.') + '<div class="radar" id="rad"><div class="an"></div><div class="an a2"></div><div class="an a3"></div><div class="fais"></div>'
      + S.map((s, si) => { const a = (si + .5)/S.length*Math.PI*2 - Math.PI/2; return '<div class="secteur" style="left:' + (50 + Math.cos(a)*47) + '%;top:' + (50 + Math.sin(a)*47) + '%;transform:translate(-50%,-50%)">' + LAB[s] + '</div>'; }).join('')
      + pts.map((p, i) => '<div class="bl" id="b' + i + '" style="left:' + (50 + Math.cos(p.a - Math.PI/2)*p.r*50) + '%;top:' + (50 + Math.sin(p.a - Math.PI/2)*p.r*50) + '%">' + img(p.f) + '<em>' + esc(nom(p.f)) + '</em></div>').join('') + '</div><div id="pst"></div>' + pied();
    return now => { const ang = ((now - t0)/3200 % 1)*Math.PI*2, k = piste();
      pts.forEach((p, i) => { const d = (ang - p.a + Math.PI*4) % (Math.PI*2); document.getElementById('b' + i).classList.toggle('vu', d < 1.4 || p.s === k && d < 3); });
      document.getElementById('pst').innerHTML = '<span class="piste">Piste · ' + LAB[k] + '</span>'; };
  },
  4(){ // Oscillo : la peau en courbes, en temps reel ; dessous, le ruban des aliments
    const D = document.getElementById('droite'); const R = AL.slice().sort(() => Math.random() - .5).slice(0, 22);
    D.innerHTML = entete('L’oscillo.', 'Votre peau en courbes, image par image. Dessous, les aliments qui suivent.') + '<div class="graphes">' + [['L','Clarté L*'],['a','Rougeur a*'],['b','Jaune b*']].map(([k, t]) => '<div class="gr"><span>' + t + '</span><canvas id="c' + k + '"></canvas><b id="v' + k + '">—</b></div>').join('') + '</div><div class="ruban"><div class="rb">' + R.concat(R).map(f => '<div class="ch" data-c="' + f.cibles_peau.join(' ') + '">' + img(f) + esc(nom(f)) + '</div>').join('') + '</div></div><div id="pst"></div>' + pied();
    const H = { L:[], a:[], b:[] }; let tPrec = 0;
    return now => { const m = window.__vyMES, j = m && m.zones && m.zones.Joues, k = piste(); if(!j || now - tPrec < 90) return; tPrec = now;
      ['L', 'a', 'b'].forEach(c => { const h = H[c]; h.push(j[c]); if(h.length > 90) h.shift(); document.getElementById('v' + c).textContent = f1(j[c]);
        const cv = document.getElementById('c' + c), d = devicePixelRatio || 1, w = cv.clientWidth, hh = cv.clientHeight; if(cv.width !== w*d){ cv.width = w*d; cv.height = hh*d; }
        const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, hh); const mn = Math.min(...h) - 1, mx = Math.max(...h) + 1;
        x.beginPath(); h.forEach((v, i) => { const px = i/(90 - 1)*w, py = hh - (v - mn)/(mx - mn)*hh; i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.strokeStyle = '#c9a063'; x.lineWidth = 1.6; x.stroke();
        x.lineTo(w, hh); x.lineTo(0, hh); x.closePath(); const g = x.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, 'rgba(214,176,112,.25)'); g.addColorStop(1, 'rgba(214,176,112,0)'); x.fillStyle = g; x.fill(); });
      D.querySelectorAll('.ch').forEach(e => e.classList.toggle('vise', e.dataset.c.includes(k)));
      document.getElementById('pst').innerHTML = '<span class="piste">Piste · ' + LAB[k] + '</span>'; };
  },
  5(){ // Tri : les aliments sortent de la pile ; ceux qui ne repondent pas a la piste partent a gauche, les autres a droite
    const D = document.getElementById('droite');
    D.innerHTML = entete('Le tri.', 'Un par un : écarté, ou gardé pour ce que votre peau appelle.') + '<div class="tri" id="tri"><div class="col ecarte"><div class="ov">Pas pour cette piste</div></div><div class="col garde"><div class="ov">Retenus</div></div><div class="pile" id="pile">265 aliments</div></div><div id="pst"></div>' + pied();
    const T = document.getElementById('tri'); let n = 0, gardes = 0, ecartes = 0, tPrec = 0;
    return now => { if(now - tPrec < 520) return; tPrec = now; const k = piste(), P = pour(k), f = Math.random() < .45 && P.length ? P[Math.random()*P.length | 0] : AL[Math.random()*AL.length | 0], ok = f.cibles_peau.includes(k);
      const W = T.clientWidth, H = T.clientHeight, e = document.createElement('div'); e.className = 'vol'; e.innerHTML = img(f); e.style.transform = 'translate(' + (W/2 - 28) + 'px,' + (H/2 - 28) + 'px) scale(.3)'; T.appendChild(e);
      const col = ok ? gardes++ : ecartes++, cx = ok ? W*.85 : W*.15, cy = 48 + (col % 6)*62;
      requestAnimationFrame(() => requestAnimationFrame(() => { e.style.transform = 'translate(' + (cx - 28 + ((col/6 | 0) % 2)*14) + 'px,' + cy + 'px) scale(' + (ok ? 1 : .8) + ')'; if(!ok) e.classList.add('non'); }));
      if(gardes > 6 || ecartes > 6){ T.querySelectorAll('.vol').forEach(v => { v.style.opacity = '0'; setTimeout(() => v.remove(), 600); }); gardes = ecartes = 0; }
      document.getElementById('pile').textContent = (++n) + ' passés en revue';
      document.getElementById('pst').innerHTML = '<span class="piste">Piste · ' + LAB[k] + '</span>'; };
  },
  6(){ // Palette : les vraies couleurs de votre peau, lues en direct ; autour, les aliments de la piste
    const D = document.getElementById('droite');
    D.innerHTML = entete('La palette.', 'Les couleurs réelles de votre peau, lues à l’instant, et les aliments de la piste autour.') + '<div class="pal">' + ['Front','Joues','Menton'].map(z => '<div class="ton" id="t' + z + '"><span>' + z + '</span></div>').join('') + '</div><div class="roue" id="roue"><div class="centre" id="ctr"></div></div><div id="pst"></div>' + pied();
    const lab2rgb = (L, a, b) => { let y = (L + 16)/116, x = a/500 + y, z = y - b/200; const f = t => t**3 > .008856 ? t**3 : (t - 16/116)/7.787; x = .95047*f(x); y = f(y); z = 1.08883*f(z);
      let r = x*3.2406 + y*-1.5372 + z*-.4986, g = x*-.9689 + y*1.8758 + z*.0415, bb = x*.0557 + y*-.204 + z*1.057; const c = v => Math.round(255*Math.max(0, Math.min(1, v > .0031308 ? 1.055*v**(1/2.4) - .055 : 12.92*v))); return 'rgb(' + c(r) + ',' + c(g) + ',' + c(bb) + ')'; };
    let k0 = null;
    return now => { const m = window.__vyMES, k = piste();
      if(m && m.zones) ['Front','Joues','Menton'].forEach(z => { const v = m.zones[z]; if(v) document.getElementById('t' + z).style.background = 'radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,0) 45%),' + lab2rgb(v.L, v.a, v.b); });
      if(k !== k0){ k0 = k; const p = pour(k).slice(0, 10), R = document.getElementById('roue'); R.querySelectorAll('.cl').forEach(e => e.remove());
        p.forEach((f, i) => { const e = document.createElement('div'); e.className = 'cl'; e.innerHTML = img(f); const a = i/p.length*Math.PI*2 - Math.PI/2; e.style.left = (50 + Math.cos(a)*40) + '%'; e.style.top = (50 + Math.sin(a)*40) + '%'; e.style.transform = 'scale(0)'; R.appendChild(e); setTimeout(() => e.style.transform = 'scale(1)', 60*i); });
        document.getElementById('ctr').textContent = p.length + ' aliments étudiés pour ' + LAB[k]; document.getElementById('pst').innerHTML = '<span class="piste">Piste · ' + LAB[k] + '</span>'; } };
  },
  7(){ // Journal : le moteur raconte ce qu'il fait, ligne a ligne, avec les vrais chiffres
    const D = document.getElementById('droite'); D.innerHTML = entete('Le journal.', 'Ce que la lecture fait, ligne à ligne, avec les vrais chiffres.') + '<div class="journal" id="jr"></div>' + pied();
    const J = document.getElementById('jr'); let tPrec = 0, i = 0;
    const ligne = h => { const p = document.createElement('p'); const s = ((performance.now() - t0)/1000).toFixed(1).padStart(5, ' '); p.innerHTML = '<i>' + s + ' s</i>  ' + h; J.appendChild(p); while(J.children.length > 22) J.firstChild.remove(); };
    return now => { if(now - tPrec < 420) return; tPrec = now; const m = window.__vyMES, k = piste(); i++;
      if(!m){ ligne('recherche du visage…'); return; }
      const z = m.zones || {}, typ = i % 6;
      if(typ === 0) ligne('maillage : <b>' + m.points + '</b> points · relief ' + f1(m.relief));
      else if(typ === 1 && z.Joues) ligne('joues : L* <b>' + f1(z.Joues.L) + '</b>  a* <b>' + f1(z.Joues.a) + '</b>  b* <b>' + f1(z.Joues.b) + '</b>');
      else if(typ === 2) ligne('lumière L* <b>' + f1(m.lumiere) + '</b> · cadrage <b>' + f1(m.cadrage) + ' %</b> · stabilité ' + f1(m.stabilite) + ' px');
      else { const f = AL[Math.random()*AL.length | 0], ok = f.cibles_peau.includes(k); ligne((ok ? '<span class="ok">retenu</span>  ' : '<span class="non">écarté</span>  ') + esc(nom(f)) + ' · preuve ' + f.niveau_preuve_peau + ' · ' + (ok ? 'piste ' + LAB[k] : 'hors piste')); } };
  },
  8(){ // Grille : tous les aliments etudies ; un faisceau balaie, ceux de la piste s'allument
    const D = document.getElementById('droite'); D.innerHTML = entete('La grille.', 'Tous les aliments étudiés. Ceux qui répondent à votre peau s’allument.') + '<div class="grille" id="gr">' + AL.slice(0, 96).map(f => '<div class="tu" data-c="' + f.cibles_peau.join(' ') + '" title="' + esc(nom(f)) + '">' + img(f) + '</div>').join('') + '<div class="ligne"></div></div><div id="pst"></div>' + pied();
    let k0 = null; return now => { const k = piste(); if(k === k0) return; k0 = k; D.querySelectorAll('.tu').forEach((e, i) => setTimeout(() => e.classList.toggle('vise', e.dataset.c.includes(k)), i*12)); document.getElementById('pst').innerHTML = '<span class="piste">Piste · ' + LAB[k] + ' · ' + pour(k).length + ' aliments</span>'; };
  }
};
function choisir(v){ V = v; cancelAnimationFrame(raf); document.querySelectorAll('#sel a').forEach(a => a.classList.toggle('on', +a.dataset.v === v));
  try { const u = new URL(location.href); u.searchParams.set('v', v); history.replaceState(null, '', u); } catch(e){}
  tick = SCENES[v](); const boucle = now => { try { tick && tick(now); } catch(e){ console.error(e); } raf = requestAnimationFrame(boucle); }; raf = requestAnimationFrame(boucle); }
document.getElementById('sel').innerHTML = Object.entries(NOMS).map(([k, n]) => '<a data-v="' + k + '">' + k + ' · ' + n + '</a>').join('');
document.getElementById('sel').onclick = e => { const a = e.target.closest('a'); if(a) choisir(+a.dataset.v); };
Promise.all([fetch('/scan/aliment/aliments_v4.json?v=2').then(r => r.json()), fetch('/scan/aliment/photos/credits.json?v=2').then(r => r.json())]).then(([a, c]) => {
  const L = Array.isArray(a) ? a : (a.aliments || a); AL = L.filter(f => ['A','B','C'].includes(f.niveau_preuve_peau) && (f.etudes || []).length && c[f.id] && !['pamplemousse','huitre','tofu','noix_bresil'].includes(f.id));
  choisir(V); });
navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ ideal:1280 }, height:{ ideal:960 } }, audio:false }).then(s => {
  const v = document.createElement('video'); v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = s; document.getElementById('cam').appendChild(v); document.getElementById('msg').remove(); v.play().catch(() => {}); })
  .catch(() => { document.getElementById('msg').textContent = 'Caméra refusée ou indisponible : les propositions de droite restent visibles, sans mesures en direct.'; });
