<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan aliment · vyvre</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--encre:#1d1d1f;--gris:#6e6e73;--pale:#86868b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{min-height:100svh;color:var(--encre);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(120% 70% at 50% 42%,#fff 0%,#fbfbfd 45%,#f0f0f3 100%)}
header{position:fixed;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;padding:22px max(16px,4vw);z-index:5}
.marque{font-size:26px;font-weight:600;letter-spacing:-.045em;color:var(--encre);text-decoration:none}
.retour{font-size:14px;color:var(--gris);text-decoration:none;padding:10px 4px}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:78px 16px 92px}
.kick{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--pale)}
h1{margin-top:14px;font-size:clamp(40px,min(6.4vw,9vh),86px);line-height:1.02;font-weight:600;letter-spacing:-.04em}
#scene{position:relative;width:min(1200px,100%);height:clamp(230px,36vh,430px);margin-top:clamp(6px,2vh,28px);--sol:30%;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
#scene::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--sol);background:linear-gradient(180deg,rgba(0,0,0,.028),rgba(0,0,0,0) 80%)}
#scene::after{content:"";position:absolute;left:6%;right:6%;bottom:var(--sol);height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.07) 30%,rgba(0,0,0,.07) 70%,transparent)}
.f{position:absolute;left:50%;bottom:var(--sol);transform-origin:50% 100%;will-change:transform,opacity;pointer-events:none}
.f img{position:absolute;left:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;-webkit-user-drag:none}
.f .p{top:0;filter:saturate(1.04)}
.f .r{top:100%;transform:scaleY(-1);opacity:.2;filter:blur(1.2px) saturate(.9);
  -webkit-mask-image:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,0) 42%);mask-image:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,0) 42%)}
.f .o{position:absolute;left:14%;right:14%;bottom:-7px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.2),rgba(0,0,0,0));filter:blur(3px)}
#nom{height:26px;margin-top:6px;font-size:17px;font-weight:400;color:var(--gris);letter-spacing:-.01em;transition:opacity .45s}
#nom.cache{opacity:0}
.num{font-variant-numeric:tabular-nums;color:var(--pale);margin-left:10px;font-size:13px;letter-spacing:.08em}
.sous{margin-top:clamp(10px,2vh,22px);max-width:560px;font-size:clamp(17px,1.6vw,21px);line-height:1.45;color:var(--gris);font-weight:400}
.cta{margin-top:clamp(18px,3vh,28px);display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 32px;border-radius:999px;background:var(--encre);color:#fff;text-decoration:none;font-size:17px;font-weight:500;letter-spacing:-.01em;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),box-shadow .35s}
.cta:hover{transform:scale(1.035);box-shadow:0 24px 48px -18px rgba(0,0,0,.5)}
.cta:active{transform:scale(.98)}
.note{margin-top:14px;font-size:13px;color:var(--pale)}
.monte{opacity:0;transform:translateY(14px);animation:monte 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes monte{to{opacity:1;transform:none}}
#cred{margin-top:4px;background:none;border:0;font:inherit;font-size:12px;color:var(--pale);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
#sel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.06);z-index:6;max-width:calc(100vw - 20px);overflow-x:auto}
#sel a{flex:none;padding:9px 13px;border-radius:999px;font-size:13px;color:var(--gris);text-decoration:none;cursor:pointer;white-space:nowrap}
#sel a.on{background:var(--encre);color:#fff}
dialog{margin:auto;max-width:min(640px,calc(100vw - 32px));max-height:80vh;border:0;border-radius:22px;padding:26px 24px;box-shadow:0 40px 80px -30px rgba(0,0,0,.4);font-size:13px;line-height:1.5;color:var(--gris)}
dialog::backdrop{background:rgba(250,250,252,.6);backdrop-filter:blur(8px)}
dialog h2{font-size:17px;color:var(--encre);font-weight:600;margin-bottom:12px}
dialog li{list-style:none;padding:6px 0;border-top:1px solid #eee}
dialog a{color:var(--gris)}
dialog button{margin-top:14px;border:0;background:var(--encre);color:#fff;border-radius:999px;padding:10px 20px;font:inherit;cursor:pointer}
body.propre #sel{display:none}
@media (max-width:600px){#sel a{padding:8px 9px;font-size:12px}#scene{height:clamp(230px,36vh,330px)}.cta{width:100%;max-width:340px;justify-content:center}}
</style>
</head>
<body>
<header><a class="marque" href="/scan/">vyvre.</a><a class="retour" href="/scan/">Retour</a></header>
<main>
  <p class="kick monte">Scan aliment</p>
  <h1 class="monte" style="animation-delay:.08s">Ce qui nourrit<br>votre peau.</h1>
  <div id="scene" aria-hidden="true"></div>
  <p id="nom" class="cache" aria-live="off"></p>
  <p class="sous monte" style="animation-delay:.25s">Votre peau lue en quelques secondes. Puis quatre aliments choisis pour elle, et la raison de chaque choix.</p>
  <a class="cta monte" style="animation-delay:.35s" href="/scan/">Lancer le scan</a>
  <p class="note monte" style="animation-delay:.42s">Le premier scan est offert.</p>
  <button id="cred" class="monte" style="animation-delay:.5s" type="button">Crédits photos</button>
</main>
<nav id="sel"></nav>
<dialog id="dlg"><h2>Crédits photos</h2><ul id="liste"></ul><button type="button" onclick="this.closest('dialog').close()">Fermer</button></dialog>
<script>
const LISTE = [["fraise","Fraise"],["citron","Citron"],["avocat","Avocat"],["grenade","Grenade"],["orange","Orange"],["myrtille","Myrtille"],["kiwi","Kiwi"],["poivron_rouge","Poivron rouge"],["ananas","Ananas"],["framboise","Framboise"],["mangue","Mangue"],["chou_rouge","Chou rouge"],["peche","Pêche"],["brocoli","Brocoli"],["cerise","Cerise"],["citron_vert","Citron vert"],["pasteque","Pastèque"],["aubergine","Aubergine"],["papaye","Papaye"],["poire","Poire"],["tomate","Tomate"],["fruit_passion","Fruit de la passion"],["potiron","Potiron"],["artichaut","Artichaut"],["pomme","Pomme"],["litchi","Litchi"],["mure","Mûre"],["carotte","Carotte"],["fenouil","Fenouil"],["gingembre","Gingembre"],["clementine","Clémentine"],["betterave","Betterave"],["radis","Radis rose"],["curcuma","Curcuma"],["abricot","Abricot"]];
const N = LISTE.length;
const VARIANTES = { A:'Carrousel', B:'Plateau', C:'Solo', D:'Défilé', E:'Quatre' };
const q = new URLSearchParams(location.search);
let V = VARIANTES[q.get('v')] ? q.get('v') : 'A';
if(q.get('propre')) document.body.classList.add('propre');
const LENT = matchMedia('(prefers-reduced-motion: reduce)').matches ? .35 : 1;
const scene = document.getElementById('scene'), nomEl = document.getElementById('nom');
let W = 0, H = 0, items = [], tick = null, dernierNom = '';

function fruit(k){
  const [id] = LISTE[((k % N) + N) % N];
  const e = document.createElement('div'); e.className = 'f';
  e.innerHTML = '<i class="o"></i><img class="p" alt="" src="img/' + id + '.webp"><img class="r" alt="" src="img/' + id + '.webp">';
  e.k = k; scene.appendChild(e); return e;
}
function changer(e, k){ const id = LISTE[((k % N) + N) % N][0]; e.k = k; e.querySelectorAll('img').forEach(i => i.src = 'img/' + id + '.webp'); }
function taille(e, w){ if(e.w === w) return; e.w = w; e.style.width = w + 'px'; e.style.height = (w * .72) + 'px'; }
function poser(e, x, y, s, o, z){ e.style.transform = 'translate3d(' + (x - e.w / 2).toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + s.toFixed(4) + ')'; e.style.opacity = o.toFixed(3); e.style.zIndex = z; }
/* un fruit souleve : son reflet descend d'autant, son ombre s'efface (un vrai miroir au sol) */
function lever(e, h){ const r = e.querySelector('.r'), o = e.querySelector('.o'); r.style.transform = 'translateY(' + (2 * h).toFixed(1) + 'px) scaleY(-1)'; r.style.opacity = (.2 * Math.max(0, 1 - h / 160)).toFixed(3); o.style.opacity = Math.max(0, 1 - h / 120).toFixed(3); }
function nom(t, extra){ if(t === dernierNom) return; dernierNom = t; nomEl.classList.add('cache'); clearTimeout(nom.t); nom.t = setTimeout(() => { nomEl.innerHTML = t + (extra || ''); nomEl.classList.remove('cache'); }, 260); }
const lisse = u => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);
const sortie = u => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 3);
const rebond = u => { u = Math.min(1, Math.max(0, u)); const n = 7.5625, d = 2.75; let v; if(u < 1 / d) v = n * u * u; else if(u < 2 / d) v = n * (u -= 1.5 / d) * u + .75; else if(u < 2.5 / d) v = n * (u -= 2.25 / d) * u + .9375; else v = n * (u -= 2.625 / d) * u + .984375; return v; };   // rebond doux : deux petits sauts apres l'impact
function ressort(){ return { x:0, v:0, cible:0, pas(dt, k, c){ this.v += ((this.cible - this.x) * k - this.v * c) * dt; this.x += this.v * dt; } }; }
const enveloppe = d => ((d % N) + N * 1.5) % N - N / 2;

const MISES = {
  /* A · Carrousel : le fruit du centre en grand, les voisins s'effacent, un ressort a chaque pas */
  A(){
    const r = ressort(); items = LISTE.map((_, k) => fruit(k)); let dern = 0;
    return (t, dt) => {
      if(t - dern > 2.4 / LENT){ dern = t; r.cible++; }
      r.pas(dt, 38 * LENT, 11 * Math.sqrt(LENT));
      const w = Math.min(W * (W < 600 ? .46 : .3), H * .92), sp = w * (W < 600 ? .9 : .92);
      items.forEach((e, i) => {
        const d = enveloppe(i - r.x), a = Math.abs(d);
        taille(e, w);
        if(a > 3.2){ e.style.opacity = 0; return; }
        const s = Math.max(.4, 1 - (W < 600 ? .33 : .27) * Math.pow(a, .92));
        poser(e, d * sp * (1 - .06 * Math.min(a, 3)), 0, s, Math.max(0, Math.min(1, 1.25 - .4 * a)), 100 - Math.round(a * 10));
      });
      nom(LISTE[((Math.round(r.x) % N) + N) % N][1]);
    };
  },
  /* B · Plateau : une vitrine tournante vue de face, les fruits de derriere se renouvellent */
  B(){
    const M = 11, r = ressort(); items = []; for(let i = 0; i < M; i++) items.push(fruit(i));
    let dern = 0, prochain = M;
    return (t, dt) => {
      if(t - dern > 2.1 / LENT){ dern = t; r.cible++; }
      r.pas(dt, 26 * LENT, 9.5 * Math.sqrt(LENT));
      const R = Math.min(W * .4, 540), w = Math.min(W * (W < 600 ? .36 : .2), H * .72), front = ((Math.round(r.x) % M) + M) % M;
      items.forEach((e, i) => {
        const a = (i - r.x) / M * Math.PI * 2, z = Math.cos(a), x = Math.sin(a) * R, p = (z + 1) / 2;
        if(z < -.93 && !e.renouvele){ e.renouvele = true; changer(e, prochain++); }
        if(z > 0) e.renouvele = false;
        taille(e, w);
        poser(e, x, -(1 - p) * H * .2, .46 + .54 * p, .28 + .72 * Math.pow(p, 1.6), 100 + Math.round(z * 50));
      });
      nom(LISTE[items[front].k % N][1]);
    };
  },
  /* C · Solo : un seul fruit, en grand, il arrive, se pose, repart */
  C(){
    items = [fruit(0), fruit(1)]; const per = 3.1 / LENT; let courant = -1;
    return (t) => {
      const p = t / per, c = Math.floor(p), g = p - c, w = Math.min(W * (W < 600 ? .8 : .44), H * .98);
      if(c !== courant){ courant = c; changer(items[c % 2], c); changer(items[(c + 1) % 2], c + 1); nom(LISTE[c % N][1], '<span class="num">' + String(c % N + 1).padStart(2, '0') + ' / ' + N + '</span>'); }
      const e = lisse((g - .68) / .32), A = items[c % 2], B = items[(c + 1) % 2], L = W * .52;
      taille(A, w); taille(B, w);
      const flotte = Math.sin(t * 1.4) * 3 * (1 - e);
      poser(A, -e * L, 0, 1 - .22 * e, 1 - e, 2); lever(A, Math.max(0, flotte));
      poser(B, (1 - e) * L, 0, .78 + .22 * e, e, 1); lever(B, 0);
    };
  },
  /* D · Defile : un ruban continu, le fruit qui passe au centre grandit et ralentit (comme le Dock) */
  D(){
    items = LISTE.map((_, k) => fruit(k)); let off = 0;
    return (t, dt) => {
      const w = Math.min(W * (W < 600 ? .3 : .15), H * .6), sp = w * .95, L = N * sp;
      const pres = Math.abs(((off % sp) + sp) % sp - sp / 2) / (sp / 2);
      off += dt * LENT * (18 + 120 * Math.pow(pres, 1.6)) * (W < 600 ? .8 : 1);
      let best = 1e9, bi = 0;
      items.forEach((e, i) => {
        const x = ((i * sp - off) % L + L * 1.5) % L - L / 2 + sp / 2, g = Math.exp(-Math.pow(x / (W < 600 ? w * 1.2 : W * .13), 2));
        taille(e, w);
        const bord = 1 - lisse((Math.abs(x) / (W / 2) - .72) / .28);
        poser(e, x, 0, .72 + .62 * g, bord, 100 + Math.round(g * 50));
        if(Math.abs(x) < best){ best = Math.abs(x); bi = i; }
      });
      nom(LISTE[bi][1]);
    };
  },
  /* E · Quatre : quatre fruits tombent un a un et se posent sur la ligne, comme votre assiette */
  E(){
    items = [0, 1, 2, 3].map(k => fruit(k)); const per = 5.4 / LENT; let courant = -1;
    return (t) => {
      const c = Math.floor(t / per), u = t - c * per, w = Math.min(W * (W < 600 ? .23 : .17), H * .72), sp = Math.min(w * 1.12, W * .235);
      if(c !== courant){ courant = c; items.forEach((e, k) => changer(e, c * 4 + k)); nom(items.map(e => LISTE[e.k % N][1]).join('  ·  ')); }
      const partir = sortie((u - (per - .9 / LENT)) / (.8 / LENT));
      items.forEach((e, k) => {
        taille(e, w);
        const d = u - k * .34 / LENT, chute = 1 - (1 - rebond(d / (.95 / LENT))) * (d / (.95 / LENT) > .37 ? .3 : 1), h = (1 - chute) * H * .75;
        poser(e, (k - 1.5) * sp - partir * W * .7, -h, 1, d < 0 ? 0 : Math.min(1, d * 6) * (1 - partir), 10 + k);
        lever(e, h);
      });
    };
  }
};

function mesurer(){ const r = scene.getBoundingClientRect(); W = r.width; H = r.height; }
let t0 = 0, dernier = 0;
function boucle(ms){ if(!tick) return; const t = ms / 1000; const dt = Math.min(.05, dernier ? t - dernier : .016); dernier = t; tick(t - t0, dt); requestAnimationFrame(boucle); }
function lancer(v){
  V = v; scene.innerHTML = ''; items = []; dernierNom = ''; mesurer();
  tick = MISES[v](); t0 = performance.now() / 1000; dernier = 0;
  document.querySelectorAll('#sel a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  const u = new URL(location.href); u.searchParams.set('v', v); history.replaceState(null, '', u);
  requestAnimationFrame(boucle);
}
document.getElementById('sel').innerHTML = Object.entries(VARIANTES).map(([k, n]) => '<a data-v="' + k + '">' + k + ' · ' + n + '</a>').join('');
document.getElementById('sel').onclick = ev => { const a = ev.target.closest('a'); if(a && a.dataset.v !== V){ tick = null; requestAnimationFrame(() => lancer(a.dataset.v)); } };
addEventListener('resize', mesurer);
lancer(V);

/* credits obligatoires (CC BY, CC BY-SA) */
document.getElementById('cred').onclick = () => {
  const dlg = document.getElementById('dlg');
  fetch('/scan/aliment/photos/credits.json?v=1').then(r => r.json()).then(C => {
    document.getElementById('liste').innerHTML = LISTE.map(([id, n]) => { const c = C[id]; if(!c) return ''; return '<li><b>' + n + '</b> : ' + (c.titre || '') + (c.auteur ? ', ' + c.auteur : '') + ', <a href="' + c.licence_url + '" target="_blank" rel="noopener">' + c.licence + '</a>, <a href="' + c.source_url + '" target="_blank" rel="noopener">' + (c.fournisseur || 'source') + '</a></li>'; }).join('');
  }).catch(() => {}).finally(() => dlg.showModal());
};
</script>
</body>
</html>
