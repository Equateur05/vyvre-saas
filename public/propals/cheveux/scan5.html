<script type="module">
/* ==========================================================================
   LE GUIDAGE SANS ORDRES — cinq mises en scene du meme moment.
   On ne dit pas « tournez a gauche » : on montre ce qui reste a lire, et la
   personne tourne d'elle-meme pour le remplir (le principe de Face ID).

   Tout est REEL sur la camera :
   - l'orientation de la tete : « face_landmarker » de MediaPipe (Google,
     Apache 2.0), 478 points du visage, lus a chaque image ;
   - les cheveux : « hair_segmenter », le meme modele que les propales du scan.
   Une zone ne se remplit que si la tete est dans le bon angle ET que des
   cheveux sont vraiment vus a ce moment-la.

   Les cinq propales ne changent QUE la mise en scene et la facon de montrer
   l'avancement. La mesure — angles, masque des cheveux, huit images retenues
   par cote, nettete, immobilite — est rigoureusement la meme dans les cinq.

   ?p=1..5 choisit la mise en scene (touches 1 a 5, boutons en haut a droite) ·
   ?demo=1 : une tete fictive tourne toute seule (pour voir sans camera, et
   c'est ecrit a l'ecran) · ?photo=p_232 : une photo traitee comme la camera ·
   ?debug=1 : les angles lus.
   ========================================================================== */
import { FilesetResolver, ImageSegmenter, FaceLandmarker } from "/cheveux/vendor/mediapipe/vision_bundle.mjs";
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);

/* ---------------- les douze langues ----------------
   vy-i18n.js charge son dictionnaire apres ce module. Tant qu'il n'est pas la,
   T() rend null et on laisse le francais ecrit dans le HTML : jamais de clef
   nue a l'ecran. dit() pose la clef sur l'element ; VY.apply() la repeindra a
   chaque changement de langue. */
let LANGUE_PRETE = false;
function T(k, v){
  if(window.VY && VY.t){ const s = VY.t(k, v); if(s !== k) return s; }
  return null;
}
function dit(el, k){
  if(!el) return;
  el.setAttribute('data-i18n', k);
  const s = T(k); if(s !== null) el.textContent = s;
}
document.addEventListener('vy:lang', function(){
  LANGUE_PRETE = true;
  if(window.VY && VY.apply) VY.apply();
});
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1', DEBUG = Q.get('debug') === '1';

/* les quatre zones, nommees par le geste qui les montre */
const ZONES = ['face','gauche','droite','dessus'];
const NOMS = { face:'le devant', gauche:'le côté gauche', droite:'le côté droit', dessus:'le dessus' };
const CLEF_COTE = { face:'hcg.cote.face', gauche:'hcg.cote.gauche', droite:'hcg.cote.droite', dessus:'hcg.cote.dessus' };
const nomCote = z => T(CLEF_COTE[z]) ?? NOMS[z];
const DUREE_ZONE = { face:1.0, gauche:1.3, droite:1.3, dessus:1.4 };   /* secondes de lecture par zone */
const Z = { face:0, gauche:0, droite:0, dessus:0 };
let pose = 'face', vuCheveux = 0, visage = false, yawV = 0, pitchV = 0, finiDepuis = 0, bloqueDepuis = performance.now();

/* ---------------- camera ---------------- */
const vid = $('vid'); let src = null, miroir = true;
async function ouvrirSource(){
  if(!DEMO && !PHOTO){
    try{
      const st = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }, audio:false });
      vid.srcObject = st; await vid.play();
      await new Promise(r => vid.videoWidth ? r() : vid.onloadedmetadata = r);
      src = vid; return;
    }catch(e){}
  }
  if(!DEMO && !PHOTO){
    /* 23/09 — avant, une camera refusee affichait le portrait d'une INCONNUE et
       le compteur montait tout seul jusqu'a 100 % sans qu'aucune image existe :
       le parcours restait bloque la pour toujours. Desormais on rend la main. */
    dit($('note'), 'hcg.cam.t');
    dit($('phraseTxt'), 'hcg.cam.p');
    if(parent !== window) parent.postMessage({ type:'vyvre-scan-camera-refusee' }, location.origin);
    return;
  }
  const img = new Image(); img.src = '/_test_masque/' + (PHOTO || 'p_073') + '.jpg'; await img.decode(); src = img; miroir = false;
  dit($('note'), DEMO ? 'hcg.demo' : 'hcg.photo');
}
const SW = () => src.videoWidth || src.naturalWidth, SH = () => src.videoHeight || src.naturalHeight;
const PHOTO = Q.get('photo');   /* ?photo=p_073 : une photo traitee comme la camera (pour verifier le double) */
const demo = () => DEMO || (src !== vid && !PHOTO);

/* ---------------- lecture : visage + cheveux ---------------- */
const PW = 256; let PH = 192;
const petit = document.createElement('canvas'), pctx = petit.getContext('2d', { willReadFrequently:true });
const mH = document.createElement('canvas'), mHc = mH.getContext('2d');
let HAIR, idH, segH, face, dernierVisage = null, tour = 0, dern = 0, pitchRef = null, refN = 0;
async function ouvrirLecture(){
  const fs = await FilesetResolver.forVisionTasks("/cheveux/vendor/mediapipe/wasm");
  segH = await ImageSegmenter.createFromOptions(fs, { baseOptions:{ modelAssetPath:"/cheveux/vendor/mediapipe/modeles/hair_segmenter.tflite", delegate:'CPU' },
    runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false });
  const fo = d => ({ baseOptions:{ modelAssetPath:"/cheveux/vendor/mediapipe/modeles/face_landmarker.task", delegate:d },
    runningMode:'VIDEO', numFaces:1 });
  try { face = await FaceLandmarker.createFromOptions(fs, fo('GPU')); }
  catch(e){ try { face = await FaceLandmarker.createFromOptions(fs, fo('CPU')); } catch(e2){ console.warn('visage', e2); } }
  window.__lecture = { cheveux: !!segH, visage: !!face };
}
function tailles(){
  PH = Math.round(PW * SH() / SW());
  for(const c of [petit, mH]){ c.width = PW; c.height = PH; }
  idH = mHc.createImageData(PW, PH); HAIR = new Float32Array(PW*PH);
  for(let i=0;i<PW*PH;i++){ idH.data[i*4]=idH.data[i*4+1]=idH.data[i*4+2]=255; }
}
function lire(now){
  if(!segH || now - dern < 60) return; dern = now;
  pctx.save(); if(miroir){ pctx.translate(PW,0); pctx.scale(-1,1); } pctx.drawImage(src,0,0,PW,PH); pctx.restore();
  try{
    if(tour++ % 2 === 0){
      segH.segmentForVideo(petit, now, r => {
        const cm = r.confidenceMasks; if(!cm) return;
        const m = (cm[1] || cm[0]).getAsFloat32Array(); let n = 0;
        /* la barbe et la moustache ne sont pas la chevelure : tout ce qui est
           sous le nez, entre les deux joues, est retire */
        let bx0 = -1, bx1 = -1, by0 = PH;
        if(dernierVisage && !demo()){ const L = dernierVisage; const xa = L[234].x*PW, xb = L[454].x*PW;
          bx0 = Math.min(xa,xb) - 4; bx1 = Math.max(xa,xb) + 4; by0 = L[2].y*PH; }
        for(let i=0;i<PW*PH;i++){
          let v = m[i]; const x = i % PW, y = (i / PW) | 0;
          if(y > by0 && x > bx0 && x < bx1) v = 0;
          HAIR[i] = HAIR[i]*.3 + v*.7; idH.data[i*4+3] = sm((HAIR[i]-.45)/.35)*255; if(HAIR[i] > .5) n++;
        }
        mHc.putImageData(idH,0,0); vuCheveux = n / (PW*PH);
        mesurerChevelure();
        cm.forEach(x => x.close && x.close());
      });
    } else if(!demo() && face){
      const r = face.detectForVideo(petit, now);
      const L = r.faceLandmarks && r.faceLandmarks[0];
      if(L) dernierVisage = L;
      visage = !!L;
      jugerImage(now, L);
      if(L){
        /* le lacet : ou est le bout du nez entre les deux joues (image en miroir,
           donc « a gauche de l'ecran » = vers la gauche de la personne) */
        const nez = L[1], jg = L[234], jd = L[454], yeux = { y:(L[33].y + L[263].y)/2 }, men = L[152], front = L[10];
        const lx = Math.min(jg.x, jd.x), rx = Math.max(jg.x, jd.x);
        yawV = ((nez.x - lx) / (rx - lx || 1) - .5) * 2;          /* -1 .. 1 */
        const p = (nez.y - yeux.y) / (men.y - front.y || 1);      /* grandit quand on baisse la tete */
        if(refN < 20 && Math.abs(yawV) < .2){ pitchRef = pitchRef == null ? p : pitchRef*.9 + p*.1; refN++; }
        pitchV = pitchRef == null ? 0 : (p - pitchRef) / .1;
      }
    }
  }catch(e){}
}

/* la pose, telle qu'on la lit ; en demo, une tete fictive qui fait le tour */
function lirePose(now, dt){
  if(demo()){
    const t = (now / 1000) % 12;
    const cible = t < 2 ? 'face' : t < 4.5 ? 'gauche' : t < 7 ? 'droite' : t < 9.5 ? 'dessus' : 'face';
    const yc = cible === 'gauche' ? -.75 : cible === 'droite' ? .75 : 0, pc = cible === 'dessus' ? 1.4 : 0;
    yawV = lerp(yawV, yc, 1 - Math.exp(-dt*3)); pitchV = lerp(pitchV, pc, 1 - Math.exp(-dt*3)); visage = true;
    vuCheveux = Math.max(vuCheveux, .05);
  }
  if(visage && pitchV > .6) descenteVue = now;
  let p = 'face';
  /* le sommet : tete baissee avec le visage encore vu, ou visage perdu juste
     apres une descente (moins de 1,5 s) avec beaucoup de cheveux */
  if((visage && pitchV > 1.1) || (!visage && now - descenteVue < 1500 && vuCheveux > .15)) p = 'dessus';
  else if(!visage && !demo()) p = 'aucune';
  else if(yawV < -.42) p = 'gauche';
  else if(yawV > .42) p = 'droite';
  else if(Math.abs(yawV) > .2) p = 'entre';
  pose = p;
  if(demo() && ZONES.includes(p) && now - dernierePrise > 150 && IMAGES[p].length < N_IMAGES){
    IMAGES[p].push(null); dernierePrise = now; Z[p] = IMAGES[p].length / N_IMAGES; bloqueDepuis = now;
    if(!SILHOUETTE[p]) SILHOUETTE[p] = silhouette();
  }
}
/* ==========================================================================
   LE VRAI COMPTE. Chaque cote demande N_IMAGES images exploitables. Une image
   n'est gardee que si le visage est vu dans le bon angle, que des cheveux sont
   visibles (plus de 3 % de l'image), qu'elle est nette (variance du laplacien
   sur les cheveux, jugee par rapport a cette camera) et que la personne ne
   bouge pas. Le pourcentage affiche = images gardees / N_IMAGES.
   Pour chaque cote on garde la plus nette, en pleine definition et SANS miroir :
   c'est elle que le moteur lira (les memes poses que l'ancien parcours).
   ========================================================================== */
const N_IMAGES = 8, SEUIL_BOUGE = .03;
const IMAGES = { face:[], gauche:[], droite:[], dessus:[] };
const MEILLEURE = { face:null, gauche:null, droite:null, dessus:null };
/* LES SILHOUETTES (pour « les quatre plaques »). Le seul souvenir visible d'une
   pose retenue est son MASQUE DE CHEVEUX, deja teint en bleu : une forme, rien
   d'autre. Jamais l'image du visage — personne n'a envie de voir sa propre
   photo s'afficher dans un coin de l'ecran. */
const SILHOUETTE = { face:null, gauche:null, droite:null, dessus:null };
function silhouette(){
  if(!HAIR) return null;
  let x0 = PW, x1 = -1, y0 = PH, y1 = -1;
  for(let y=0;y<PH;y++){ const o = y*PW; for(let x=0;x<PW;x++) if(HAIR[o+x] > .55){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1 < 0 || x1-x0 < 8 || y1-y0 < 8) return null;
  const w = x1-x0+1, h = y1-y0+1, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const q = c.getContext('2d');
  q.drawImage(mH, x0, y0, w, h, 0, 0, w, h);      /* mH porte le masque en alpha */
  q.globalCompositeOperation = 'source-in'; q.fillStyle = '#7fd8ff'; q.fillRect(0,0,w,h);
  return c;
}
let descenteVue = -1e9, dernierePrise = 0, grisPrec = null, refus = '', refusDepuis = 0;
const NETS = [];
function seuilNet(){ if(NETS.length < 8) return .00024; const t = NETS.slice().sort((a,b) => a-b); return Math.max(.00024, t[Math.floor(t.length*.8)] * .6); }
function jugerImage(now, L){
  const d = pctx.getImageData(0, 0, PW, PH).data, n = PW*PH, g = new Float32Array(n);
  for(let i=0;i<n;i++) g[i] = (d[i*4]*.3 + d[i*4+1]*.59 + d[i*4+2]*.11) / 255;
  let bouge = 0; if(grisPrec){ for(let i=0;i<n;i+=3) bouge += Math.abs(g[i] - grisPrec[i]); bouge /= (n/3); }
  grisPrec = g;
  let s1 = 0, s2 = 0, k = 0; const peu = vuCheveux < .03;
  for(let y=1;y<PH-1;y+=2) for(let x=1;x<PW-1;x+=2){
    const i = y*PW + x; if(!peu && HAIR[i] < .5) continue;
    const l = 4*g[i] - g[i-1] - g[i+1] - g[i-PW] - g[i+PW]; s1 += l; s2 += l*l; k++;
  }
  const net = k ? s2/k - (s1/k)*(s1/k) : 0;
  NETS.push(net); if(NETS.length > 60) NETS.shift();
  const z = pose; let r = '';
  if(!ZONES.includes(z)) r = z === 'aucune' ? 'visage' : 'angle';
  else if(IMAGES[z].length >= N_IMAGES) r = '';
  else if(vuCheveux < .03) r = 'cheveux';
  else if(bouge > SEUIL_BOUGE) r = 'bouge';
  else if(net < seuilNet()) r = 'flou';
  if(r){ if(r !== refus){ refus = r; refusDepuis = now; } return; }
  refus = '';
  if(ZONES.includes(z) && IMAGES[z].length < N_IMAGES && now - dernierePrise > 120){
    IMAGES[z].push(net); dernierePrise = now; Z[z] = IMAGES[z].length / N_IMAGES; bloqueDepuis = now;
    if(!MEILLEURE[z] || net > MEILLEURE[z].net){
      MEILLEURE[z] = { net, image: prendreImage(), masque: prendreMasque(), faceBox: boiteVisage(L) };
      SILHOUETTE[z] = silhouette() || SILHOUETTE[z];
    }
  }
}
/* l'image pour le moteur : pleine definition (1100 px), non miroir */
function prendreImage(){
  const sc = Math.min(1, 1100 / SW()), c = document.createElement('canvas');
  c.width = Math.round(SW()*sc); c.height = Math.round(SH()*sc);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c;
}
/* LE MASQUE DE CHEVEUX QUI PART AVEC L'IMAGE.
   Le moteur du scan segmentait les cheveux lui-meme, par la couleur, en partant
   d'une bande au-dessus du front : quand le decor ressemblait aux cheveux, le
   decor entrait dans la mesure (audit du 23/09 : du feuillage lu comme une
   coloration vive, un fond magenta lu comme une chevelure coloree). Or ce
   guidage possede deja un masque juste, celui de hair_segmenter, et il le
   calcule a chaque image. On le lui donne donc, au lieu de le lui faire refaire
   moins bien.
   Format : PNG en niveaux de gris, 256 px de large, 0 = pas de cheveux,
   255 = cheveux certains. Le moteur le reechantillonne a sa propre resolution.
   Il est remis A L'ENDROIT : l'apercu camera est en miroir, l'image envoyee au
   moteur ne l'est pas, et un masque retourne lirait la chevelure du mauvais cote.
   HAIR est lisse dans le temps et calcule une image sur deux : le masque envoye
   peut donc avoir une image de retard sur la photo. A tete immobile — et on
   n'enregistre que quand elle l'est — cela ne se voit pas. */
const mEnvoi = document.createElement('canvas'), mEnvoiCtx = mEnvoi.getContext('2d');
function prendreMasque(){
  if(!HAIR) return null;
  mEnvoi.width = PW; mEnvoi.height = PH;
  const id = mEnvoiCtx.createImageData(PW, PH);
  for(let y=0;y<PH;y++) for(let x=0;x<PW;x++){
    const v = Math.round(clamp(HAIR[y*PW + (miroir ? PW-1-x : x)], 0, 1) * 255);
    const j = (y*PW + x)*4;
    id.data[j] = id.data[j+1] = id.data[j+2] = v; id.data[j+3] = 255;
  }
  mEnvoiCtx.putImageData(id, 0, 0);
  return { png: mEnvoi.toDataURL('image/png'), largeur: PW, hauteur: PH };
}
/* le cadre du visage, dans l'image non miroir */
function boiteVisage(L){

    racine.visible = false; tete.visible = true;
    tete.position.set(.25, 0, 0);
    tete.rotation.y += ((yawV * .95) - tete.rotation.y) * .15;
    tete.rotation.x += ((clamp(pitchV,0,1.4) * .55) - tete.rotation.x) * .15;
    couleursTete(t);
  }
  co.render();
}
/* ==========================================================================
   CE QUI EST COMMUN AUX MISES EN SCENE 2 a 5
   La personne reste en couleur naturelle. On ne pose un voile sombre QUE la ou
   du texte doit rester lisible.
   ========================================================================== */
const NATUREL = 'saturate(1.02) brightness(.88) contrast(1.03)';
const ETIQ = { face:'DEVANT', gauche:'GAUCHE', droite:'DROITE', dessus:'SOMMET' };
const CYAN = '#7fd8ff';
function voileBas(part, largeur){
  const y = H*(1-part), g = ctx.createLinearGradient(0, y, 0, H);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.55,'rgba(0,0,0,.52)'); g.addColorStop(1,'rgba(0,0,0,.88)');
  ctx.fillStyle = g; ctx.fillRect(0, y, largeur || W, H - y);
}
function halo(cx, cy, R, force){
  const g = ctx.createRadialGradient(cx, cy, R*.2, cx, cy, R);
  g.addColorStop(0, 'rgba(0,0,0,' + (force || .62) + ')'); g.addColorStop(.6, 'rgba(0,0,0,' + (force || .62)*.55 + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
}
function voileHaut(part){
  const g = ctx.createLinearGradient(0, 0, 0, H*part);
  g.addColorStop(0,'rgba(0,0,0,.66)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H*part);
}
/* le souffle bleu sur les cheveux du cote qu'on est en train de lire : c'est la
   seule chose qui bouge sur la personne, et elle dit « je lis ceci maintenant » */
function souffle(t, r, force){
  if(!ZONES.includes(pose) || Z[pose] >= 1) return;
  ctx.save(); ctx.globalAlpha = (force || .2) + .07*Math.sin(t/240);
  cheveux(r, BLEU(1), 'screen'); ctx.restore();
}
/* la boite du visage a l'ecran, lissee. Les points du visage sont lus dans le
   petit cadre, qui est deja en miroir comme l'apercu : les memes coordonnees
   servent donc directement a l'ecran. */
const BX = { x:0, y:0, w:0, h:0, a:0 };
/* faute de visage (la demo ne fait pas tourner le detecteur de points), on se
   rabat sur l'etendue du masque de cheveux : la tete y est, et l'anneau reste
   pose au bon endroit. Recalcule trois fois par seconde, pas a chaque image. */
let boiteCh = null, boiteChQuand = 0;
function boiteCheveux(r, now){
  if(!HAIR) return null;
  if(now - boiteChQuand > 300){
    boiteChQuand = now;
    let x0 = PW, x1 = -1, y0 = PH, y1 = -1;
    for(let y=0;y<PH;y++){ const o = y*PW; for(let x=0;x<PW;x++) if(HAIR[o+x] > .5){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
    boiteCh = x1 < 0 ? null : { x:x0/PW, y:y0/PH, w:(x1-x0+1)/PW, h:(y1-y0+1)/PH };
  }
  if(!boiteCh) return null;
  const b = boiteCh;
  return { x:r.x + b.x*r.w, y:r.y + b.y*r.h, w:b.w*r.w, h:b.h*r.h };
}
function boiteLisse(r, now){
  const L = dernierVisage; let c = null, pres = false;
  if(demo()){
    c = boiteCheveux(r, now); pres = !!c;
  } else if(L){
    let x0=1, x1=0, y0=1, y1=0;
    for(const q of L){ if(q.x<x0)x0=q.x; if(q.x>x1)x1=q.x; if(q.y<y0)y0=q.y; if(q.y>y1)y1=q.y; }
    c = { x:r.x + x0*r.w, y:r.y + y0*r.h, w:(x1-x0)*r.w, h:(y1-y0)*r.h }; pres = visage;
  }
  if(c){ const k = BX.a > .02 ? .2 : 1;
    BX.x = lerp(BX.x,c.x,k); BX.y = lerp(BX.y,c.y,k); BX.w = lerp(BX.w,c.w,k); BX.h = lerp(BX.h,c.h,k); }
  BX.a = pres ? Math.min(1, BX.a + .08) : Math.max(0, BX.a - .04);
  return BX.a > .02 ? BX : null;
}

/* ==========================================================================
   2 · LE MIROIR — pas de double du tout.
   Le guidage se lit sur la personne elle-meme : ses cheveux passent du gris au
   bleu a mesure que les cotes sont lus. En bas, quatre pastilles discretes
   disent ce qui reste.
   ========================================================================== */
function pastilles(t){
  const R = clamp(Math.min(W,H)*.011, 8, 13), ecart = clamp(W*.052, 62, 112);
  const cy = H - Math.max(40, H*.062), x0 = W/2 - ecart*1.5;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ZONES.forEach(function(z, i){
    const cx = x0 + i*ecart, v = sm(Z[z]), actif = pose === z && Z[z] < 1;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
    ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(234,246,255,' + (actif ? .55 : .2) + ')'; ctx.stroke();
    if(actif){ ctx.beginPath(); ctx.arc(cx, cy, R + 4 + 2*Math.sin(t/260), 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(127,216,255,' + (.16 + .1*Math.sin(t/260)) + ')'; ctx.stroke(); }
    if(v > .002){
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R - 1.6, -Math.PI/2, -Math.PI/2 + Math.PI*2*v); ctx.closePath();
      ctx.fillStyle = v >= 1 ? CYAN : 'rgba(127,216,255,.78)';
      ctx.shadowColor = 'rgba(127,216,255,.8)'; ctx.shadowBlur = v >= 1 ? 12 : 0; ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.font = "300 9px 'IBM Plex Mono',monospace";
    ctx.fillStyle = v >= 1 ? 'rgba(127,216,255,.72)' : 'rgba(234,246,255,' + (actif ? .8 : .4) + ')';
    ctx.fillText(ETIQ[z], cx, cy + R + 15);
  });
  ctx.restore();
}
function dessin2(t, r){
  gl.style.display = 'none';
  peindre(ctx, r, NATUREL);
  voileHaut(.16); voileBas(.42);
  /* du gris au bleu : 'color' garde la lumiere des cheveux et n'en change que
     la teinte. Un gris pur les desature ; le bleu arrive avec l'avancement. */
  const q = sm(total());
  const c = 'rgba(' + Math.round(lerp(158,64,q)) + ',' + Math.round(lerp(166,170,q)) + ',' + Math.round(lerp(178,255,q)) + ',.95)';
  cheveux(r, c, 'color');
  if(q > .02){ ctx.save(); ctx.globalAlpha = .26*q; cheveux(r, BLEU(1), 'screen'); ctx.restore(); }
  souffle(t, r, .14);
  pastilles(t);
}

/* ==========================================================================
   3 · L'ANNEAU DE LUMIERE — un arc pose autour de la tete reelle.
   Il suit le visage et sa taille, et se remplit comme un cadran : un quartier
   par angle. Rien d'autre a l'ecran.
   ========================================================================== */
const ANGLE = { droite:0, face:Math.PI/2, gauche:Math.PI, dessus:-Math.PI/2 };
function dessin3(t, r){
  gl.style.display = 'none';
  peindre(ctx, r, NATUREL);
  voileHaut(.16); voileBas(.16);
  const b = boiteLisse(r, t); if(!b) return;
  /* l'anneau entoure la tete sans jamais sortir de l'ecran : il suit la
     largeur du visage, et se borne a un peu moins d'une demi-hauteur d'ecran */
  const m = Math.min(W, H);
  const R = clamp(Math.max(b.w*.98, b.h*.70), m*.13, m*.43);
  const cx = clamp(b.x + b.w/2, R*.35, W - R*.35), cy = clamp(b.y + b.h*.46, R*.30, H - R*.30);
  const ouv = Math.PI/2 - .17;
  ctx.save(); ctx.lineCap = 'round';
  for(const z of ZONES){
    const a0 = ANGLE[z] - ouv/2, v = sm(Z[z]), actif = pose === z && Z[z] < 1;
    ctx.globalAlpha = BX.a;
    ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + ouv);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(234,246,255,' + (actif ? .34 + .18*Math.sin(t/240) : .19) + ')';
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 6; ctx.stroke(); ctx.shadowBlur = 0;
    if(v > .002){
      ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + ouv*v);
      ctx.lineWidth = 6; ctx.strokeStyle = CYAN;
      ctx.shadowColor = 'rgba(127,216,255,.9)'; ctx.shadowBlur = 16; ctx.stroke(); ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

/* ==========================================================================
   4 · LA CARTE DU CRANE — une tete vue de dessus, en haut a droite.
   Un disque en quatre quartiers (devant, cote gauche, cote droit, sommet) qui
   se remplissent de bleu, du centre vers le bord. Discret, precis.
   ========================================================================== */
let hautChoix = 66;
function mesurerChoix(){ const e = $('choix'); if(e) hautChoix = e.getBoundingClientRect().bottom; }
addEventListener('resize', mesurerChoix);
function carte(t){
  const R = clamp(Math.min(W,H)*.072, 38, 58);
  const cx = W - Math.max(26, W*.04) - R, cy = hautChoix + 30 + R;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  halo(cx, cy + R*.35, R*3, .66);
  /* le disque, et le nez : la carte regarde vers le bas de l'ecran, comme la
     personne regarde la camera */
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fill();
  for(const z of ZONES){
    const a0 = ANGLE[z] - Math.PI/4 + .022, a1 = ANGLE[z] + Math.PI/4 - .022, v = sm(Z[z]), actif = pose === z && Z[z] < 1;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
    ctx.fillStyle = 'rgba(234,246,255,' + (actif ? .13 : .055) + ')'; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(234,246,255,' + (actif ? .4 : .16) + ')'; ctx.stroke();
    if(v > .002){
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R*v, a0, a1); ctx.closePath();
      ctx.fillStyle = v >= 1 ? 'rgba(127,216,255,.8)' : 'rgba(127,216,255,.54)';
      ctx.shadowColor = 'rgba(127,216,255,.7)'; ctx.shadowBlur = v >= 1 ? 12 : 0; ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.font = "300 8px 'IBM Plex Mono',monospace";
    ctx.fillStyle = v > .5 ? 'rgba(3,12,20,.88)' : 'rgba(234,246,255,' + (actif ? .8 : .42) + ')';
    ctx.fillText(ETIQ[z], cx + Math.cos(ANGLE[z])*R*.62, cy + Math.sin(ANGLE[z])*R*.62);
  }
  ctx.font = "300 10px 'IBM Plex Mono',monospace"; ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(127,216,255,.85)';
  ctx.fillText(Math.round(total()*100) + ' %', cx + R, cy + R + 18);
  ctx.fillStyle = 'rgba(234,246,255,.38)'; ctx.font = "300 8px 'IBM Plex Mono',monospace";
  ctx.fillText('DE LA CHEVELURE LUE', cx + R, cy + R + 33);
  ctx.restore();
}
function dessin4(t, r){
  gl.style.display = 'none';
  peindre(ctx, r, NATUREL);
  voileHaut(.20); voileBas(.38);
  souffle(t, r, .16);
  carte(t);
}

/* ==========================================================================
   5 · LES QUATRE PLAQUES — quatre cadres etroits en bas, un par cote.
   Un cote lu remplit son cadre d'une silhouette bleue : le masque des cheveux
   de la pose retenue. Jamais la photo du visage.
   ========================================================================== */
function plaques(t){
  const pw = clamp(W*.062, 58, 94), ph = pw*1.42, ec = Math.max(10, W*.012);
  const lg = 4*pw + 3*ec, x0 = W/2 - lg/2, y0 = H - Math.max(26, H*.042) - ph;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ZONES.forEach(function(z, i){
    const x = x0 + i*(pw + ec), v = sm(Z[z]), actif = pose === z && Z[z] < 1;
    ctx.fillStyle = 'rgba(0,0,0,.46)'; ctx.fillRect(x, y0, pw, ph);
    const sil = SILHOUETTE[z];
    if(sil){
      const pad = 8, aw = pw - pad*2, ah = ph - pad*2 - 18;
      const k = Math.min(aw/sil.width, ah/sil.height), dw = sil.width*k, dh = sil.height*k;
      ctx.save(); ctx.beginPath(); ctx.rect(x + 1, y0 + 1, pw - 2, ph - 2); ctx.clip();
      ctx.globalAlpha = .3 + .7*v;
      ctx.shadowColor = 'rgba(127,216,255,.55)'; ctx.shadowBlur = 14;
      ctx.drawImage(sil, x + (pw - dw)/2, y0 + 17 + (ah - dh)/2, dw, dh);
      ctx.restore();
    }
    ctx.lineWidth = 1; ctx.strokeStyle = actif ? 'rgba(127,216,255,' + (.5 + .3*Math.sin(t/260)) + ')'
      : (v >= 1 ? 'rgba(127,216,255,.42)' : 'rgba(234,246,255,.2)');
    ctx.strokeRect(x + .5, y0 + .5, pw - 1, ph - 1);
    ctx.font = "300 8px 'IBM Plex Mono',monospace";
    ctx.fillStyle = v >= 1 ? 'rgba(127,216,255,.85)' : 'rgba(234,246,255,' + (actif ? .82 : .42) + ')';
    ctx.fillText(ETIQ[z], x + pw/2, y0 + 11);
    if(v > 0 && v < 1){ ctx.fillStyle = 'rgba(127,216,255,.75)'; ctx.fillRect(x + 1, y0 + ph - 3, (pw - 2)*v, 2); }
  });
  ctx.restore();
}
function dessin5(t, r){
  gl.style.display = 'none';
  peindre(ctx, r, NATUREL);
  voileHaut(.16); voileBas(.46);
  souffle(t, r, .16);
  plaques(t);
}

/* ==========================================================================
   CHANGER DE MISE EN SCENE.
   Le piege deja rencontre : remettre le pourcentage a zero sans vider les
   images gardees. IMAGES[z] restait a 8, jugerImage refusait toute nouvelle
   image, et le cote ne pouvait plus JAMAIS se remplir. On remet donc tout le
   comptage a zero d'un bloc — pourcentages, images, meilleures poses,
   silhouettes — et l'on repart proprement.
   ========================================================================== */
function choisir(p, pousser){
  PROP = clamp(p, 1, 5);
  document.body.className = 'p' + PROP;      /* enleve aussi 'fini' */
  for(const z of ZONES){ Z[z] = 0; IMAGES[z].length = 0; MEILLEURE[z] = null; SILHOUETTE[z] = null; }
  finiDepuis = 0; rendu = false; refus = ''; refusDepuis = 0;
  descenteVue = -1e9; dernierePrise = 0; BX.a = 0;
  bloqueDepuis = performance.now(); debutSansVisage = 0;
  $('pct').textContent = '0 %';
  const b = $('choix');
  if(b) for(const x of b.children) x.classList.toggle('on', +x.dataset.p === PROP);
  mesurerChoix();
  if(pousser){ const u = new URL(location.href); u.searchParams.set('p', PROP); history.replaceState(null, '', u); }
}
$('choix').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(b) choisir(+b.dataset.p, true);
});
addEventListener('keydown', function(e){
  if(e.key >= '1' && e.key <= '5') choisir(+e.key, true);
});

let debutSansVisage = 0;
function image(now){
  requestAnimationFrame(image);
  if(!src || !HAIR) return;
  /* 23/09 — si le visage n'est JAMAIS vu (contre-jour, camera trop sombre), on
     restait a 0 % sans issue. Au bout de 20 s sans une seule image gardee, on
     rend la main au parcours, qui proposera l'ancien enchainement. */
  if(!demo()){
    if(!debutSansVisage) debutSansVisage = now;
    const rienDuTout = ZONES.every(z => IMAGES[z].length === 0);
    if(rienDuTout && now - debutSansVisage > 20000){
      debutSansVisage = now + 1e9;
      if(parent !== window) parent.postMessage({ type:'vyvre-scan-sans-visage' }, location.origin);
    }
    if(!rienDuTout) debutSansVisage = now + 1e9;
  }
  const dt = Math.min(.1, (now - tPrec)/1000); tPrec = now;
  lire(now); lirePose(now, dt);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#000'; ctx.fillRect(0,0,cv.width,cv.height); ctx.restore();
  const r = cadre();
  if(PROP === 1) dessin1(now, r); else if(PROP === 2) dessin2(now, r); else if(PROP === 3) dessin3(now, r); else if(PROP === 4) dessin4(now, r); else dessin5(now, r);
  const tt = total();
  /* « Lu. » ne doit pas etre reecrit par le pourcentage ; il est repeint a
     chaque image pour suivre un changement de langue arrive apres coup. */
  if(!finiDepuis) $('pct').textContent = Math.round(tt*100) + ' %';
  else $('pct').textContent = T('hcg.lu') ?? 'Lu.';
  /* secours : bloque 5 s, on nomme ce qui manque (et seulement a ce moment-la) */
  const m = manquante();
  const RAISONS = { visage:'Votre visage n’est pas visible.', angle:'Tenez la tête un instant.', cheveux:'On ne voit pas assez vos cheveux.', bouge:'Ne bougez plus.', flou:'L’image est floue : un peu plus de lumière.' };
  const CLEF_RAISON = { visage:'hcg.r.visage', angle:'hcg.r.angle', cheveux:'hcg.r.cheveux', bouge:'hcg.r.bouge', flou:'hcg.r.flou' };
  /* 23/09 — Charles n'etait pas assiste pendant son essai : on dit tot, en une
     phrase, LE GESTE qui manque ; la raison technique ne vient qu'apres. */
  const GESTES = { face:'Revenez bien de face.', gauche:'Tournez un peu plus à gauche.',
                   droite:'Tournez un peu plus à droite.', dessus:'Baissez la tête pour montrer le dessus.' };
  const CLEF_GESTE = { face:'hcg.g.face', gauche:'hcg.g.gauche', droite:'hcg.g.droite', dessus:'hcg.g.dessus' };
  const aide = m && now - bloqueDepuis > 1200;
  $('aide').classList.toggle('on', !!aide);
  if(aide){
    const dit_raison = refus && now - refusDepuis > 2200 && RAISONS[refus];
    $('aide').textContent = dit_raison
      ? (T(CLEF_RAISON[refus]) ?? RAISONS[refus])
      : (T(CLEF_GESTE[m]) ?? GESTES[m] ?? (T('hcg.manque', { z: nomCote(m) }) ?? ('Il manque ' + NOMS[m] + '.')));
  }
  if(tt >= 1){
    if(!finiDepuis){ finiDepuis = now; document.body.classList.add('fini'); $('pct').textContent = T('hcg.lu') ?? 'Lu.'; }
    else if(now - finiDepuis > 300) rendre();
  }
  if(DEBUG) $('lectureDebug').textContent = 'lacet ' + yawV.toFixed(2) + '\ntangage ' + pitchV.toFixed(2) + '\nvisage ' + visage + '\ncheveux ' + (vuCheveux*100).toFixed(1) + ' %\npose ' + pose;
}

(async function(){
  taille(); tailleGL();
  choisir(PROP);            /* le selecteur est juste des le depart, meme si la camera est refusee */
  await ouvrirSource();
  if(!src) return;        /* camera refusee : le parcours a deja repris la main */
  tailles();
  await ouvrirLecture();
  choisir(PROP); bloqueDepuis = performance.now();
  requestAnimationFrame(image);
})();
</script>
</body>
</html>
