<style>

</style></head><body>
<header><b>VYVRE</b><span>Intro logo · 3 secondes à l'arrivée sur le site</span></header>
<div class="intro"><div class="k">Propales</div><h1>Six intros,<br><em>trois secondes chacune.</em></h1>
<p>Clique une scène pour la rejouer, ou « plein écran » pour la voir comme à l'arrivée sur vyvre.fr. Donne-moi un numéro.</p></div>
<div class="grille" id="g"></div>
<div id="plein"><canvas></canvas><button class="fermer" type="button">Fermer</button></div>
<script>
const P=[
 ["01","Poussière de lumière","Un nuage de lumière en profondeur se resserre, point par point, jusqu'au nom.","poussiere"],
 ["02","La lecture","Une ligne de scan descend, allume une trame de mesure et grave le nom au passage.","lecture"],
 ["03","Le visage devient le nom","Les 68 repères d'un visage tournent dans l'espace, puis s'envolent pour écrire le logo.","visage"],
 ["04","Lumière rasante","Un faisceau passe au ras des lettres gravées et soulève la poussière dans sa lumière.","rasante"],
 ["05","Iris","Un diaphragme d'objectif s'ouvre sur un tunnel de lumière qui se fige en logo.","iris"],
 ["06","Verre liquide","Des gouttes fusionnent, s'étirent en barre de verre, et le nom s'y dépose.","verre"]];
const SC={poussiere:0,lecture:1,visage:2,rasante:3,iris:4,verre:5};
const g=document.getElementById('g');
P.forEach(([n,t,d,k])=>{const el=document.createElement('div');el.className='item';
 el.innerHTML='<div class="scene"><canvas data-a="'+k+'"></canvas></div><div class="leg"><div><h2>'+t+'</h2><p>'+d+'</p></div><div style="text-align:right"><div class="num">'+n+'</div><a href="#" data-p="'+k+'">Plein écran</a></div></div>';
 g.appendChild(el);});

const DUR=3.2,HOLD=1.5;
const Q=new URLSearchParams(location.search);
const FIGE=Q.has('t')?parseFloat(Q.get('t')):null;
const MOBILE=matchMedia('(pointer:coarse)').matches||innerWidth<700;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(p,a,b)=>cl((p-a)/(b-a),0,1);
const eo=t=>1-Math.pow(1-t,3),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- typographie ---------- */
const mesure=document.createElement('canvas').getContext('2d');
function mise(W,H){const fs=Math.min(W*.16,H*.28),sp=fs*.32;mesure.font='200 '+fs+'px Inter';
 const ws=[...'VYVRE'].map(c=>mesure.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0)+sp*4;
 let x=W/2-tot/2;const xs=ws.map(w=>{const r=x;x+=w+sp;return r;});return{fs,xs,tot};}
function ecrire(c,W,H,s,style,sub){const L=mise(W,H);
 c.fillStyle=style;c.font='200 '+(L.fs*s)+'px Inter';c.textBaseline='alphabetic';c.textAlign='left';
 [...'VYVRE'].forEach((ch,i)=>c.fillText(ch,L.xs[i]*s,(H/2+L.fs*.3635)*s));
 if(sub){const t='DIAGNOSTIC DE PEAU MESURÉ',f=Math.max(8,L.fs*.085),e=L.fs*.05;
  c.fillStyle=sub;c.font='400 '+(f*s)+'px "JetBrains Mono",monospace';c.textBaseline='middle';
  const w=[...t].map(ch=>c.measureText(ch).width/s),tw=w.reduce((a,b)=>a+b,0)+e*(t.length-1);
  let x=W/2-tw/2;[...t].forEach((ch,i)=>{c.fillText(ch,x*s,(H/2+L.fs*1.05)*s);x+=w[i]+e;});}
 return L;}

/* ---------- repères du visage (68) ---------- */
function visage(){const F=[];
 const z=(x,y)=>.5*Math.sqrt(Math.max(0,1-(x/1.)**2-((y+.2)/1.25)**2))+.26*Math.exp(-(x*x/.012+(y+.08)**2/.09))-.07*Math.exp(-((Math.abs(x)-.42)**2+(y-.2)**2)/.012);
 for(let i=0;i<17;i++){const a=i/16*Math.PI;F.push([-Math.cos(a)*.92,.18-Math.sin(a)*1.05*(.72+.28*Math.sin(a))]);}
 for(let i=0;i<5;i++)F.push([-.78+i*.15,.40+.1*Math.sin(i/4*Math.PI*.9+.2)]);
 for(let i=0;i<5;i++)F.push([.18+i*.15,.40+.1*Math.sin((4-i)/4*Math.PI*.9+.2)]);
 for(let i=0;i<4;i++)F.push([0,.26-i*.15]);
 [[-.18,-.28],[-.09,-.31],[0,-.33],[.09,-.31],[.18,-.28]].forEach(p=>F.push(p));
 [[-.62,.19],[-.5,.26],[-.35,.26],[-.22,.19],[-.35,.14],[-.5,.14],[.22,.19],[.35,.26],[.5,.26],[.62,.19],[.5,.14],[.35,.14]].forEach(p=>F.push(p));
 [[-.32,-.55],[-.2,-.48],[-.08,-.45],[0,-.47],[.08,-.45],[.2,-.48],[.32,-.55],[.2,-.64],[.09,-.68],[0,-.69],[-.09,-.68],[-.2,-.64]].forEach(p=>F.push(p));
 [[-.27,-.55],[-.1,-.53],[0,-.535],[.1,-.53],[.27,-.55],[.1,-.58],[0,-.585],[-.1,-.58]].forEach(p=>F.push(p));
 const P3=F.map(([x,y])=>[x,y,z(x,y)+(Math.abs(x)>.8?-.15:0)]);
 const S=[];const ch=(a,b,loop)=>{for(let i=a;i<b;i++)S.push([i,i+1]);if(loop)S.push([b,a]);};
 ch(0,16);ch(17,21);ch(22,26);ch(27,30);S.push([30,33]);ch(31,35);ch(36,41,1);ch(42,47,1);ch(48,59,1);ch(60,67,1);
 return{P3,S,z};}
const VIS=visage();

/* ---------- shaders ---------- */
const VQ=`#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}`;
const VP=`#version 300 es
precision highp float;
layout(location=0) in vec2 a_tgt;layout(location=1) in vec3 a_src;
uniform float u_t,u_asp,u_px,u_lw,u_ng,u_nc,u_nr,u_lx,u_pmax,u_ti,u_lk,u_cy,u_cx,u_cz;uniform vec2 u_lp;uniform int u_sc;
out vec3 v_col;out float v_a;out float v_bok;
const float PI=3.14159265,TAU=6.2831853,D=3.2;
uint pcg(uint v){uint s=v*747796405u+2891336453u;uint w=((s>>((s>>28u)+4u))^s)*277803737u;return (w>>22u)^w;}
float rn(uint i,uint k){return float(pcg(pcg(i*16u+k)))/4294967295.;}
float eio(float x){return x<.5?4.*x*x*x:1.-pow(-2.*x+2.,3.)/2.;}
float eo(float x){return 1.-pow(1.-x,3.);}
float eo5(float x){return 1.-pow(1.-x,5.);}
float sat(float x){return clamp(x,0.,1.);}
vec3 roty(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);}
vec3 rotx(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z);}
void cull(){gl_Position=vec4(2.,2.,2.,1.);gl_PointSize=1.;v_a=0.;v_col=vec3(0);v_bok=0.;}
void emit(vec3 p,float size,float b,vec3 col,float focus){
 p=rotx(roty(p,u_cy),u_cx);p.z+=u_cz;focus+=u_cz;
 float tt=u_t-u_ti;
 if(tt>0.){float R=tt*2.3,l=length(p.xy);p.xy+=p.xy/max(l,.01)*.025*exp(-pow(l-R,2.)*30.)*exp(-tt*2.);}
 float w=D-p.z;if(w<.15||b<.003){cull();return;}
 float ps=D/w;
 vec2 sp=p.xy*ps;b*=mix(1.,.4+1.5*exp(-dot(sp-u_lp,sp-u_lp)*1.1),u_lk);
 gl_Position=vec4(p.x*ps/u_asp,p.y*ps,0.,1.);
 float sz=max(size*u_px*ps,1.3);
 float coc=abs(p.z-focus)*ps*u_px*6.;
 float S=min(sz+coc,min(u_px*26.+2.,u_pmax));
 gl_PointSize=S;
 float en=(sz*sz)/(S*S);

void main(){
 uint id=uint(gl_VertexID);float fid=float(gl_VertexID);
 float r1=rn(id,1u),r2=rn(id,2u),r3=rn(id,3u),r4=rn(id,4u),r5=rn(id,5u);
 float t=u_t;vec3 T=vec3(a_tgt,0.);
 vec3 col=r5>.94?vec3(.72,.88,1.):(r5>.8?vec3(1.,.9,.78):vec3(.9,.94,1.));
 float lxn=a_tgt.x/max(u_lw,.01)*.5+.5;
 if(u_sc==0){
  vec3 s;
  if(rn(id,9u)<.3){s=vec3((r1-.5)*2.8*u_asp,(r2-.5)*3.,-2.8+r3*4.);s=roty(s,t*.1);}
  else{float rad=.08+pow(r1,.8)*2.3,arm=floor(rn(id,7u)*2.);
   float an=(r2-.5)*.9+arm*PI+log(rad)*2.3+t*(.5/(rad+.35));
   float sc=.12+.25*rad;
   s=vec3(cos(an)*rad+(r3-.5)*sc,(r4-.5)*.18*sc,sin(an)*rad+(rn(id,8u)-.5)*sc);
   s=rotx(s,1.2);}
  s+=.05*vec3(sin(t*.8+r2*50.),cos(t*.7+r1*50.),sin(t*.6+r4*50.));
  bool amb=rn(id,6u)>.9;
  float d=.28+lxn*.5+r4*.35;
  float k=amb?0.:sat((t-d)/.95),e=eio(k);
  vec3 dir=T-s;
  vec3 p=mix(s,T,e)+vec3(-dir.y,dir.x,0.)*sin(e*PI)*(r1-.5)*.35+vec3(0.,0.,sin(e*PI)*.6);
  float cm=eo5(sat(t/2.15));
  p=roty(p,.5*(1.-cm));p.z-=1.2*(1.-cm);
  float b=sat(t*2.)*(amb?.6:.75);
  if(!amb){b+=k>=1.?1.5*exp(-(t-d-.95)*5.):0.;b*=mix(1.,.25,smoothstep(2.15,2.6,t));}
  else b*=1.-.5*smoothstep(2.,3.,t);
  emit(p,amb?2.4:1.8,b,col,-1.2*(1.-cm));
 }else if(u_sc==1){
  if(fid<u_ng){
   float cx=mod(fid,u_nc),cy=floor(fid/u_nc);
   vec3 p=vec3((-1.+(cx+.5)/u_nc*2.)*u_asp,1.-(cy+.5)/u_nr*2.,0.);
   float ta=.15+(1.12-p.y)/2.24*1.9,l=t-ta;
   float b=l<0.?0.:(.13+1.4*exp(-l*5.));b*=1.-smoothstep(2.,2.7,t);
   float lat=smoothstep(u_asp*1.05,u_asp*.3,abs(p.x));
   emit(p,1.9,b*lat,vec3(.6,.85,.95),0.);
  }else{
   float ta=.15+(1.12-T.y)/2.24*1.9,l=t-ta;
   if(l<0.){cull();return;}
   float e=1.-exp(-l*9.);
   vec3 p=T+vec3((r1-.5)*.3,r2*.02,(r3-.5)*.9)*(1.-e)+vec3(0.,0.,(rn(id,11u)-.5)*.16*(1.-smoothstep(1.8,2.1,t)));
   float b=.5+2.*exp(-l*8.);b*=mix(1.,.3,smoothstep(2.1,2.8,t));
   emit(p,1.8,b,col,0.);
  }
 }else if(u_sc==2){
  bool lm=fid<68.,ln=fid<u_ng;
  float yaw=-.6+.72*eio(sat(t/2.2));
  vec3 s=rotx(roty(a_src,yaw),.12);
  float ap=lm?.05+fid/68.*.5:.05+(.5-a_src.y)*.55+r1*.15;
  float on=smoothstep(0.,.3,t-ap);
  float d=1.05+r4*.3+lxn*.15,k=sat((t-d)/.75),e=eio(k);
  vec3 dir=T-s;
  vec3 p=mix(s,T,e)+vec3(0.,0.,sin(e*PI)*(.3+r2*.9))+vec3(-dir.y,dir.x,0.)*sin(e*PI)*(r5-.5)*.4;
  float cm=eo5(sat(t/2.3));p.z-=.6*(1.-cm);
  float b=on*(lm?2.2:(ln?.55:.3));
  b=mix(b,.85,e);
  b+=k>=1.?1.8*exp(-(t-d-.75)*6.):0.;
  b*=mix(1.,.28,smoothstep(2.3,2.75,t));
  float sz=lm?mix(6.,2.,e):(ln?1.6:1.4);
  vec3 c=lm?vec3(.8,.93,1.):(ln?col:vec3(.62,.8,.95));
  emit(p,sz,b,c,-.6*(1.-cm));
 }else if(u_sc==3){
  vec3 p=vec3((r1-.5)*2.5*u_asp,(r2-.5)*2.3,-2.2+r3*3.5);
  p.y+=t*.05*(r4-.3);p.x+=.03*sin(t*.9+r4*40.);
  float bx=p.x*(D/(D-p.z));
  float beam=exp(-pow((bx-u_lx)*2.4,2.));
  float b=beam*1.2*sat(t*3.)*(1.-.85*smoothstep(2.3,3.,t))*(.25+.75*r5);
  emit(p,1.4,b,vec3(1.,.93,.84),0.);
 }else if(u_sc==4){
  float d=1.0+r4*.3+lxn*.15,k=sat((t-d)/.8),e=eio(k);
  float tf=min(t,d);
  float ring=floor(r3*18.);
  float z=-6.+mod(ring*.5+tf*2.6,9.);
  float ang=r1*TAU+ring*.35+tf*.5;
  float rad=r2<.8?1.+(r4-.5)*.05:.35+r2*2.;
  vec3 s=vec3(cos(ang)*rad*1.05,sin(ang)*rad*.72,z);
  vec3 p=mix(s,T,e);{float sa=sin(e*PI)*1.6*(1.-e),c=cos(sa),si=sin(sa);p.xy=mat2(c,si,-si,c)*p.xy*(1.+sin(e*PI)*.35);}
  float b=1.3*smoothstep(.3,.8,t)*smoothstep(-6.,-1.5,z)+(k>=1.?1.6*exp(-(t-d-.8)*5.):0.);
  b*=mix(1.,.28,smoothstep(2.3,2.75,t));
  emit(p,1.8,b,col,0.);
 }else{
  if(fid<u_ng){
   vec3 p=vec3((r1-.5)*2.5*u_asp+.08*t*(r4-.5),(r2-.5)*2.3,-2.7+r3*1.5);
   float b=(.2+.45*r4)*sat(t*2.)*(1.-.3*smoothstep(2.2,3.,t));
   emit(p,3.,b,col,0.);
  }else{
   float d=.9+abs(a_tgt.x)/max(u_lw,.01)*.5+r4*.2,k=sat((t-d)/.6),e=eo(k);
   vec3 s=vec3((r1-.5)*.2,(r2-.5)*.2,0.);
   vec3 p=mix(s,T,e);p.y+=sin(e*PI)*(r5-.5)*.15;
   float b=(t>d?1.:0.)*(.55+1.8*exp(-max(t-d-.6,0.)*5.)*step(1.,k));
   b*=mix(1.,.25,smoothstep(2.2,2.9,t));
   emit(p,1.6,b,vec3(.92,.96,1.),0.);
  }
 }
}`;
const FP=`#version 300 es
precision highp float;in vec3 v_col;in float v_a;in float v_bok;out vec4 o;
void main(){vec2 c=gl_PointCoord*2.-1.;float r=dot(c,c);if(r>1.)discard;
 float g=exp(-r*3.2);float disc=smoothstep(1.,.72,r)*(.7+.3*r);
 o=vec4(v_col*v_a*mix(g,disc,v_bok),1.);}`;
const FXH=`#version 300 es
precision highp float;
uniform sampler2D u_p,u_logo;uniform vec2 u_res;uniform float u_t,u_asp,u_lw,u_fs,u_lx,u_L,u_h,u_lod;out vec4 o;
const float PI=3.14159265,TAU=6.2831853;
float hs(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+1.),f.x),f.y);}
float eio(float x){return x<.5?4.*x*x*x:1.-pow(-2.*x+2.,3.)/2.;}
vec2 Qp(){return (gl_FragCoord.xy-.5*u_res)/(.5*u_res.y);}
float Lg(vec2 uv,float l){return textureLod(u_logo,uv,max(l+u_lod,0.)).r;}
`;
const FX={};
FX[0]=FXH+`void main(){vec2 uv=gl_FragCoord.xy/u_res,q=Qp();
 vec3 c=texture(u_p,uv).rgb;
 c+=vec3(.010,.013,.02)*exp(-dot(q,q)*.7)*smoothstep(0.,.8,u_t);
 float gl=smoothstep(1.9,2.6,u_t)*(1.-.5*smoothstep(2.8,3.2,u_t));
 c+=vec3(.75,.88,1.)*(Lg(uv,4.)*.5+Lg(uv,6.)*.6)*gl*.35;
 o=vec4(clamp(c,0.,60.),1.);}`;
FX[1]=FXH+`void main(){vec2 uv=gl_FragCoord.xy/u_res,q=Qp();
 vec3 c=texture(u_p,uv).rgb;
 float ly=1.12-2.24*clamp((u_t-.15)/1.9,0.,1.);
 float la=smoothstep(.05,.2,u_t)*(1.-smoothstep(1.95,2.25,u_t));
 float dy=q.y-ly,px=2./u_res.y;
 float edge=smoothstep(u_asp*1.05,u_asp*.15,abs(q.x));
 float hit=Lg(vec2(uv.x,ly*.5+.5),3.)+Lg(vec2(uv.x,ly*.5+.5),5.)*.6;
 float core=exp(-abs(dy)/(px*1.1));
 float halo=exp(-abs(dy)*30.)*.16+(dy>0.?exp(-dy*6.)*.06:0.);
 float flare=exp(-abs(dy)*60.)*hit*3.;
 float streak=exp(-abs(dy)/(px*2.5))*exp(-pow(q.x*.9,2.))*.8;
 c+=la*(vec3(.88,.97,1.)*(core*1.3*(.35+.65*edge)+flare+streak)+vec3(.35,.72,.85)*halo*edge);
 c+=vec3(.8,.9,1.)*Lg(uv,1.5)*.06*step(ly,q.y)*la;
 o=vec4(clamp(c,0.,60.),1.);}`;
FX[2]=FXH+`void main(){vec2 uv=gl_FragCoord.xy/u_res,q=Qp();
 vec3 c=texture(u_p,uv).rgb;
 c+=vec3(.008,.014,.022)*exp(-dot(q,q)*1.2)*(1.-.5*smoothstep(1.2,2.4,u_t));
 float gl=smoothstep(2.,2.7,u_t)*(1.-.5*smoothstep(2.9,3.2,u_t));
 c+=vec3(.7,.88,1.)*(Lg(uv,4.)*.5+Lg(uv,6.)*.6)*gl*.32;
 o=vec4(clamp(c,0.,60.),1.);}`;
FX[3]=FXH+`float Hh(vec2 uv){return Lg(uv,1.)*.45+Lg(uv,2.5)*.35+Lg(uv,4.)*.2;}
void main(){vec2 uv=gl_FragCoord.xy/u_res,q=Qp();
 vec2 e=vec2(1.5/u_res.x,0.),f=vec2(0.,1.5/u_res.y);

/* ---------- mise en route ---------- */
const R=[];let plein=document.getElementById('plein'),pl=null,ouvert=false;
function boucle(now){requestAnimationFrame(boucle);
 if(ouvert){if(pl)pl.frame(now);return;}
 for(const r of R)if(r.vis)r.frame(now);}
function ouvrir(k){plein.style.display='block';ouvert=true;
 if(!pl)pl=new Rendu(plein.querySelector('canvas'),true);pl.key=k;pl.rejouer();}
function fermer(){plein.style.display='none';ouvert=false;}
function demarrer(){
 document.querySelectorAll('canvas[data-a]').forEach(c=>{const r=new Rendu(c,false);R.push(r);
  let deja=false;
  new IntersectionObserver(es=>{r.vis=es[0].isIntersecting;if(r.vis&&!deja){deja=true;r.rejouer();}},{threshold:.2}).observe(c);
  c.parentElement.addEventListener('click',()=>r.rejouer());});
 document.querySelectorAll('a[data-p]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();ouvrir(a.dataset.p);}));
 plein.addEventListener('click',e=>{if(e.target.classList.contains('fermer')){fermer();return;}if(pl)pl.rejouer();});
 plein.addEventListener('dblclick',fermer);
 addEventListener('keydown',e=>{if(e.key==='Escape')fermer();});
 addEventListener('resize',()=>{R.forEach(r=>r.dirty=true);if(pl)pl.dirty=true;});
 if(Q.has('plein')&&SC[Q.get('plein')]!==undefined){document.body.classList.add('capture');ouvrir(Q.get('plein'));}
 requestAnimationFrame(boucle);}
Promise.race([Promise.all([document.fonts.load('200 64px Inter'),document.fonts.load('400 16px "JetBrains Mono"')]),new Promise(r=>setTimeout(r,2500))])
 .catch(()=>{}).then(demarrer);
</script></body></html>
