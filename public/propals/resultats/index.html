<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Manrope,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#sel{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:flex;gap:3px;padding:5px;border-radius:999px;background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 36px -18px rgba(0,0,0,.45);font-size:12.5px}
#sel a{color:#171716;text-decoration:none;padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
#sel a.on{background:#171716;color:#fff}
.src{font:400 9.5px/1.4 'DM Mono',monospace;letter-spacing:.08em;opacity:.55;margin-top:10px}
.reveal{animation:rv 1s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.4s}
@keyframes rv{from{opacity:0;transform:translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

.cta{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 18px;border:0;cursor:pointer;font:500 14px Manrope,sans-serif;text-decoration:none}

/* ===== GPT · « The Skin Edit », repris trait pour trait, branche sur les vraies donnees ===== */
.gpt{--ink:#151413;--muted:#6f6a64;--paper:#f5f2ed;--line:rgba(21,20,19,.14);background:radial-gradient(circle at 92% 11%,rgba(237,194,172,.37),transparent 23%),radial-gradient(circle at 5% 76%,rgba(214,227,205,.35),transparent 22%),var(--paper);color:var(--ink);min-height:100vh;padding:calc(90px + env(safe-area-inset-top)) 4vw 110px}
.gpt .top{position:fixed;top:0;left:0;right:0;z-index:10;padding:22px 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(21,20,19,.08);background:linear-gradient(180deg,rgba(245,242,237,.9),rgba(245,242,237,.3));backdrop-filter:blur(18px)}
.gpt .logo{font:600 14px Manrope;letter-spacing:.22em}.gpt .logo i{font:500 14px 'Playfair Display';font-style:italic;letter-spacing:0}
.gpt .eyebrow{font:400 10px 'DM Mono';letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.gpt h2{font:400 clamp(52px,9vw,120px)/.82 'Playfair Display';letter-spacing:-.07em;margin:14px 0 0}
.gpt .head{display:flex;justify-content:space-between;gap:20px;align-items:end;padding-bottom:36px}.gpt .head p{max-width:30ch;color:var(--muted);font-size:13px;line-height:1.6}
.gpt .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}
.gpt .card{border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,255,255,.27));box-shadow:inset 0 1px rgba(255,255,255,.92),0 28px 60px -54px rgba(28,20,13,.55);overflow:hidden;position:relative}
.gpt .score-card{min-height:440px;padding:28px}
.gpt .score-card h3{font:400 31px/1 'Playfair Display';letter-spacing:-.05em;margin:56px 0 0;max-width:9ch}
.gpt .score{font:400 clamp(120px,19vw,250px)/.78 'Playfair Display';letter-spacing:-.1em;margin:30px 0 0;display:flex;align-items:flex-start}
.gpt .score sup{font:400 13px 'DM Mono';letter-spacing:0;margin:.4em 0 0 .6em}
.gpt .disc{position:absolute;width:200px;aspect-ratio:1;border-radius:50%;right:7%;top:20%;background:conic-gradient(from 15deg,#e6d0bc,#d9cfaf,#f4dfb7,#cab9cf,#e6d0bc);animation:spin 7.5s linear infinite;box-shadow:0 15px 30px rgba(72,51,37,.14)}
.gpt .disc:after{content:'';position:absolute;inset:24%;border-radius:50%;background:linear-gradient(145deg,#f9f6ef,#efe9df);box-shadow:inset 0 1px #fff}
.gpt .note{position:absolute;bottom:26px;left:28px;right:28px;max-width:34ch;color:var(--muted);font-size:13px;line-height:1.55}
.gpt .routine{padding:26px;display:flex;flex-direction:column}
.gpt .routine h3{font:400 33px/1 'Playfair Display';letter-spacing:-.06em;margin:13px 0 24px}
.gpt .prod{display:grid;grid-template-columns:70px 1fr auto;gap:13px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;transition:padding .45s,background .45s}
.gpt .prod:hover{padding-left:7px;background:rgba(255,255,255,.27)}
.gpt .prod img{width:62px;height:78px;object-fit:contain;filter:drop-shadow(0 16px 12px rgba(36,27,21,.16))}
.gpt .prod b{font-size:12.5px;display:block;line-height:1.3}.gpt .prod span{font-size:10.5px;color:var(--muted);display:block;margin-top:4px}.gpt .prod em{font:400 10px 'DM Mono';font-style:normal;color:#a78151}
.gpt .cta{background:var(--ink);color:#fff;margin-top:16px;border-radius:2px}
.gpt .signals{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:15px}
.gpt .signal{padding:21px;border-top:1px solid rgba(21,20,19,.58)}.gpt .signal:nth-child(2){border-top-color:rgba(198,163,107,.72)}
.gpt .signal b{font:400 30px/1 'Playfair Display';letter-spacing:-.05em;display:block;margin:14px 0 7px}.gpt .signal p{color:var(--muted);font-size:11.5px;line-height:1.5}
.gpt .assiette{margin-top:15px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:20px;text-decoration:none;color:inherit}
.gpt .assiette h4{font:400 30px/1 'Playfair Display';letter-spacing:-.05em;margin-top:10px}
@media(max-width:760px){.gpt .head{display:block}.gpt .head p{margin-top:20px}.gpt .grid{grid-template-columns:1fr}.gpt .score-card{min-height:380px}.gpt .disc{width:140px;top:26%}.gpt .signals{grid-template-columns:1fr;gap:0}.gpt .signal{display:grid;grid-template-columns:110px 1fr;align-items:center}.gpt .signal b{margin:0}}

/* affinages 30/09 : grain de papier, titre metallique, vitrine de l'assiette, bouton toujours accessible */
.gpt:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.16;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E")}
.gpt h2 em{font-style:italic;background:linear-gradient(105deg,#302923 0%,#7c6858 27%,#d0ac8b 49%,#604e43 75%,#302923 100%);background-size:210% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:metal 9s ease-in-out infinite}
@keyframes metal{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.gpt .ass{margin-top:15px;padding:26px}
.gpt .ass h3{font:400 38px/.95 'Playfair Display';letter-spacing:-.06em;margin:12px 0 10px}
.gpt .ass .na{color:var(--muted);font-size:13px;line-height:1.55;max-width:46ch}
.gpt .vit{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.gpt .vit a{position:relative;display:block;padding:14px 12px 16px;border-radius:22px;background:radial-gradient(80% 60% at 50% 34%,#fff,rgba(255,255,255,.35));border:1px solid rgba(21,20,19,.08);text-decoration:none;color:inherit;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.gpt .vit a:hover{transform:translateY(-4px)}
.gpt .vit img{display:block;width:100%;height:118px;object-fit:contain;filter:drop-shadow(0 18px 14px rgba(36,27,21,.18));animation:flotte 5s ease-in-out infinite alternate}
.gpt .vit a:nth-child(2) img{animation-delay:-1.2s}.gpt .vit a:nth-child(3) img{animation-delay:-2.4s}.gpt .vit a:nth-child(4) img{animation-delay:-3.6s}
@keyframes flotte{to{transform:translateY(-6px)}}
.gpt .vit i{display:block;width:44px;height:44px;border-radius:50%;margin:37px auto}
.gpt .vit em{position:absolute;top:12px;right:14px;font:400 10px 'DM Mono';font-style:normal;color:#a78151}
.gpt .vit b{display:block;font:400 21px/1 'Playfair Display';letter-spacing:-.04em;margin-top:10px}
.gpt .vit span{display:block;font-size:10.5px;color:var(--muted);margin-top:5px}
.gpt .vit p{font-size:11.5px;line-height:1.45;color:#4f4a44;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gpt .collant{position:fixed;left:16px;right:16px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:40;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;background:#151413;color:#fff;border-radius:2px;text-decoration:none;font:500 13.5px Manrope,sans-serif;box-shadow:0 20px 40px -18px rgba(0,0,0,.6);transform:translateY(140%);transition:transform .6s cubic-bezier(.22,1,.36,1)}
.gpt .collant.on{transform:none}
@media(min-width:900px){.gpt .vit{grid-template-columns:repeat(4,1fr)}.gpt .collant{left:auto;right:4vw;width:340px}}
@media(max-width:760px){.gpt h2{font-size:58px}.gpt .score-card h3{margin-top:40px}.gpt .score{font-size:128px}.gpt .disc{width:118px;right:6%;top:18%}}
/* ===== R1 · « Anneaux » : blanc Apple, quatre anneaux comme une montre ===== */
.r1{background:linear-gradient(180deg,#fbfbfd 0%,#f1f2f4 60%,#e9ebee 100%);color:#1d1d1f;min-height:100vh;padding:calc(34px + env(safe-area-inset-top)) 22px 120px;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.r1 .m{font-size:11px;font-weight:600;letter-spacing:.06em;color:#86868b;text-transform:uppercase}
.r1 h1{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:8px 0 6px}
.r1 .sous{font-size:17px;color:#6e6e73;line-height:1.45;max-width:30ch}
.r1 .anneaux{display:flex;align-items:center;gap:22px;margin:28px 0 8px}
.r1 .anneaux svg{flex:none}
.r1 .leg div{display:flex;align-items:baseline;gap:8px;font-size:14px;color:#1d1d1f;margin:5px 0}.r1 .leg i{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(-1px)}.r1 .leg b{font-weight:600;font-variant-numeric:tabular-nums}
.r1 .bloc{background:#fff;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 20px 40px -30px rgba(0,0,0,.25)}
.r1 .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -22px 0;padding:4px 22px 10px;scrollbar-width:none}
.r1 .p{flex:none;width:72%;max-width:290px;scroll-snap-align:start;background:#fff;border-radius:22px;padding:18px;box-shadow:0 20px 40px -30px rgba(0,0,0,.3);text-decoration:none;color:inherit}
.r1 .p .n{font-size:12px;font-weight:600;color:#86868b}.r1 .p img{display:block;width:100%;height:170px;object-fit:contain;margin:10px 0}.r1 .p b{display:block;font-size:12px;color:#86868b;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.r1 .p span{display:block;font-size:16px;font-weight:500;margin-top:3px;line-height:1.3}
.r1 .cta{background:#1d1d1f;color:#fff;border-radius:14px;margin-top:18px;font-family:inherit}
/* ===== R2 · « Maree » : editorial sauge, italique, comme l'assiette ===== */
.r2{background:#dce7e1;color:#183b3e;min-height:100vh;padding:calc(34px + env(safe-area-inset-top)) 24px 120px;font-family:"Helvetica Neue",Arial,sans-serif}
.r2 .m{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase}
.r2 h1{font:italic 400 76px/.9 Georgia,serif;letter-spacing:-5px;margin:12px 0 16px}
.r2 .lead{font-size:14.5px;line-height:1.7;font-weight:300;max-width:360px}
.r2 .chiffre{display:flex;align-items:baseline;gap:10px;margin:26px 0 0}.r2 .chiffre b{font:italic 400 120px/.8 Georgia,serif;letter-spacing:-6px}.r2 .chiffre span{font-size:11px;letter-spacing:1.6px;text-transform:uppercase}
.r2 .ruban{display:flex;overflow-x:auto;margin:28px -24px;border-top:1px solid rgba(24,59,62,.2);border-bottom:1px solid rgba(24,59,62,.2);scrollbar-width:none}
.r2 .ruban span{flex:1 0 auto;padding:14px 14px;text-align:center;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap}.r2 .ruban span b{display:block;font:italic 22px Georgia,serif;letter-spacing:0;text-transform:none;margin-bottom:4px}
.r2 .rit{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid rgba(24,59,62,.2);text-decoration:none;color:inherit;align-items:center}
.r2 .rit>i{font:italic 28px Georgia,serif;min-width:36px}.r2 .rit img{width:64px;height:80px;object-fit:contain;flex:none}.r2 .rit h3{font-size:19px;font-weight:300;letter-spacing:-.2px}.r2 .rit p{font-size:11.5px;color:#52716f;margin-top:4px;letter-spacing:.3px;text-transform:uppercase}
.r2 .as{margin:30px -24px 0;padding:32px 24px;background:#173d3f;color:#e3eee7;display:block;text-decoration:none}.r2 .as h2{font:italic 400 54px/.95 Georgia,serif;letter-spacing:-3px;margin:8px 0 10px}
/* ===== R3 · « Studio nuit » : noir, champagne, chiffres tres fins ===== */
.r3{background:radial-gradient(120% 60% at 50% 0%,#1b1a17 0%,#0a0a09 60%);color:#f2efe9;min-height:100vh;padding:calc(34px + env(safe-area-inset-top)) 22px 120px;font-family:Manrope,sans-serif}
.r3 .m{font:400 10px 'DM Mono';letter-spacing:.2em;color:#b9a27a;text-transform:uppercase}
.r3 .grand{font:200 150px/.8 Manrope,sans-serif;letter-spacing:-.07em;margin:20px 0 4px;background:linear-gradient(180deg,#fff,#b9a27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.r3 h1{font:300 30px/1.1 Manrope;letter-spacing:-.03em;margin-top:10px}.r3 h1 em{font:italic 400 32px 'Playfair Display'}
.r3 .barres{margin-top:26px}.r3 .barre{display:grid;grid-template-columns:120px 1fr 34px;gap:12px;align-items:center;font-size:12.5px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.r3 .barre .l{height:2px;background:rgba(255,255,255,.1);position:relative;border-radius:2px}.r3 .barre .l i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a7552,#f1dfb5);border-radius:2px;box-shadow:0 0 12px rgba(241,223,181,.5);transition:width 1.4s cubic-bezier(.22,1,.36,1)}
.r3 .barre.faible{color:#f1dfb5}.r3 .barre b{font-weight:300;text-align:right;font-variant-numeric:tabular-nums}
.r3 .vitrine{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.r3 .v{border-radius:20px;padding:14px;background:radial-gradient(80% 60% at 50% 35%,rgba(241,223,181,.14),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);text-decoration:none;color:inherit}
.r3 .v img{display:block;width:100%;height:130px;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(0,0,0,.6))}.r3 .v small{font:400 9.5px 'DM Mono';letter-spacing:.12em;color:#b9a27a}.r3 .v span{display:block;font-size:12.5px;margin-top:4px;line-height:1.3}
.r3 .cta{background:linear-gradient(90deg,#f1dfb5,#b9a27a);color:#141311;border-radius:14px;margin-top:18px}
</style>

<body>
<div id="page"></div>
<nav id="sel"><a data-v="gpt">GPT fidèle</a><a data-v="r1">Anneaux</a><a data-v="r2">Marée</a><a data-v="r3">Studio nuit</a></nav>
<script src="/scan/aliment/vy-aliment.js?v=44"></script>
<script>
/* Propositions pour la page de resultats. Donnees : votre DERNIER VRAI SCAN sur cet appareil (vyvre_scan_scores,
   vyvre_score, vyvre_rituel, vyvre_scan_at). Sans scan sur cet appareil : un exemple, signale comme tel. */
const lire = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
let S = lire('vyvre_scan_scores'), G = +(localStorage.getItem('vyvre_score') || 0), R = lire('vyvre_rituel'), AT = localStorage.getItem('vyvre_scan_at'), VRAI = !!(S && G);
if(!VRAI){ S = { glow:47, redness:58, hydration:52, pores:58, sebum:36, pigmentation:25, wrinkles:61, firmness:66 }; G = 67; }
if(!R || !R.length) R = [{"name":"Black Diamond Vitamin C Brightening Booster","brand":"111SKIN","img":"/scan/products/111skin/v2/cutout/black-diamond-vitamin-c-brightening-booster.webp","url":"https://111skin.com/en-eu/products/vitamin-c-brightening-booster","cible":"glow","categorie":"serum"},{"name":"Crème légère dermatologique hydratante","brand":"A-Derma","img":"/scan/products/a-derma/v2/cutout/creme-legere-dermatologique-hydratante.webp","url":"https://www.aderma.fr/fr-fr/p/creme-legere-dermatologique-hydratante-3282770146646-14c39aab","cible":"hydration","categorie":"creme"},{"name":"Azelaic Acid 10 Hyaluron Redness Soothing Serum","brand":"Anua","img":"/scan/products/anua/v2/cutout/azelaic-acid-10-hyaluron-redness-soothing-serum.webp","url":"https://anua.com/products/azelaic-acid-10-hyaluron-redness-soothing-serum","cible":"redness","categorie":"serum"},{"name":"Le traitement resurfaçant","brand":"Aime","img":"/scan/products/aime/v2/cutout/le-traitement-resurfacant.webp","url":"https://aime.co/products/traitement-resurfacant","cible":"wrinkles","categorie":"creme"}];
/* les indices, dans le sens « plus haut = mieux », comme sur la page de resultats du scan */
const IND = [['Éclat', S.glow], ['Apaisement', S.redness], ['Hydratation', S.hydration], ['Pores', S.pores], ['Équilibre du sébum', S.sebum != null ? 100 - S.sebum : null], ['Uniformité', S.pigmentation != null ? 100 - S.pigmentation : null], ['Fermeté', S.firmness], ['Peau lisse', S.wrinkles]].filter(x => x[1] != null).map(x => ({ n:x[0], v:Math.round(x[1]) }));
const TRI = IND.slice().sort((a, b) => a.v - b.v), FAIBLE = TRI[0], FORT = TRI[TRI.length - 1];
const CIBLE = { glow:'Éclat', redness:'Apaisement', hydration:'Hydratation', pores:'Pores', sebum:'Sébum', pigmentation:'Uniformité', wrinkles:'Peau lisse', firmness:'Fermeté' };
const CAT = { serum:'Sérum', creme:'Crème', 'solaire-visage':'Solaire' };
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const quand = AT ? new Date(+AT || AT) : null, DATE = quand && !isNaN(quand) ? quand.toLocaleDateString('fr-FR', { day:'numeric', month:'long' }) : null;
const SRC = VRAI ? 'Votre dernière lecture' + (DATE ? ' du ' + DATE : '') + ', sur cet appareil. Mesures optiques, pas un diagnostic.' : 'Exemple : aucun scan trouvé sur cet appareil. Faites un scan sur vyvre.fr/scan, puis revenez ici.';
const lib = s => s >= 75 ? 'Très bel équilibre' : s >= 60 ? 'Bel équilibre' : s >= 45 ? 'À soutenir' : 'À chouchouter';
const ASS = '/scan/?assiette=1';
function compter(el, fin){ const t0 = performance.now(); (function k(n){ const u = Math.min(1, (n - t0)/1400); el.textContent = Math.round(fin*(1 - Math.pow(1 - u, 3))); if(u < 1) requestAnimationFrame(k); })(t0); }

const V = {
gpt: () => `<div class="gpt"><header class="top"><div class="logo">VYVRE <i>skin intelligence</i></div><span class="eyebrow">${VRAI ? 'Votre lecture' : 'Exemple'}</span></header>
  <div class="head reveal"><div><div class="eyebrow">Votre skin edit / ${DATE ? esc(DATE) : 'aujourd’hui'}</div><h2>${esc(FORT.n)},<br><em>votre force.</em></h2></div><p>Votre point fort aujourd’hui : ${esc(FORT.n.toLowerCase())} (${FORT.v} sur 100). À soutenir en priorité : ${esc(FAIBLE.n.toLowerCase())} (${FAIBLE.v} sur 100). Une lecture pour vous accompagner, pas pour vous juger.</p></div>
  <div class="grid"><article class="card score-card reveal d1"><div class="eyebrow">Vyvre index</div><div class="disc"></div><h3>${esc(lib(G))}</h3><div class="score"><span id="sc">0</span><sup>/100</sup></div><p class="note">Indice global de votre lecture. ${esc(FORT.n)} est votre meilleur point ; ${esc(FAIBLE.n.toLowerCase())} est celui que votre rituel soutient d’abord.</p></article>
