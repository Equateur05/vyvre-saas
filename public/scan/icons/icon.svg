<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="65%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="50%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#8E7847"/>
    </linearGradient>
    <linearGradient id="textShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#ambient)"/>
  <!-- Subtle ring (signifier: scan, light, halo) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldShine)" stroke-width="1.5" opacity="0.45"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.18"/>
  <!-- Wordmark V (Inter Thin / Vyvre identity) -->
  <text x="256" y="312" font-family="Inter, system-ui, sans-serif" font-size="220" font-weight="100" fill="url(#textShine)"
        text-anchor="middle" letter-spacing="-12">V</text>
  <!-- Small accent dot above the V -->
  <circle cx="256" cy="148" r="4" fill="url(#goldShine)"/>
</svg>
