<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>banc mediapipe cheveux</title></head>
<body style="background:#000;color:#fff;font:13px monospace">
<div id="etat">chargement du modele…</div>
<script type="module">
import { FilesetResolver, ImageSegmenter } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const etat = document.getElementById('etat');
window.RES = {}; window.FINI = false; window.ERR = null;
try {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const seg = await ImageSegmenter.createFromOptions(fs, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/latest/hair_segmenter.tflite", delegate: "CPU" },
    runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: true
  });
  const liste = await (await fetch('liste.json')).json();
  let n = 0;
  for (const c of liste) {
    const img = new Image(); img.src = c.f; await img.decode();
    const t0 = performance.now();
    const r = seg.segment(img);
    const ms = performance.now() - t0;
    /* masque de confiance « cheveux » (index 1) */
    const conf = r.confidenceMasks[1] || r.confidenceMasks[0];
    const w = conf.width, h = conf.height, a = conf.getAsFloat32Array();
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d'), id = g.createImageData(w, h);
    let tot = 0;
    for (let i = 0; i < a.length; i++) { const v = Math.round(a[i]*255); id.data[i*4]=v; id.data[i*4+1]=v; id.data[i*4+2]=v; id.data[i*4+3]=255; if (a[i] > .5) tot++; }
    g.putImageData(id, 0, 0);
    window.RES[c.f] = { w, h, ms: Math.round(ms), part: +(tot / a.length).toFixed(4), png: cv.toDataURL('image/png') };
    r.close && r.close();
    n++; etat.textContent = n + ' / ' + liste.length;
  }
  window.FINI = true; etat.textContent = 'fini : ' + n;
} catch (e) { window.ERR = String(e && e.message || e); etat.textContent = 'ERREUR ' + window.ERR; }
</script></body></html>
